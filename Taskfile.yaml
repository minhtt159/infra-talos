---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

set: [pipefail]

vars:
  OMNI_CLUSTER_FILE: "{{.ROOT_DIR}}/bootstrap/temp-cluster/omni-cluster.yaml"
  CLUSTER_NAME: talos-temp
  HELMFILE_CRDS: "{{.ROOT_DIR}}/bootstrap/helmfile.d/00-crds.yaml"
  HELMFILE_APPS: "{{.ROOT_DIR}}/bootstrap/helmfile.d/01-apps.yaml"

env:
  KUBECONFIG: "{{.ROOT_DIR}}/kubeconfig"

tasks:
  default: task --list

  cluster:validate:
    desc: Validate the Omni cluster template
    cmd: omnictl cluster template validate -f {{.OMNI_CLUSTER_FILE}}
    preconditions:
      - msg: Missing Omni cluster template
        sh: test -f {{.OMNI_CLUSTER_FILE}}

  cluster:sync:
    desc: Provision / update Talos nodes via Omni
    deps: [cluster:validate]
    cmd: omnictl cluster template sync -f {{.OMNI_CLUSTER_FILE}}

  cluster:kubeconfig:
    desc: Fetch the cluster kubeconfig from Omni into ./kubeconfig
    cmd: omnictl kubeconfig {{.KUBECONFIG}} --cluster {{.CLUSTER_NAME}} --force

  cluster:delete:
    desc: Delete the cluster from Omni (DESTRUCTIVE)
    prompt: Delete cluster '{{.CLUSTER_NAME}}' from Omni?
    cmd: omnictl cluster template delete -f {{.OMNI_CLUSTER_FILE}}
    preconditions:
      - msg: Missing Omni cluster template
        sh: test -f {{.OMNI_CLUSTER_FILE}}

  bootstrap:crds:
    desc: Install CRDs from the bootstrap Helm charts
    cmd: |
      helmfile --file {{.HELMFILE_CRDS}} template \
        | yq ea 'select(.kind == "CustomResourceDefinition")' \
        | kubectl apply --server-side -f -
    preconditions:
      - msg: Missing kubeconfig — run 'task cluster:kubeconfig'
        sh: test -f {{.KUBECONFIG}}

  bootstrap:apps:
    desc: Install cluster prerequisites (cilium, coredns, cert-manager, flux)
    cmd: helmfile --file {{.HELMFILE_APPS}} sync
    preconditions:
      - msg: Missing kubeconfig — run 'task cluster:kubeconfig'
        sh: test -f {{.KUBECONFIG}}

  bootstrap:
    desc: Bootstrap the cluster — CRDs then apps (after cluster:sync + kubeconfig)
    cmds:
      - task: bootstrap:crds
      - task: bootstrap:apps

  reconcile:
    desc: Force Flux to pull and apply the latest Git revision
    cmd: flux reconcile kustomization cluster-apps -n flux-system --with-source
