---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

set: [pipefail]

vars:
  CLUSTER_NAME: homelab
  HELMFILE_CRDS: "{{.ROOT_DIR}}/bootstrap/helmfile.d/00-crds.yaml"
  HELMFILE_APPS: "{{.ROOT_DIR}}/bootstrap/helmfile.d/01-apps.yaml"

env:
  KUBECONFIG: "{{.ROOT_DIR}}/kubeconfig"

tasks:
  default: task --list

  # Node provisioning, talosconfig and disk inventory live in the private Omni repo
  # (omni-selfhosted). Kept here: kubeconfig, bootstrap, PV export for rebuilds.

  cluster:kubeconfig:
    desc: Fetch the cluster kubeconfig from Omni into ./kubeconfig
    cmd: omnictl kubeconfig {{.KUBECONFIG}} --cluster {{.CLUSTER_NAME}} --force

  bootstrap:crds:
    desc: Install CRDs from the bootstrap Helm charts
    cmd: |
      helmfile --file {{.HELMFILE_CRDS}} template \
        | yq ea 'select(.kind == "CustomResourceDefinition")' \
        | kubectl apply --server-side -f -
    preconditions:
      - msg: Missing kubeconfig — run 'task cluster:kubeconfig'
        sh: test -f {{.KUBECONFIG}}

  bootstrap:apps:
    desc: Install cluster prerequisites (cilium, coredns, cert-manager, flux)
    cmd: helmfile --file {{.HELMFILE_APPS}} sync
    preconditions:
      - msg: Missing kubeconfig — run 'task cluster:kubeconfig'
        sh: test -f {{.KUBECONFIG}}
      - msg: Missing SECRET_DOMAIN env (coredns split-horizon zone) — export it first
        sh: test -n "$SECRET_DOMAIN"

  bootstrap:
    desc: Bootstrap the cluster — CRDs then apps (after nodes are up + kubeconfig)
    cmds:
      - task: bootstrap:crds
      - task: bootstrap:apps

  pv:export:
    desc: Export democratic-csi PV/PVC manifests for post-rebuild reclaim
    cmds:
      - mkdir -p backups/pv
      # Strip runtime-only fields so the manifests re-apply cleanly
      - >-
        kubectl get pv -o json
        | yq -P '.items[] | select(.spec.csi.driver | test("^org\.democratic-csi\."))
        | del(.metadata.uid, .metadata.resourceVersion, .metadata.creationTimestamp,
              .metadata.annotations, .metadata.finalizers, .spec.claimRef.uid,
              .spec.claimRef.resourceVersion, .status)
        | split_doc' > backups/pv/persistentvolumes.yaml
      - >-
        kubectl get pvc -A -o json
        | yq -P '.items[] | select(.spec.storageClassName | test("^truenas-"))
        | del(.metadata.uid, .metadata.resourceVersion, .metadata.creationTimestamp,
              .metadata.annotations, .metadata.finalizers, .status)
        | split_doc' > backups/pv/persistentvolumeclaims.yaml
      - echo "Exported to backups/pv/ (gitignored, holds storage LAN IPs) — never commit it"
    preconditions:
      - msg: Missing kubeconfig
        sh: test -f {{.KUBECONFIG}}
