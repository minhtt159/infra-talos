---
name: "PR Size"

on:
  pull_request_target:
    types: ["opened", "synchronize", "reopened"]

jobs:
  size:
    name: Size label
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Size label
        uses: codelytv/pr-size-labeler@095a41fca88b8764fd9e008ad269bcdb82bb38b9 # v1.10.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          xs_label: size/XS
          xs_max_size: "10"
          s_label: size/S
          s_max_size: "100"
          m_label: size/M
          m_max_size: "500"
          l_label: size/L
          l_max_size: "1000"
          xl_label: size/XL
          fail_if_xl: "false"
          message_if_xl: ""
          # generated/vendored diffs shouldn't inflate the size label
          files_to_ignore: |
            "*.lock"
