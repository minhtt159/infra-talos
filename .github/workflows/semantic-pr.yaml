---
name: "Semantic PR"

on:
  pull_request_target:
    types: ["opened", "edited", "synchronize", "reopened"]

permissions:
  pull-requests: read

jobs:
  semantic:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Conventional Commit types this repo uses (matches Renovate + commit history)
          types: |
            feat
            fix
            chore
            docs
            ci
            refactor
            build
            perf
            test
          requireScope: false
