<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6e7781"/>
    </marker>
    <style>
      .box{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.2;rx:6}
      .hi{fill:#ddf4ff;stroke:#54aeff}
      .t{fill:#1f2328;text-anchor:middle}
      .s{fill:#57606a;text-anchor:middle;font-size:11.5px}
      .e{stroke:#6e7781;stroke-width:1.4;fill:none;marker-end:url(#a)}
      .l{fill:#57606a;font-size:11px}
      .sep{stroke:#8c959f;stroke-width:1;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect class="box" x="130" y="10" width="300" height="46"/>
  <text class="t" x="280" y="29">Sidero Omni</text>
  <text class="s" x="280" y="46">provisions Talos nodes</text>
  <path class="e" d="M280 56V98"/>

  <line class="sep" x1="20" y1="77" x2="540" y2="77"/>
  <text class="l" x="20" y="72">layer 1 · private repo (Omni template)</text>
  <text class="l" x="20" y="92">layers 2–3 · this repo</text>

  <rect class="box" x="130" y="100" width="300" height="46"/>
  <text class="t" x="280" y="119">Helmfile bootstrap</text>
  <text class="s" x="280" y="136">cilium → coredns → cert-manager → flux</text>
  <path class="e" d="M280 146V178"/>

  <rect class="box hi" x="130" y="180" width="300" height="46"/>
  <text class="t" x="280" y="199">flux-instance</text>
  <text class="s" x="280" y="216">syncs this Git repo</text>
  <path class="e" d="M280 226V258"/>
  <text class="l" x="292" y="246">Flux owns everything from here</text>

  <rect class="box" x="130" y="260" width="300" height="46"/>
  <text class="t" x="280" y="279">kubernetes/flux/cluster/ks.yaml</text>
  <text class="s" x="280" y="296">Kustomization cluster-apps</text>
  <path class="e" d="M280 306V338"/>

  <rect class="box" x="130" y="340" width="300" height="46"/>
  <text class="t" x="280" y="359">kubernetes/apps/&lt;ns&gt;/&lt;app&gt;/ks.yaml</text>
  <text class="s" x="280" y="376">per-app Kustomizations → app/ (HelmRelease, CRs)</text>
</svg>
