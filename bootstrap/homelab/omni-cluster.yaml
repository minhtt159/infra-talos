kind: Cluster
name: homelab
kubernetes:
  # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
  version: v1.36.2
talos:
  # renovate: datasource=docker depName=ghcr.io/siderolabs/installer
  version: v1.13.5
features:
  enableWorkloadProxy: true
  useEmbeddedDiscoveryService: true
  # backupConfiguration:
  #   interval: 24h
patches:
  - file: patches/global/machine-file.yaml
  - file: patches/global/machine-kubelet.yaml
  - file: patches/global/machine-network.yaml
  - file: patches/global/machine-sysctls.yaml
  - file: patches/global/machine-time.yaml
  - file: patches/global/machine-encryption.yaml
---
kind: ControlPlane
machines:
  - 66c1d280-4d8a-11f1-9e14-326c0d981000 # mini-talos-01
  - fe73f080-4d8b-11f1-9061-633102380e00 # mini-talos-02
  - fa4df0b9-6d3b-4194-9e38-4ceec7b7f379 # mini-talos-03
patches:
  - file: patches/controller/cluster-patch.yaml
  - name: patch-label
    inline:
      machine:
        nodeLabels:
          role: master
---
kind: Workers
machines:
  - 33303734-3966-3030-3966-346234636131 # turing-01
  - 64306566-3266-6634-3566-346632363063 # turing-03
  - b1e583f1-b1de-44f9-860b-812e9917f2d0 # mini-talos-04
  # - 30303031-3030-3030-6232-353461303639 # turing-04 (CM4)
patches:
  - name: patch-label
    inline:
      machine:
        nodeLabels:
          role: worker
---
kind: Machine
# mini-talos-01
name: 66c1d280-4d8a-11f1-9e14-326c0d981000
install:
  disk: /dev/nvme0n1
systemExtensions:
  - siderolabs/qemu-guest-agent
  - siderolabs/util-linux-tools
  - siderolabs/iscsi-tools
---
kind: Machine
# mini-talos-02
name: fe73f080-4d8b-11f1-9061-633102380e00
install:
  disk: /dev/nvme0n1
systemExtensions:
  - siderolabs/qemu-guest-agent
  - siderolabs/util-linux-tools
  - siderolabs/iscsi-tools
---
kind: Machine
# mini-talos-03
name: fa4df0b9-6d3b-4194-9e38-4ceec7b7f379
install:
  disk: /dev/disk/by-id/nvme-WDS100T3X0C-00SJG0_21101U460209
systemExtensions:
  - siderolabs/qemu-guest-agent
  - siderolabs/util-linux-tools
  - siderolabs/iscsi-tools
---
kind: Machine
# turing-01
name: 33303734-3966-3030-3966-346234636131
install:
  disk: /dev/disk/by-id/nvme-WDC_WDS500G2B0C-00PXH0_210541801953
patches:
  - name: enable-gasket
    inline:
      machine:
        udev:
          rules:
            - SUBSYSTEM=="apex", MODE="0660", GROUP="44"
  - name: inline-label
    inline:
      machine:
        nodeLabels:
          capability: coral
systemExtensions:
  - siderolabs/gasket-driver
  - siderolabs/util-linux-tools
  - siderolabs/iscsi-tools
---
kind: Machine
# turing-03
name: 64306566-3266-6634-3566-346632363063
install:
  disk: /dev/disk/by-id/nvme-WDC_WDS500G2B0C-00PXH0_210541802916
systemExtensions:
  - siderolabs/util-linux-tools
  - siderolabs/iscsi-tools
# ---
# kind: Machine
# # turing-04 (CM4)
# name: 30303031-3030-3030-6232-353461303639
# install:
#   disk: /dev/sda # model: Flash Drive FIT
# systemExtensions:
#   - siderolabs/iscsi-tools
---
kind: Machine
# mini-talos-04
name: b1e583f1-b1de-44f9-860b-812e9917f2d0
install:
  disk: /dev/nvme0n1
systemExtensions:
  - siderolabs/util-linux-tools
  - siderolabs/iscsi-tools
  - siderolabs/qemu-guest-agent
  - siderolabs/xe
