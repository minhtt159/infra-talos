machine:
  kubelet:
    extraArgs:
      # Kubelet serving certs signed by cluster CA instead of self-signed.
      # Pair: kubelet-csr-approver (kubernetes/apps/kube-system) approves the
      # serving CSRs — without it, port 10250 has no cert and scrapes fail.
      rotate-server-certificates: true
    extraConfig:
      serializeImagePulls: false
    nodeIP:
      validSubnets:
        - 10.1.80.0/24
