machine:
  features:
    hostDNS:
      enabled: true
      # Off for Cilium bpf.masquerade: the 169.254 host-DNS forward breaks
      # under BPF masquerading (siderolabs/talos#10002). With this false,
      # cilium bpf.hostLegacyRouting can stay false (full BPF fastpath).
      forwardKubeDNSToHost: false
  network:
    disableSearchDomain: true
    nameservers:
      # Router
      - 10.1.80.1
      # Cloudflare
      - 1.1.1.1
      # - 1.0.0.1
cluster:
  network:
    podSubnets:
      - 10.69.0.0/16
    serviceSubnets:
      - 10.96.0.0/16
