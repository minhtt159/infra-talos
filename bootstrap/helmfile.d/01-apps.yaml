---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

# helmfile --file bootstrap/helmfile.d/01-apps.yaml sync

helmDefaults:
  wait: true
  waitForJobs: true
  cleanupOnFail: true

releases:
  - name: cilium
    namespace: kube-system
    chart: oci://quay.io/cilium/charts/cilium
    version: 1.20.4
    values:
      - ./templates/values.yaml.gotmpl
      # Bootstrap-only override: hubble-relay needs cluster DNS, coredns
      # `needs` cilium, and helmDefaults wait:true — enabling hubble here
      # deadlocks the bootstrap. Flux flips hubble on afterwards from the
      # HelmRelease values (no manual toggle needed anymore).
      - hubble:
          enabled: false
          relay:
            enabled: false
          ui:
            enabled: false

  - name: coredns
    namespace: kube-system
    chart: oci://ghcr.io/coredns/charts/coredns
    version: 1.49.0
    values:
      - ./templates/values.yaml.gotmpl
    needs:
      - kube-system/cilium

  - name: cert-manager
    namespace: cert-manager
    chart: oci://quay.io/jetstack/charts/cert-manager
    version: v1.21.3
    values:
      - ./templates/values.yaml.gotmpl
    needs:
      - kube-system/coredns

  - name: flux-operator
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
    version: 0.62.1
    values:
      - "./templates/values.yaml.gotmpl"
    needs:
      - "cert-manager/cert-manager"

  - name: flux-instance
    namespace: flux-system
    chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
    version: 0.62.1
    values:
      - "./templates/values.yaml.gotmpl"
    needs:
      - "flux-system/flux-operator"
