---
# autoSync false on purpose. Promotion into this file is Kargo's; applying it
# stays a human's.
env: production
chartVersion: 1.0.2
autoSync: false
values:
  database:
    # Generated by CNPG from the per-env Cluster; `uri` is a ready DSN.
    existingSecret: bank0-production-app
    secretKey: uri
  auth:
    existingSecret: bank0-auth
    secretKey: jwt-secret
  # See staging.yaml for why the forwarded header is trusted here.
  trustProxyHeaders: true
  trustedProxyHops: 1
  gateway:
    create: false
  api:
    exposed: false
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
  portal:
    exposed: false
    replicaCount: 2
  metrics:
    serviceMonitor:
      enabled: true
    dashboard:
      enabled: true
