---
# autoSync false on purpose. Promotion into this file is Kargo's; applying it
# stays a human's.
env: production
chartVersion: 1.1.0
autoSync: false
values:
  database:
    # Generated by CNPG from the per-env Cluster; `uri` is a ready DSN.
    existingSecret: bank0-production-app
    secretKey: uri
  auth:
    existingSecret: bank0-auth
    secretKey: jwt-secret
  # See staging.yaml for why the forwarded header is trusted here.
  trustProxyHeaders: true
  # 2, not 1: this env is on envoy-external, so internet traffic arrives through
  # cloudflared AND Envoy. CF-Connecting-IP covers the common case (Cloudflare
  # replaces it outright); this is for a request that shows up without it, where
  # XFF is read right-to-left and the second entry from the right is the client.
  trustedProxyHops: 2
  gateway:
    create: false
  api:
    exposed: false
    replicaCount: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
  portal:
    exposed: false
    replicaCount: 2
  metrics:
    serviceMonitor:
      enabled: true
    dashboard:
      enabled: true
