---
# One file per bank0 env. Git file generator turns each into an Application.
# chartVersion is the line Kargo rewrites on promote — keep it a plain literal.
env: staging
chartVersion: 1.0.2
autoSync: true
values:
  database:
    # Generated by CNPG from the per-env Cluster; `uri` is a ready DSN.
    existingSecret: bank0-staging-app
    secretKey: uri
  auth:
    existingSecret: bank0-auth
    secretKey: jwt-secret
  logging:
    level: debug # staging: cheap to read, nobody's paging on it
  # 1.0.1 reads XFF right-to-left, trustedProxyHops in. envoy-internal appends
  # real client IP last -> that hop is proxy-authored, unforgeable. Per-client
  # rate-limit keys instead of one shared bucket.
  # Both surfaces on envoy-internal = one hop. envoy-external would be two on
  # tunnel traffic (cloudflared, then Envoy); CF-Connecting-IP saves that case.
  trustProxyHeaders: true
  trustedProxyHops: 1
  # Routing is Flux's (envoy-internal + shared wildcard cert). Chart's Gateway
  # and HTTPRoutes stay off.
  gateway:
    create: false
  api:
    exposed: false
    replicaCount: 1
    autoscaling:
      enabled: false
  portal:
    exposed: false
    replicaCount: 1
  metrics:
    serviceMonitor:
      enabled: true
    dashboard:
      enabled: true
