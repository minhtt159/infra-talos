---
# One Application per file in envs/bank0/. New env = new file. Shape lives here.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bank0
  namespace: argocd
spec:
  goTemplate: true
  # missingkey=error: missing key fails loud, not "<no value>" in a live app.
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/minhtt159/infra-talos
        revision: main
        files:
          - path: kubernetes/argocd/envs/bank0/*.yaml
  template:
    metadata:
      name: bank0-{{ .env }}
    spec:
      project: bank0
      source:
        repoURL: ghcr.io/minhtt159/charts
        chart: bank0
        targetRevision: "{{ .chartVersion }}"
        helm:
          releaseName: bank0
      destination:
        server: https://kubernetes.default.svc
        namespace: bank0-{{ .env }}
      syncPolicy:
        syncOptions:
          - CreateNamespace=false # namespaces are Flux's
  # valuesObject is free-form nested YAML. Typed template can't carry it.
  # templatePatch renders as text, merges over.
  templatePatch: |
    spec:
      source:
        helm:
          valuesObject:
            {{- toYaml .values | nindent 12 }}
      {{- if .autoSync }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
      {{- end }}
