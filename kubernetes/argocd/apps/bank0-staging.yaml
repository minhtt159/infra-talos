---
# bank0 @ staging. `targetRevision` is the chart version — this line is what
# Kargo bumps when new Freight is promoted in, so keep it a plain literal.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bank0-staging
  namespace: argocd
spec:
  project: bank0
  source:
    repoURL: ghcr.io/minhtt159/charts
    chart: bank0
    targetRevision: 1.0.1
    helm:
      releaseName: bank0
      valuesObject:
        database:
          existingSecret: bank0-db # Flux-managed, from Vaultwarden
          secretKey: dsn
        auth:
          existingSecret: bank0-auth
          secretKey: jwt-secret
        logging:
          level: debug # staging: cheap to read, nobody's paging on it
        # Trust the forwarded header: 1.0.1 parses X-Forwarded-For right-to-left
        # and takes trustedProxyHops entries in, so with envoy-internal appending
        # the real client IP as the last hop, that entry is proxy-authored and a
        # client can't forge it. Gets per-client rate-limit keys instead of every
        # client sharing the Envoy pod's bucket.
        # Both surfaces are on envoy-internal — exactly one hop. A surface moved
        # to envoy-external would see two on tunnel traffic (cloudflared, then
        # Envoy), where CF-Connecting-IP is what saves it, not this count.
        trustProxyHeaders: true
        trustedProxyHops: 1
        # Routing is Flux's (envoy-internal + the shared wildcard cert), so the
        # chart's Gateway and HTTPRoutes stay off.
        gateway:
          create: false
        api:
          exposed: false
          replicaCount: 1
          autoscaling:
            enabled: false
        portal:
          exposed: false
          replicaCount: 1
        metrics:
          serviceMonitor:
            enabled: true
          dashboard:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: bank0-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
