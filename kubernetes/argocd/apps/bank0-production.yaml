---
# bank0 @ production. Same chart, different dials. Sync is NOT automated: the
# promotion into this file is Kargo's, and applying it stays a human's.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bank0-production
  namespace: argocd
spec:
  project: bank0
  source:
    repoURL: ghcr.io/minhtt159/charts
    chart: bank0
    targetRevision: 1.0.0
    helm:
      releaseName: bank0
      valuesObject:
        database:
          existingSecret: bank0-db
          secretKey: dsn
        auth:
          existingSecret: bank0-auth
          secretKey: jwt-secret
        # envoy-internal deliberately does not trust X-Forwarded-For (see its
        # ClientTrafficPolicy: "a LAN client can't forge source.ip"), so on chart
        # 1.0.0 — whose parser takes the LEFT-most, forgeable entry — a trusted
        # header means the per-IP auth rate limit is bypassable by rotating it.
        # False collapses every client onto the Envoy pod IP: one coarse bucket,
        # but it fails closed.
        # Chart 1.0.1 parses right-to-left with trustedProxyHops (default 1),
        # making Envoy's appended entry authoritative. Flip this to true on that
        # version — while these routes stay on envoy-internal.
        # NOT a reason to trust the header on envoy-external: that gateway is
        # reachable directly from the LAN, so a client can bypass Cloudflare and
        # forge both XFF and CF-Connecting-IP. Fronting is not filtering.
        trustProxyHeaders: false
        gateway:
          create: false
          # otherwise the chart still emits its HTTP->HTTPS redirect route, pointed
          # at a Gateway that does not exist here.
          httpsRedirect: false
        api:
          exposed: false
          replicaCount: 3
          autoscaling:
            enabled: true
            minReplicas: 3
            maxReplicas: 10
        portal:
          exposed: false
          replicaCount: 2
        metrics:
          serviceMonitor:
            enabled: true
          dashboard:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: bank0-production
  syncPolicy:
    syncOptions:
      - CreateNamespace=false # the namespace is Flux's
