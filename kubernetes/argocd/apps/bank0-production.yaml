---
# bank0 @ production. Same chart, different dials. Sync is NOT automated: the
# promotion into this file is Kargo's, and applying it stays a human's.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bank0-production
  namespace: argocd
spec:
  project: bank0
  source:
    repoURL: ghcr.io/minhtt159/charts
    chart: bank0
    targetRevision: 1.0.1
    helm:
      releaseName: bank0
      valuesObject:
        database:
          existingSecret: bank0-db
          secretKey: dsn
        auth:
          existingSecret: bank0-auth
          secretKey: jwt-secret
        # Trust the forwarded header: 1.0.1 parses X-Forwarded-For right-to-left
        # and takes trustedProxyHops entries in, so with envoy-internal appending
        # the real client IP as the last hop, that entry is proxy-authored and a
        # client can't forge it. Gets per-client rate-limit keys instead of every
        # client sharing the Envoy pod's bucket.
        # Both surfaces are on envoy-internal — exactly one hop. A surface moved
        # to envoy-external would see two on tunnel traffic (cloudflared, then
        # Envoy), where CF-Connecting-IP is what saves it, not this count.
        trustProxyHeaders: true
        trustedProxyHops: 1
        gateway:
          create: false
        api:
          exposed: false
          replicaCount: 3
          autoscaling:
            enabled: true
            minReplicas: 3
            maxReplicas: 10
        portal:
          exposed: false
          replicaCount: 2
        metrics:
          serviceMonitor:
            enabled: true
          dashboard:
            enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: bank0-production
  syncPolicy:
    syncOptions:
      - CreateNamespace=false # the namespace is Flux's
