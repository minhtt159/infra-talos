---
# JWT signing key. Random, never read by a human, must be identical across api
# replicas. Generate in-cluster, leave alone.
# The DB credential is not here: CNPG generates it (see cluster.yaml).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: bank0-jwt
spec:
  length: 48
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bank0-auth
spec:
  refreshInterval: "0" # rotate and every live session dies
  target:
    name: bank0-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        jwt-secret: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: bank0-jwt
