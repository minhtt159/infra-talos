---
# The chart's own HTTPRoutes want a chart-created Gateway (sectionName
# https-api/https-portal), so they're switched off (api/portal.exposed: false)
# and routing lives here, on the shared envoy-internal gateway like every other
# app in this cluster. Both surfaces are on envoy-internal, so production is
# LAN-only too — deliberately. Moving `api` to envoy-external is a one-line
# parentRef change plus a public DNS record; make that its own decision.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-api
  annotations:
    # /readyz, not /health: /health is DB-blind by design (a DB blip must not
    # kill pods), so it can't tell us the thing worth alerting on. /readyz pings
    # Postgres with a 1s deadline.
    gatus.home-operations.com/endpoint: |
      path: /readyz
      conditions:
        - "[STATUS] == 200"
spec:
  hostnames:
    - "api.bank0.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: bank0-api
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-portal
spec:
  hostnames:
    - "portal.bank0.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: bank0-portal
          port: 80
