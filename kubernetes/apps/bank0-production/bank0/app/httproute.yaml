---
# Chart's own HTTPRoutes want a chart-created Gateway (sectionName
# https-api/https-portal). Switched off (api/portal.exposed: false); routing
# lives here, like every other app.
#
# The public API is `bank0-api.${SECRET_DOMAIN}`, NOT `api.bank0.${SECRET_DOMAIN}`:
# Cloudflare's Universal SSL covers the apex and first-level subdomains only, so a
# two-label name would need paid Total TLS/ACM at the edge. One label also means
# the tunnel's existing `*.${SECRET_DOMAIN}` ingress rule already covers it — no
# dashboard entry. Same reason hindsight uses `hindsight-api.${SECRET_DOMAIN}`.
#
# `api` is on envoy-external (public, via cloudflared); `portal` stays on
# envoy-internal. That split is the point: the portal is the admin surface and
# has no MFA yet (minhtt159/bank0#116), so nothing about it leaves the LAN.
# Rationale and the full checklist: bank0 docs/04-deployment.md §3, "Exposing
# the client API to the internet" (minhtt159/bank0#124).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-api
  annotations:
    # /readyz not /health. /health is DB-blind by design (DB blip must not kill
    # pods) so it can't signal what matters. /readyz pings Postgres, 1s deadline.
    gatus.home-operations.com/endpoint: |
      group: bank0-production
      path: /readyz
      conditions:
        - "[STATUS] == 200"
spec:
  hostnames:
    - "bank0-api.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: bank0-api
          port: 80
---
# /auth/* split out purely so a tighter rate limit can attach to it
# (BackendTrafficPolicy targets a whole HTTPRoute, and EG's global rate limit
# selects on client IP and headers, not path). Same hostname and backend as
# above; Gateway API gives the longer path match precedence, so this route wins
# for /auth/* and bank0-api keeps everything else.
#
# It exists because the app's own /auth/* limiter is a PER-REPLICA window — with
# 3-10 api pods and HPA on, the real ceiling both multiplies and moves. The
# Valkey-backed global limit counts once for the whole deployment.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-api-auth
spec:
  hostnames:
    - "bank0-api.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /auth
      backendRefs:
        - name: bank0-api
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-portal
  annotations:
    # Portal answers 401 unauthenticated — that IS the healthy signal.
    gatus.home-operations.com/endpoint: |
      group: bank0-production
      conditions:
        - "[STATUS] == 401"
spec:
  hostnames:
    - "portal.bank0.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: bank0-portal
          port: 80
---
# The client API's non-client surface, hidden from the internet.
#
# Access stops the internet reaching this hostname directly (403), but a
# Cloudflare Worker subrequest to a same-zone hostname does NOT go through
# Access - so each Worker is a hole as wide as its proxy, and both forward every
# path. Measured 2026-09-16: bank0.hnimn.art/api/metrics and
# fraudbank.hnimn.art/api/metrics both 200.
#
# Fixed on the route rather than in each Worker so it covers Workers that do not
# exist yet. Exact matches take precedence over bank0-api's catch-all, the same
# way bank0-api-auth does for /auth. 404 not 403: a 403 confirms something is
# there.
#
# Still reachable on purpose: /readyz (Gatus probes it through this route), and
# /metrics on the pods (Prometheus scrapes the Service's `http` port direct, so
# this cannot affect monitoring).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: bank0-api-not-found
spec:
  directResponse:
    statusCode: 404
    contentType: application/json
    body:
      type: Inline
      inline: '{"error":"not_found"}'
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-api-internal-paths
spec:
  hostnames:
    - "bank0-api.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        # Go internals, DB pool state, version, per-route traffic + latency.
        # Labels are route templates, so no PII - still not public material.
        - path: { type: Exact, value: /metrics }
        # Leaks the version string. Gatus uses /readyz, which stays open.
        - path: { type: Exact, value: /health }
        # Nothing needs these at runtime: fraudbank generates types at build
        # time from the vendored contract. Blocked by default, but publishing
        # the spec is a defensible product choice - delete these two matches if
        # that is the intent.
        - path: { type: Exact, value: /openapi.yaml }
        - path: { type: Exact, value: /docs }
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: bank0-api-not-found
