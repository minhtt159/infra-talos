---
# Chart's own HTTPRoutes want a chart-created Gateway (sectionName
# https-api/https-portal). Switched off (api/portal.exposed: false); routing
# lives here, like every other app.
#
# The public API is `bank0-api.${SECRET_DOMAIN}`, NOT `api.bank0.${SECRET_DOMAIN}`:
# Cloudflare's Universal SSL covers the apex and first-level subdomains only, so a
# two-label name would need paid Total TLS/ACM at the edge. One label also means
# the tunnel's existing `*.${SECRET_DOMAIN}` ingress rule already covers it — no
# dashboard entry. Same reason hindsight uses `hindsight-api.${SECRET_DOMAIN}`.
#
# `api` is on envoy-external (public, via cloudflared). `portal` is ONE flat
# name on BOTH gateways, split-horizon like hindsight: on the LAN unifi-dns
# answers with envoy-internal (no Cloudflare, no Entra in the loop - the
# break-glass path); from the internet cloudflare-dns (--gateway-name=
# envoy-external) points it at the tunnel, behind Cloudflare Access (Entra SSO +
# MFA, the `Only-Minh` policy) with the Access JWT re-verified at this gateway
# (securitypolicy.yaml). The portal has no MFA of its own (minhtt159/bank0#116);
# Access is the second factor. Rationale: bank0 docs/04-deployment.md §3.
#
# The LAN answer is deterministic only because of route NAMES: when two routes
# publish the same hostname, external-dns keeps the one whose resource id sorts
# first - `bank0-portal` < `bank0-portal-external`. Rename either and the LAN
# may start resolving to envoy-external, where the SecurityPolicy 401s it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-api
  annotations:
    # /readyz not /health. /health is DB-blind by design (DB blip must not kill
    # pods) so it can't signal what matters. /readyz pings Postgres, 1s deadline.
    gatus.home-operations.com/endpoint: |
      group: bank0-production
      path: /readyz
      conditions:
        - "[STATUS] == 200"
spec:
  hostnames:
    - "bank0-api.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: bank0-api
          port: 80
---
# /auth/* split out purely so a tighter rate limit can attach to it
# (BackendTrafficPolicy targets a whole HTTPRoute, and EG's global rate limit
# selects on client IP and headers, not path). Same hostname and backend as
# above; Gateway API gives the longer path match precedence, so this route wins
# for /auth/* and bank0-api keeps everything else.
#
# It exists because the app's own /auth/* limiter is a PER-REPLICA window — with
# 3-10 api pods and HPA on, the real ceiling both multiplies and moves. The
# Valkey-backed global limit counts once for the whole deployment.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-api-auth
spec:
  hostnames:
    - "bank0-api.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /auth
      backendRefs:
        - name: bank0-api
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-portal
  annotations:
    # Portal answers 401 unauthenticated — that IS the healthy signal.
    gatus.home-operations.com/endpoint: |
      group: bank0-production
      conditions:
        - "[STATUS] == 401"
spec:
  hostnames:
    - "bank0-portal.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: bank0-portal
          port: 80
---
# The non-client surface of both public hostnames, hidden from the internet.
#
# Access stops the internet reaching this hostname directly (403), but a
# Cloudflare Worker subrequest to a same-zone hostname does NOT go through
# Access - so each Worker is a hole as wide as its proxy, and both forward every
# path. Measured 2026-09-16: bank0.hnimn.art/api/metrics and
# fraudbank.hnimn.art/api/metrics both 200.
#
# Fixed on the route rather than in each Worker so it covers Workers that do not
# exist yet. Exact matches take precedence over bank0-api's catch-all, the same
# way bank0-api-auth does for /auth. 404 not 403: a 403 confirms something is
# there.
#
# Still reachable on purpose: /readyz (Gatus probes it through this route), and
# /metrics on the pods (Prometheus scrapes the Service's `http` port direct, so
# this cannot affect monitoring).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: bank0-not-found
spec:
  directResponse:
    statusCode: 404
    contentType: application/json
    body:
      type: Inline
      inline: '{"error":"not_found"}'
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-api-internal-paths
spec:
  hostnames:
    - "bank0-api.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        # Go internals, DB pool state, version, per-route traffic + latency.
        # Labels are route templates, so no PII - still not public material.
        - path: { type: Exact, value: /metrics }
        # Leaks the version string. Gatus uses /readyz, which stays open.
        - path: { type: Exact, value: /health }
        # Nothing needs these at runtime: fraudbank generates types at build
        # time from the vendored contract. Blocked by default, but publishing
        # the spec is a defensible product choice - delete these two matches if
        # that is the intent.
        - path: { type: Exact, value: /openapi.yaml }
        - path: { type: Exact, value: /docs }
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: bank0-not-found
---
# Operator console, public half. The gate is Cloudflare Access on this hostname;
# the SecurityPolicy in securitypolicy.yaml makes the gateway verify the Access
# JWT itself, so a request that reaches this route without having passed Access
# - a Worker subrequest, anyone on the LAN hitting the external VIP by IP - gets
# 401 here. Flat name for the same Universal-SSL reason as bank0-api.
# cloudflare-dns publishes it from this route; the tunnel's `*.${SECRET_DOMAIN}`
# rule and the gateway cert's wildcard SAN already cover it. No Gatus
# annotation: the LAN route above probes /. Name must sort AFTER `bank0-portal`
# (see the top of this file).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-portal-external
spec:
  hostnames:
    - "bank0-portal.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: bank0-portal
          port: 80
---
# /login split out for a tight per-IP limit (backendtrafficpolicy.yaml), same
# shape as bank0-api-auth. The console login has a DB-side lockout (25 fails /
# 15 min per account) but, unlike the client /auth/login, no in-app per-IP
# limiter until bank0's next release; this is the backstop either way.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-portal-external-login
spec:
  hostnames:
    - "bank0-portal.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: Exact
            value: /login
      backendRefs:
        - name: bank0-portal
          port: 80
---
# Same treatment as bank0-api-internal-paths, minus /openapi.yaml and /docs:
# behind Access those are the operator's API reference and may stay. /readyz is
# blocked too - Gatus probes the portal on the LAN route, nothing external needs it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-portal-internal-paths
spec:
  hostnames:
    - "bank0-portal.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path: { type: Exact, value: /metrics }
        - path: { type: Exact, value: /health }
        - path: { type: Exact, value: /readyz }
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: bank0-not-found
