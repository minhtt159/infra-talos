---
# Chart's own HTTPRoutes want a chart-created Gateway (sectionName
# https-api/https-portal). Switched off (api/portal.exposed: false); routing
# lives here, like every other app.
#
# The public API is `bank0-api.${SECRET_DOMAIN}`, NOT `api.bank0.${SECRET_DOMAIN}`:
# Cloudflare's Universal SSL covers the apex and first-level subdomains only, so a
# two-label name would need paid Total TLS/ACM at the edge. One label also means
# the tunnel's existing `*.${SECRET_DOMAIN}` ingress rule already covers it — no
# dashboard entry. Same reason hindsight uses `hindsight-api.${SECRET_DOMAIN}`.
#
# `api` is on envoy-external (public, via cloudflared); `portal` stays on
# envoy-internal. That split is the point: the portal is the admin surface and
# has no MFA yet (minhtt159/bank0#116), so nothing about it leaves the LAN.
# Rationale and the full checklist: bank0 docs/04-deployment.md §3, "Exposing
# the client API to the internet" (minhtt159/bank0#124).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-api
  annotations:
    # /readyz not /health. /health is DB-blind by design (DB blip must not kill
    # pods) so it can't signal what matters. /readyz pings Postgres, 1s deadline.
    gatus.home-operations.com/endpoint: |
      group: bank0-production
      path: /readyz
      conditions:
        - "[STATUS] == 200"
spec:
  hostnames:
    - "bank0-api.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: bank0-api
          port: 80
---
# /auth/* split out purely so a tighter rate limit can attach to it
# (BackendTrafficPolicy targets a whole HTTPRoute, and EG's global rate limit
# selects on client IP and headers, not path). Same hostname and backend as
# above; Gateway API gives the longer path match precedence, so this route wins
# for /auth/* and bank0-api keeps everything else.
#
# It exists because the app's own /auth/* limiter is a PER-REPLICA window — with
# 3-10 api pods and HPA on, the real ceiling both multiplies and moves. The
# Valkey-backed global limit counts once for the whole deployment.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-api-auth
spec:
  hostnames:
    - "bank0-api.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /auth
      backendRefs:
        - name: bank0-api
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-portal
  annotations:
    # Portal answers 401 unauthenticated — that IS the healthy signal.
    gatus.home-operations.com/endpoint: |
      group: bank0-production
      conditions:
        - "[STATUS] == 401"
spec:
  hostnames:
    - "portal.bank0.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: bank0-portal
          port: 80
---
# The client API's NON-CLIENT surface, hidden from the internet.
#
# Why here and not in a Worker: the Access policy on bank0-api.${SECRET_DOMAIN}
# stops the internet reaching this hostname directly (403, verified), but a
# Cloudflare Worker subrequest to a same-zone hostname does NOT go through
# Access. So each Worker is a hole through the gate as wide as its proxy, and
# both of them forward every path:
#
#   bank0.hnimn.art/api/metrics       -> 200  (Prometheus exposition)
#   fraudbank.hnimn.art/api/metrics   -> 200
#   ...same for /docs, /openapi.yaml, /health
#
# Measured 2026-09-16. Fixing it in each Worker would work and would have to be
# remembered by every Worker ever added; fixing it on the route fixes it once,
# for every caller through envoy-external, including ones that do not exist yet.
#
# Exact matches, so Gateway API precedence puts these ahead of bank0-api's
# catch-all - the same mechanism bank0-api-auth already relies on for /auth.
#
# NOT blocked, deliberately:
#   /readyz  - Gatus probes it through this very route (see the annotation on
#              bank0-api), and it returns only {"status":"ready"}.
#   /metrics on the pods - Prometheus scrapes via the ServiceMonitor on the
#              Service's `http` port, i.e. pod IPs direct. It never traverses a
#              gateway, so this route cannot affect monitoring.
#
# 404 rather than 403: a 403 confirms something is there.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: bank0-api-not-found
spec:
  directResponse:
    statusCode: 404
    contentType: application/json
    body:
      type: Inline
      inline: '{"error":"not_found"}'
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-api-internal-paths
spec:
  hostnames:
    - "bank0-api.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        # Prometheus exposition: Go internals, DB pool state, version, and
        # per-route traffic volume + latency. Labels are route templates, so no
        # PII - but none of it belongs on the public internet.
        - path: { type: Exact, value: /metrics }
        # Version disclosure: {"status":"ok","version":"1.1.0"}. Gatus uses
        # /readyz, which stays reachable.
        - path: { type: Exact, value: /health }
        # The spec and the Scalar explorer. Nothing at runtime needs either:
        # fraudbank generates its types at BUILD time from the vendored copy in
        # packages/api-contract, and the drift job reads bank0's git, not the URL.
        #
        # If the spec is meant to be public (a demo bank has a reasonable case
        # for that), delete these two matches - that is the whole change, and it
        # is the one line in this file that is a product decision rather than a
        # security fix.
        - path: { type: Exact, value: /openapi.yaml }
        - path: { type: Exact, value: /docs }
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: bank0-api-not-found
