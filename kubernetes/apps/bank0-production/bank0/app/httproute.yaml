---
# Chart's own HTTPRoutes are off (api/portal.exposed: false); routing lives here.
# One-label hostnames (bank0-api, not api.bank0): Universal SSL covers first-level only.
# portal is split-horizon: LAN -> envoy-internal (unifi-dns), internet -> envoy-external + Access.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-api
  annotations:
    # /readyz not /health. /health is DB-blind by design (DB blip must not kill
    # pods) so it can't signal what matters. /readyz pings Postgres, 1s deadline.
    gatus.home-operations.com/endpoint: |
      group: bank0-production
      path: /readyz
      conditions:
        - "[STATUS] == 200"
spec:
  hostnames:
    - "bank0-api.hnimn.art"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: bank0-api
          port: 80
---
# /auth/* split out purely so a tighter rate limit can attach to it
# (BackendTrafficPolicy targets a whole HTTPRoute, and EG's global rate limit
# selects on client IP and headers, not path). Same hostname and backend as
# above; Gateway API gives the longer path match precedence, so this route wins
# for /auth/* and bank0-api keeps everything else.
#
# It exists because the app's own /auth/* limiter is a PER-REPLICA window — with
# 3-10 api pods and HPA on, the real ceiling both multiplies and moves. The
# Valkey-backed global limit counts once for the whole deployment.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-api-auth
  annotations:
    gatus.home-operations.com/enabled: "false" # see bank0-portal / bank0-api for the probes
spec:
  hostnames:
    - "bank0-api.hnimn.art"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /auth
      backendRefs:
        - name: bank0-api
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-portal
  annotations:
    # Portal answers 401 unauthenticated — that IS the healthy signal.
    gatus.home-operations.com/endpoint: |
      group: bank0-production
      conditions:
        - "[STATUS] == 401"
spec:
  hostnames:
    - "bank0-portal.hnimn.art"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: bank0-portal
          port: 80
---
# 404 for the non-client paths on the public hostname. Gotcha: a Cloudflare Worker
# subrequest to a same-zone host skips Access, so the block lives on the route, not
# in each Worker. /readyz stays open (Gatus); Prometheus scrapes the pods direct.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: bank0-not-found
spec:
  directResponse:
    statusCode: 404
    contentType: application/json
    body:
      type: Inline
      inline: '{"error":"not_found"}'
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-api-internal-paths
  annotations:
    gatus.home-operations.com/enabled: "false" # see bank0-portal / bank0-api for the probes
spec:
  hostnames:
    - "bank0-api.hnimn.art"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        # Go internals, DB pool state, version, per-route traffic + latency.
        # Labels are route templates, so no PII - still not public material.
        - path: { type: Exact, value: /metrics }
        # Leaks the version string. Gatus uses /readyz, which stays open.
        - path: { type: Exact, value: /health }
        # Nothing needs these at runtime: fraudbank generates types at build
        # time from the vendored contract. Blocked by default, but publishing
        # the spec is a defensible product choice - delete these two matches if
        # that is the intent.
        - path: { type: Exact, value: /openapi.yaml }
        - path: { type: Exact, value: /docs }
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: bank0-not-found
---
# Operator console, public half. The gate is Cloudflare Access on this hostname;
# the SecurityPolicy in securitypolicy.yaml makes the gateway verify the Access
# JWT itself, so a request that reaches this route without having passed Access
# - a Worker subrequest, anyone on the LAN hitting the external VIP by IP - gets
# 401 here. Flat name for the same Universal-SSL reason as bank0-api.
# cloudflare-dns publishes it from this route; the tunnel's `*.hnimn.art`
# rule and the gateway cert's wildcard SAN already cover it. Gatus opted out
# (the sidecar auto-probes every route): the LAN route above probes /.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-portal-external
  annotations:
    # Internet view of the portal: 401 from the app's own login. Only unambiguous
    # while Access strict service-token mode stays off (a rejected token is then
    # a 302, not 401/403).
    gatus.home-operations.com/endpoint: |
      conditions:
        - "[STATUS] == 401"
spec:
  hostnames:
    - "bank0-portal.hnimn.art"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: bank0-portal
          port: 80
---
# /login split out for a tight per-IP limit (backendtrafficpolicy.yaml), same
# shape as bank0-api-auth. The console login has a DB-side lockout (25 fails /
# 15 min per account) but, unlike the client /auth/login, no in-app per-IP
# limiter until bank0's next release; this is the backstop either way.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-portal-external-login
  annotations:
    gatus.home-operations.com/enabled: "false" # see bank0-portal / bank0-api for the probes
spec:
  hostnames:
    - "bank0-portal.hnimn.art"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: Exact
            value: /login
      backendRefs:
        - name: bank0-portal
          port: 80
---
# Same treatment as bank0-api-internal-paths, minus /openapi.yaml and /docs:
# behind Access those are the operator's API reference and may stay. /readyz is
# blocked too - Gatus probes / on the LAN route. Attached to envoy-internal as
# well: the LAN route otherwise served /metrics to any LAN client (Prometheus
# scrapes the pods direct, so nothing needs it through a gateway).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-portal-internal-paths
  annotations:
    gatus.home-operations.com/enabled: "false" # see bank0-portal / bank0-api for the probes
spec:
  hostnames:
    - "bank0-portal.hnimn.art"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path: { type: Exact, value: /metrics }
        - path: { type: Exact, value: /health }
        - path: { type: Exact, value: /readyz }
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: bank0-not-found
