---
# Gateway re-verifies the Cloudflare Access JWT (Cf-Access-Jwt-Assertion) on the public
# portal routes: a request that skipped Access gets 401. Issuer/AUD from cluster-secrets.
# Gotcha: the LAN route (envoy-internal) is untouched on purpose - break-glass path.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: bank0-portal-access-jwt
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: bank0-portal-external
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: bank0-portal-external-login
  jwt:
    providers:
      - name: cloudflare-access
        issuer: "https://${SECRET_CF_ACCESS_TEAM}.cloudflareaccess.com"
        audiences:
          - "${SECRET_BANK0_PORTAL_ACCESS_AUD}"
        remoteJWKS:
          uri: "https://${SECRET_CF_ACCESS_TEAM}.cloudflareaccess.com/cdn-cgi/access/certs"
        extractFrom:
          headers:
            - name: Cf-Access-Jwt-Assertion
