---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: barman-cloud-plugin
spec:
  dependsOn:
    - name: cloudnative-pg
  path: ./kubernetes/apps/database/barman-cloud-plugin/app
  targetNamespace: database # must match the CNPG operator namespace
  wait: true
