---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres-backup
spec:
  # 30d of base backups + WALs. Bump before this holds anything you'd miss.
  retentionPolicy: 30d
  configuration:
    # TODO: create the bucket in Garage and set the real endpoint host.
    destinationPath: s3://cnpg-backups/
    endpointURL: https://s3.${SECRET_DOMAIN}
    s3Credentials:
      accessKeyId:
        name: postgres-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: postgres-backup-s3
        key: ACCESS_SECRET_KEY
      region:
        name: postgres-backup-s3
        key: REGION
    wal:
      compression: gzip
    data:
      compression: gzip
