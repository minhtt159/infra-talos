---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-db-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login # login item — username/password under $.data.login
  target:
    name: hindsight-db-auth # CNPG managed role passwordSecret
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth # required shape for managed role
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: 63669701-fb8c-4173-8b68-05f53767c61c # vaultwarden: hindsight-db
        property: username
    - secretKey: password
      remoteRef:
        key: 63669701-fb8c-4173-8b68-05f53767c61c
        property: password
