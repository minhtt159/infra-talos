---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-db-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: hindsight-db-auth # CNPG managed role passwordSecret
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth # required shape for managed role
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    # TODO: replace UUID with the Vaultwarden item homelab-talos/hindsight-db.
    - secretKey: username
      remoteRef:
        key: REPLACE-WITH-VAULTWARDEN-UUID # vaultwarden: homelab-talos/hindsight-db (field: username)
        property: username
    - secretKey: password
      remoteRef:
        key: REPLACE-WITH-VAULTWARDEN-UUID
        property: password
