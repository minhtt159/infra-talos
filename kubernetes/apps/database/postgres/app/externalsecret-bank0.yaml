---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Same Vaultwarden item feeds two Secrets: this one (CNPG managed role) and the
# DSN the app reads (kubernetes/apps/bank0-staging/bank0/app/externalsecret.yaml).
# They must stay in sync, so both read the item — never generate one side.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bank0-staging-db-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login # login item — username/password under $.data.login
  target:
    name: bank0-staging-db-auth # CNPG managed role passwordSecret
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth # required shape for managed role
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: 9b068286-6fa4-4e9e-beb9-4dc5d500ab50 # vaultwarden: bank0-staging-db
        property: username
    - secretKey: password
      remoteRef:
        key: 9b068286-6fa4-4e9e-beb9-4dc5d500ab50
        property: password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bank0-production-db-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: bank0-production-db-auth
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: e8a448e1-ba43-43b8-9ba4-271ca55c2b11 # vaultwarden: bank0-production-db
        property: username
    - secretKey: password
      remoteRef:
        key: e8a448e1-ba43-43b8-9ba4-271ca55c2b11
        property: password
