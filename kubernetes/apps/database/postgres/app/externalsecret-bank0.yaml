---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Same Vaultwarden item feeds two Secrets: this one (CNPG managed role) and the
# DSN the app reads (kubernetes/apps/bank0-staging/bank0/app/externalsecret.yaml).
# They must stay in sync, so both read the item — never generate one side.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bank0-staging-db-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login # login item — username/password under $.data.login
  target:
    name: bank0-staging-db-auth # CNPG managed role passwordSecret
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth # required shape for managed role
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: 00000000-0000-0000-0000-000000000000 # TODO vaultwarden: bank0-staging-db
        property: username
    - secretKey: password
      remoteRef:
        key: 00000000-0000-0000-0000-000000000000
        property: password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bank0-production-db-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: bank0-production-db-auth
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: 00000000-0000-0000-0000-000000000001 # TODO vaultwarden: bank0-production-db
        property: username
    - secretKey: password
      remoteRef:
        key: 00000000-0000-0000-0000-000000000001
        property: password
