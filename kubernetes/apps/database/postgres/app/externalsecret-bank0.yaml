---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Only the password comes from Vaultwarden directly. The username is the CNPG
# role name, which reaches this file as a substitution — CNPG refuses to
# reconcile a managed role whose secret carries a different username ("the
# username in secret ... does not match role ..."), so the role, this secret and
# the app's DSN must all read the one source: the item's username field, fanned
# out as ${BANK0_*_DB_USER} by the cluster-secrets ClusterExternalSecret.
# The app's DSN (kubernetes/apps/bank0-staging/bank0/app/externalsecret.yaml)
# reads the same item, so the two stay in sync by construction.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bank0-staging-db-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login # login item — password under $.data.login
  target:
    name: bank0-staging-db-auth # CNPG managed role passwordSecret
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth # required shape for managed role
      data:
        username: ${BANK0_STAGING_DB_USER}
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: 9b068286-6fa4-4e9e-beb9-4dc5d500ab50 # vaultwarden: bank0-staging-db
        property: password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bank0-production-db-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: bank0-production-db-auth
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: ${BANK0_PRODUCTION_DB_USER}
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: e8a448e1-ba43-43b8-9ba4-271ca55c2b11 # vaultwarden: bank0-production-db
        property: password
