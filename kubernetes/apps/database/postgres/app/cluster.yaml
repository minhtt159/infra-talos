---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
# Two instances on TrueNAS iSCSI, one per node: a node loss is a CNPG failover,
# not an RWO force-detach wait. Backups: barman-cloud -> Garage S3, daily.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 2
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  # -standard flavor bundles pgvector (needed by Hindsight); default operand is
  # the -system flavor (no extensions). Must be >= the running minor — CNPG
  # rejects downgrades and in-place major changes.
  # Renovate: tracked by the CNPG imageName custom manager (minor/patch only).
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie
  managed:
    roles:
      - name: hindsight
        ensure: present
        login: true
        passwordSecret:
          name: hindsight-db-auth
      - name: litellm
        ensure: present
        login: true
        passwordSecret:
          name: litellm-db-auth
  # Each volume is a sparse TrueNAS zvol (100Gi PGDATA + 20Gi WAL). Separate
  # walStorage keeps a WAL spike from filling PGDATA. truenas-csi-iscsi is
  # Retain + allowVolumeExpansion; zvols survive cluster deletion (reclaim via
  # docs/runbooks/cluster-rebuild.md).
  storage:
    storageClass: truenas-csi-iscsi
    size: 100Gi
  walStorage:
    storageClass: truenas-csi-iscsi
    size: 20Gi
  postgresql:
    parameters:
      # HA replication slots retain WAL for a down replica without limit;
      # cap it so a dead standby can't fill the primary's 20Gi WAL volume.
      max_slot_wal_keep_size: 4GB
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-backup
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
