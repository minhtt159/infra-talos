---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
# Single instance on TrueNAS iSCSI (network-attached), so on node brownout the
# pod reschedules to any node and the volume reattaches — not glued to one node
# like node-local hostpath was. Reattach off a dead node waits on RWO
# force-detach (~6min default) + Postgres crash recovery, so expect minutes of
# downtime, not seconds. For seconds-scale failover bump instances (>=2) with
# pod anti-affinity — CNPG promotes a standby live.
# ponytail: still 1 instance — bump instances before putting anything real
# in here. Backups go to Garage S3 via the barman-cloud plugin (ObjectStore
# postgres-backup + daily ScheduledBackup).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 1
  # -standard flavor bundles pgvector (needed by Hindsight); default operand is
  # the -system flavor (no extensions). Must be >= the running minor — CNPG
  # rejects downgrades and in-place major changes.
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie
  managed:
    roles:
      - name: hindsight
        ensure: present
        login: true
        passwordSecret:
          name: hindsight-db-auth
      - name: litellm
        ensure: present
        login: true
        passwordSecret:
          name: litellm-db-auth
      - name: ${BANK0_STAGING_DB_USER} # from the bank0-staging-db vault item
        ensure: present
        login: true
        passwordSecret:
          name: bank0-staging-db-auth
      - name: ${BANK0_PRODUCTION_DB_USER} # from the bank0-production-db vault item
        ensure: present
        login: true
        passwordSecret:
          name: bank0-production-db-auth
  # iSCSI honors these sizes — each provisions a real TrueNAS zvol (100Gi PGDATA
  # + 20Gi WAL). Separate walStorage keeps a WAL spike from filling PGDATA.
  # truenas-iscsi is Retain + allowVolumeExpansion; zvols survive cluster
  # deletion (reclaim via docs/runbooks/cluster-rebuild.md).
  storage:
    storageClass: truenas-iscsi
    size: 100Gi
  walStorage:
    storageClass: truenas-iscsi
    size: 20Gi
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-backup
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
