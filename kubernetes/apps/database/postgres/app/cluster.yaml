---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
# Test cluster on mini-talos-01's SATA SSD. Single instance, node-local
# storage — pinned to the node that has /var/mnt/sata (talos-nhb-hr7).
# ponytail: still 1 instance — bump instances before putting anything real
# in here. Backups go to Garage S3 via the barman-cloud plugin (ObjectStore
# postgres-backup + daily ScheduledBackup).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 1
  # -standard flavor bundles pgvector (needed by Hindsight); default operand is
  # the -system flavor (no extensions). Must be >= the running minor — CNPG
  # rejects downgrades and in-place major changes.
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie
  managed:
    roles:
      - name: hindsight
        ensure: present
        login: true
        passwordSecret:
          name: hindsight-db-auth
      - name: litellm
        ensure: present
        login: true
        passwordSecret:
          name: litellm-db-auth
  # hostpath ignores PVC capacity — sizes are documentation only, real cap is
  # the 500GB SATA SSD shared by PGDATA + WAL. walStorage keeps a WAL spike
  # from filling PGDATA.
  storage:
    storageClass: openebs-hostpath-sata
    size: 100Gi
  walStorage:
    storageClass: openebs-hostpath-sata
    size: 20Gi
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-backup
  affinity:
    nodeSelector:
      storage: sata # Omni nodeLabel on mini-talos-01 — stable across reinstalls
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
