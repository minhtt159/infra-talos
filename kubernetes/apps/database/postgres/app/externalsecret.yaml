---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-backup-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: postgres-backup-s3 # referenced by the ObjectStore s3Credentials
    creationPolicy: Owner
    template:
      mergePolicy: Merge # keep fetched keys, add the static region below
      data:
        REGION: garage # Garage's S3 region, a fixed constant
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: cdc0d5c5-5fea-46b8-b5d9-8d7885f184c4 # vaultwarden: cnpg-garage-s3
        property: access_key_id
    - secretKey: ACCESS_SECRET_KEY
      remoteRef:
        key: cdc0d5c5-5fea-46b8-b5d9-8d7885f184c4
        property: secret_access_key
