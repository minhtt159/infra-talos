---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-db-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login # login item — username/password under $.data.login
  target:
    name: litellm-db-auth # CNPG managed role passwordSecret
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth # required shape for managed role
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: e3391342-bc91-4329-bae2-8a6ff338e9fc # vaultwarden: litellm-db
        property: username
    - secretKey: password
      remoteRef:
        key: e3391342-bc91-4329-bae2-8a6ff338e9fc # vaultwarden: litellm-db
        property: password
