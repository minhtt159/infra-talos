---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: strimzi-operator
spec:
  chartRef:
    kind: OCIRepository
    name: strimzi-operator
  interval: 1h
  values:
    # Operands run in the PSS-restricted `database` namespace; the chart has no
    # dedicated value for the provider, so set the operator env directly. Default
    # is `baseline` which fails restricted enforcement on Kafka/entity pods.
    extraEnvs:
      - name: STRIMZI_POD_SECURITY_PROVIDER_CLASS
        value: restricted
    # Watch own namespace only (chart default) — the Kafka CR lives in `database`.
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        memory: 512Mi
