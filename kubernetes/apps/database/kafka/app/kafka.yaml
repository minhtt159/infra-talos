---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kafka.strimzi.io/kafka_v1.json
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.3.0
    # In-cluster clients only — no external (NodePort/LoadBalancer) listener.
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    # RF=1 everywhere — single node, transient messaging. Topics are declarative
    # (KafkaTopic CRs), so no broker-side auto-creation.
    config:
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: false
    jvmOptions:
      -Xms: 512m
      -Xmx: 1g
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
  # Storage/replicas live in KafkaNodePool (node-pools enabled), not here.
  entityOperator:
    topicOperator:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 384Mi
    userOperator:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 384Mi
