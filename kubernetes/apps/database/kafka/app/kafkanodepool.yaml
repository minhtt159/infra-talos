---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kafka.strimzi.io/kafkanodepool_v1.json
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual
  labels:
    strimzi.io/cluster: kafka
spec:
  # Single dual-role KRaft node (controller + broker in one pod). RF=1 everywhere
  # — pod restart is a short outage, node loss is data loss (accepted: transient
  # homelab messaging). Recovery after node loss: delete PVC data-kafka-dual-0
  # (+ the Pending pod); Strimzi re-provisions an empty volume and the broker
  # comes back with the same cluster ID. Scale out by adding a broker-only pool
  # + raising RF if this ever holds data worth keeping.
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 20Gi
    # Local SATA SSD — Kafka best practice for latency; not NFS (corruption
    # risk), not iSCSI (deliberately: local disk, durability given up above).
    class: openebs-hostpath-sata
    deleteClaim: false
  template:
    pod:
      affinity:
        nodeAffinity:
          # The sata class is a hostpath under /var/mnt/sata; only the node
          # labelled storage=sata (Omni template) has that UserVolume. Without
          # the pin the provisioner happily creates the dir on any node's /var.
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: storage
                    operator: In
                    values: [sata]
  resources:
    requests:
      cpu: 250m
      memory: 1536Mi
    limits:
      memory: 2Gi
