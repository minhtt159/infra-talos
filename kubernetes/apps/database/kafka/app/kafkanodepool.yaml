---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kafka.strimzi.io/kafkanodepool_v1.json
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual
  labels:
    strimzi.io/cluster: kafka
spec:
  # Single dual-role KRaft node (controller + broker in one pod). RF=1 everywhere
  # — pod restart = short outage, node loss = data loss (accepted, transient
  # messaging). Recover: delete PVC data-kafka-dual-0 + Pending pod; Strimzi
  # re-provisions empty, same cluster ID. Need durability → broker-only pool,
  # raise RF.
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 20Gi
    # Local SATA SSD for latency. Not NFS (corruption), not iSCSI (chosen).
    class: openebs-hostpath-sata
    deleteClaim: false
  template:
    pod:
      affinity:
        nodeAffinity:
          # Class = hostpath /var/mnt/sata. Only storage=sata node (Omni
          # template) has that UserVolume; unpinned, provisioner mkdirs on any
          # node's /var.
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: storage
                    operator: In
                    values: [sata]
  resources:
    requests:
      cpu: 250m
      memory: 1536Mi
    limits:
      memory: 2Gi
