---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: strimzi-kafka
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: prometheus
  # grafana-operator fetches the JSON from the pinned tag; Renovate bumps the tag
  # (in the URL path) alongside the operator via the annotated-dependencies manager.
  # renovate: datasource=github-releases depName=strimzi/strimzi-kafka-operator
  url: https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/1.1.0/examples/metrics/grafana-dashboards/strimzi-kafka.json
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: strimzi-kraft
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: prometheus
  # renovate: datasource=github-releases depName=strimzi/strimzi-kafka-operator
  url: https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/1.1.0/examples/metrics/grafana-dashboards/strimzi-kraft.json
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: strimzi-operators
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: prometheus
  # renovate: datasource=github-releases depName=strimzi/strimzi-kafka-operator
  url: https://raw.githubusercontent.com/strimzi/strimzi-kafka-operator/1.1.0/examples/metrics/grafana-dashboards/strimzi-operators.json
