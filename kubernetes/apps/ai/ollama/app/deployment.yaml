---
# Ollama on the Intel dGPU (mini-talos-04) via upstream's Vulkan backend
# (bundled in the official image). Replaces the community IPEX-LLM build —
# intel/ipex-llm was archived upstream on 2026-01-28.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name ollama
  annotations:
    # bounce on configmap/secret change
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: *name
  template:
    metadata:
      labels:
        app: *name
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      containers:
        - name: ollama
          image: docker.io/ollama/ollama:0.33.0
          imagePullPolicy: IfNotPresent
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0
            - name: OLLAMA_VULKAN
              value: "1"
            # server-scoped tuning; request-scoped knobs (num_ctx, think,
            # keep_alive) come from litellm deployment params instead.
            # FA on Vulkan may fall back silently on some drivers — check
            # startup logs; KV quantization only applies while FA is active.
            - name: OLLAMA_FLASH_ATTENTION
              value: "1"
            - name: OLLAMA_KV_CACHE_TYPE
              value: q8_0 # halves KV cache — more context headroom on 12GB
            # litellm routes max 1 in-flight request here; "auto" could
            # pre-allocate KV for slots that never get traffic.
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
          ports:
            - name: http
              containerPort: 11434
          resources:
            requests:
              cpu: 500m
              memory: 4Gi
            limits:
              memory: 16Gi
              gpu.intel.com/xe: "1"
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
