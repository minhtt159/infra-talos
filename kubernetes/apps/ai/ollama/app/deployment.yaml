---
# Ollama on the Intel dGPU (mini-talos-04) via upstream's Vulkan backend
# (bundled in the official image). Replaces the community IPEX-LLM build —
# intel/ipex-llm was archived upstream on 2026-01-28.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name ollama
  annotations:
    # bounce on configmap/secret change
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: *name
  template:
    metadata:
      labels:
        app: *name
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      containers:
        - name: ollama
          image: docker.io/ollama/ollama:0.31.1
          imagePullPolicy: IfNotPresent
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0
            - name: OLLAMA_VULKAN
              value: "1"
          ports:
            - name: http
              containerPort: 11434
          resources:
            requests:
              cpu: 500m
              memory: 4Gi
            limits:
              memory: 16Gi
              gpu.intel.com/xe: "1"
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
