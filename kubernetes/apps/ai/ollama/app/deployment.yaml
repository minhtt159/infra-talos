---
# Ollama on the Intel dGPU (mini-talos-04). Upstream ollama has no Intel GPU
# backend — community IPEX/SYCL build required.
# Upstream publishes only floating tags — stable+digest is the tightest pin
# available; Renovate bumps the digest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: *name
  template:
    metadata:
      labels:
        app: *name
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      containers:
        - name: ollama
          image: docker.io/uberchuckie/ollama-intel-gpu:stable@sha256:efb26abb98f3d376147e49ea556d24cfc63873c48780b696bd89a184f1ad67bf
          imagePullPolicy: IfNotPresent
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0
          ports:
            - name: http
              containerPort: 11434
          resources:
            requests:
              cpu: 500m
              memory: 4Gi
            limits:
              memory: 16Gi
              gpu.intel.com/xe: "1"
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
