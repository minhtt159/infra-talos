; llama-server router presets. Section = model name clients request; keys are
; llama-server CLI args without leading dashes. Child processes also inherit the
; router's own args (--metrics) and env (ONEAPI_DEVICE_SELECTOR, LLAMA_CACHE).
version = 1

[*]
n-gpu-layers = 99
flash-attn = on
; f16 KV (default): the Intel Xe attention kernels only engage on f16, and the
; q8_0-vs-f16 quality delta measured as noise on the Hindsight harness.

; Hindsight extraction + chat-fast/chat-think. qwen35 is clamped to one slot
; upstream-side only in Ollama; keep 1 here because litellm serialises this lane
; (max_parallel_requests 1) and MTP, when enabled, requires it.
[qwen3.5-9b]
hf-repo = unsloth/Qwen3.5-9B-GGUF:Q4_K_M
c = 16384
parallel = 1
; text only; the vision projector costs ~1.6 GB of VRAM for nothing
no-mmproj = true
load-on-startup = true
