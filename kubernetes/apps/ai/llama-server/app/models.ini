; llama-server router presets. Section = model name clients request; keys are
; llama-server CLI args without leading dashes. Child processes also inherit the
; router's own args (--metrics) and env (ONEAPI_DEVICE_SELECTOR, LLAMA_CACHE).
version = 1

[*]
n-gpu-layers = 99
flash-attn = on
; q8_0 KV halves the cache (needs FA)
cache-type-k = q8_0
cache-type-v = q8_0

[qwen3.5-9b]
hf-repo = unsloth/Qwen3.5-9B-GGUF:Q4_K_M
; trained to 262k; only 8/32 layers are full attention, so q8_0 KV is ~17 KB/token
; (64k = ~1.1 GB). Sized for reflect's 48k budget + thinking output.
c = 65536
; two slots share one KV pool (each can use the full 64k), so a long thinking
; reflect no longer blocks retain. MTP, if ever enabled, needs parallel = 1.
parallel = 2
kv-unified = true
; default output cap for clients that send no max_tokens (a request's own
; max_tokens wins). Backstop for non-streaming runaways: the router does not
; cancel them on client disconnect (llama.cpp#29707, open).
n-predict = 16384
; text only; the vision projector costs ~1.6 GB of VRAM for nothing
no-mmproj = true
load-on-startup = true
