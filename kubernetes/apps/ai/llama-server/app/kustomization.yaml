---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./pvc.yaml
  - ./deployment.yaml
  - ./service.yaml
  - ./httproute.yaml
  - ./servicemonitor.yaml
  - ./grafanadashboard.yaml
configMapGenerator:
  - name: llama-server-presets
    files:
      - models.ini=./models.ini
  - name: llm-serving-dashboard
    files:
      - llm-serving.json=./dashboards/llm-serving.json
    options:
      annotations:
        # the dashboard JSON uses ${DS_PROMETHEUS} (grafana-operator substitutes it)
        # and $__rate_interval (Grafana expands it) — keep Flux's postBuild
        # substitution away from both
        kustomize.toolkit.fluxcd.io/substitute: disabled
generatorOptions:
  disableNameSuffixHash: true
