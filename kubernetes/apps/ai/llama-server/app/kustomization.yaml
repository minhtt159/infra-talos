---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./pvc.yaml
  - ./deployment.yaml
  - ./service.yaml
  - ./httproute.yaml
  - ./servicemonitor.yaml
configMapGenerator:
  - name: llama-server-presets
    files:
      - models.ini=./models.ini
generatorOptions:
  disableNameSuffixHash: true
