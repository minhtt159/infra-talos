---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: llama-server
spec:
  dependsOn:
    - # NOTE:custom storage provider
      name: openebs
      namespace: openebs
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: llama-server
      namespace: ai
  path: ./kubernetes/apps/ai/llama-server/app
  targetNamespace: ai
  wait: true
