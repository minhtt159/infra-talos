---
# Internal only — Hindsight API/MCP auth is unverified; keep off public gateways.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hindsight
spec:
  hostnames:
    - "hindsight.${SECRET_DOMAIN}" # UI
    - "hindsight-api.${SECRET_DOMAIN}" # REST + MCP
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - headers:
            - name: Host
              value: "hindsight-api.${SECRET_DOMAIN}"
      backendRefs:
        - name: hindsight
          port: 8888
    - backendRefs:
        - name: hindsight
          port: 9999
