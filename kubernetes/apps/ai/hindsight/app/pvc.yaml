---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hindsight-cache
spec:
  accessModes:
    - ReadWriteOnce
  # Static PV adopting a pre-existing zvol (migration runbook Phase 3); PVs are
  # cluster state, `task pv:export` backs them up.
  storageClassName: truenas-csi-iscsi
  volumeName: hindsight-cache-data
  resources:
    requests:
      storage: 5Gi # else embedder/reranker models re-download every restart
