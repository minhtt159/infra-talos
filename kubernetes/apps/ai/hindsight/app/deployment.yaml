---
# Hindsight: Claude Code memory (UI + streamable-HTTP MCP).
# DB = CNPG (barman/Garage backups). LLM = litellm.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name hindsight
  annotations:
    # restart on secret change
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: *name
  template:
    metadata:
      labels:
        app: *name
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000 # cache mount writable for image user
      containers:
        - name: hindsight
          image: ghcr.io/vectorize-io/hindsight:1.1.0
          envFrom:
            - secretRef:
                name: hindsight-config # HINDSIGHT_API_DATABASE_URL
            - secretRef:
                name: hindsight-auth # HINDSIGHT_API_TENANT_API_KEY (Bearer)
            - configMapRef:
                name: hindsight-env # ./hindsight.env (server-level settings)
          env:
            # Bearer on all API + MCP. Holds even if CF Access bypassed.
            - name: HINDSIGHT_API_TENANT_EXTENSION
              value: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
            # UI -> API auth, same key. Does NOT gate UI; CF Access (Entra) does.
            - name: HINDSIGHT_CP_DATAPLANE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-auth
                  key: HINDSIGHT_API_TENANT_API_KEY
          ports:
            - name: api # REST + MCP
              containerPort: 8888
            - name: ui
              containerPort: 9999
          resources:
            requests:
              cpu: 500m
              memory: 2Gi # embedder + reranker in-process, CPU
            limits:
              memory: 4Gi
          volumeMounts:
            - name: cache
              mountPath: /home/hindsight/.cache # embedder/reranker downloads
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: hindsight-cache
