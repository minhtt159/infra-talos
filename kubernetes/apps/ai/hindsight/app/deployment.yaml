---
# Hindsight — Claude Code memory backend (web UI + streamable-HTTP MCP).
# Postgres = the CNPG cluster (rides its barman/Garage backups); LLM = litellm.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name hindsight
  annotations:
    # bounce on configmap/secret change
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: *name
  template:
    metadata:
      labels:
        app: *name
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000 # image runs as user hindsight; needs the cache mount writable
      containers:
        - name: hindsight
          image: ghcr.io/vectorize-io/hindsight:0.8.4
          envFrom:
            - secretRef:
                name: hindsight-config # HINDSIGHT_API_DATABASE_URL
            - secretRef:
                name: hindsight-auth # HINDSIGHT_API_TENANT_API_KEY (Bearer)
          env:
            # App-level auth: require Bearer on all HTTP API + MCP. Edge is also
            # gated by Cloudflare Access, but this holds even if CF is bypassed.
            - name: HINDSIGHT_API_TENANT_EXTENSION
              value: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
            # Control Plane (UI) -> dataplane API auth. Same key. NOTE: this does
            # NOT gate the UI itself — Cloudflare Access (Entra) does that.
            - name: HINDSIGHT_CP_DATAPLANE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-auth
                  key: HINDSIGHT_API_TENANT_API_KEY
            # stable worker id: default is the pod hostname (changes on recreate),
            # which orphans in-flight async tasks. replicas=1 so a fixed id is safe.
            - name: HINDSIGHT_API_WORKER_ID
              value: hindsight-0
            # LLM via the LiteLLM gateway (openai-compatible). Backend routing
            # lives in litellm's DB, not here. API key: envFrom hindsight-auth
            # (HINDSIGHT_API_LLM_API_KEY, a scoped litellm virtual key).
            - name: HINDSIGHT_API_LLM_PROVIDER
              value: openai
            - name: HINDSIGHT_API_LLM_BASE_URL
              value: http://litellm.ai.svc.cluster.local:4000/v1
            - name: HINDSIGHT_API_LLM_MODEL
              # thinking models break JSON extraction (empty content) — this
              # alias pins think:false on the litellm deployment.
              value: qwen3.5:9b-json
            # qwen3.6:35b-a3b: reuses the chat+research model (already resident on
            # the 3080Ti) — so reflect adds NO separate model and NO 3080Ti swap.
            # On-task benchmark (bank0 mental model) it gave the deepest, faithful,
            # English-clean synthesis; ~56s is fine for night-batch reflect.
            - name: HINDSIGHT_API_REFLECT_LLM_MODEL
              value: qwen3.6:35b-a3b
            # Appended to the retain/recall MCP tool descriptions. recall's
            # max_tokens is a TEXT-only budget (per-result metadata is free), so
            # the 4096 default packs 60+ short facts into a 60-80KB JSON blob —
            # tail is near-zero-score noise — which blows the client's MCP
            # output-token cap and gets dumped to a file. 1024 gives ~13 ranked
            # results / ~14KB (measured), inline and relevant. Soft nudge: it's
            # per-call and can't be hard-capped server-side in 0.8.4.
            - name: HINDSIGHT_API_MCP_INSTRUCTIONS
              value: >-
                recall: call with max_tokens=1024 by default to keep responses
                small and inline; raise toward 4096 only when a query genuinely
                needs broad recall. Results are ranked by final_score (highest
                first); the top few are what matter. Prefer budget="mid".
          ports:
            - name: api # REST + MCP
              containerPort: 8888
            - name: ui
              containerPort: 9999
          resources:
            requests:
              cpu: 500m
              memory: 2Gi # local embedder + reranker run in-process on CPU
            limits:
              memory: 4Gi
          volumeMounts:
            - name: cache
              mountPath: /home/hindsight/.cache # embedder/reranker downloads
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: hindsight-cache
