---
# Hindsight: Claude Code memory (UI + streamable-HTTP MCP).
# DB = CNPG (barman/Garage backups). LLM = litellm.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name hindsight
  annotations:
    # restart on secret change
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: *name
  template:
    metadata:
      labels:
        app: *name
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000 # cache mount writable for image user
      containers:
        - name: hindsight
          image: ghcr.io/vectorize-io/hindsight:0.10.3
          envFrom:
            - secretRef:
                name: hindsight-config # HINDSIGHT_API_DATABASE_URL
            - secretRef:
                name: hindsight-auth # HINDSIGHT_API_TENANT_API_KEY (Bearer)
          env:
            # Bearer on all API + MCP. Holds even if CF Access bypassed.
            - name: HINDSIGHT_API_TENANT_EXTENSION
              value: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
            # UI -> API auth, same key. Does NOT gate UI; CF Access (Entra) does.
            - name: HINDSIGHT_CP_DATAPLANE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hindsight-auth
                  key: HINDSIGHT_API_TENANT_API_KEY
            # fixed id: default = pod hostname, new on recreate -> orphans async
            # tasks. Safe at replicas=1.
            - name: HINDSIGHT_API_WORKER_ID
              value: hindsight-0
            # LLM via litellm (openai-compatible); routing in litellm DB.
            # Key: HINDSIGHT_API_LLM_API_KEY (scoped virtual key, hindsight-auth).
            - name: HINDSIGHT_API_LLM_PROVIDER
              value: openai
            - name: HINDSIGHT_API_LLM_BASE_URL
              value: http://litellm.ai.svc.cluster.local:4000/v1
            - name: HINDSIGHT_API_LLM_MODEL
              # alias pins think:false; thinking breaks JSON extraction
              value: qwen3.5:9b-json
            # same B580 weights as LLM_MODEL, thinking on (alias sets
            # enable_thinking: true); no extra VRAM, no model swap.
            - name: HINDSIGHT_API_REFLECT_LLM_MODEL
              value: qwen3.5:9b-think
            # worst call ~200s: 48k prefill at ~2k tok/s + ~8k thinking tokens
            # at ~55 tok/s. A timed-out call is cancelled server-side (no
            # orphan holding the slot), so this is a plain ceiling.
            - name: HINDSIGHT_API_REFLECT_LLM_TIMEOUT
              value: "300"
            # llama-server ctx 64k - ~12k thinking + answer - margin.
            - name: HINDSIGHT_API_REFLECT_MAX_CONTEXT_TOKENS
              value: "48000"
            # the think alias is one litellm slot (mpr=1); reflect's tool loop is
            # sequential anyway.
            - name: HINDSIGHT_API_REFLECT_LLM_MAX_CONCURRENT
              value: "1"
            # serialized calls run longer than 300s default. Stay < edge 600s.
            - name: HINDSIGHT_API_REFLECT_WALL_TIMEOUT
              value: "540"
            # mental-model refresh ignores REFLECT_LLM_*: own knobs, else global
            # (120s, 2 concurrent). Refresh runs the reflect loop with thinking
            # on - 120s cuts a long synthesis. Match reflect.
            - name: HINDSIGHT_API_MENTAL_MODEL_REFRESH_LLM_TIMEOUT
              value: "300"
            - name: HINDSIGHT_API_MENTAL_MODEL_REFRESH_LLM_MAX_CONCURRENT
              value: "1"
            # = llama-server slots (parallel = 2); default 32 just queues in
            # litellm/llama-server and runs into the per-call timeout.
            - name: HINDSIGHT_API_LLM_MAX_CONCURRENT
              value: "2"
            # retain chunks that exhaust retries are lost. 429 (litellm mpr full)
            # and a llama-server restart (model reload) both clear on retry;
            # default 3 is too few for a reload.
            - name: HINDSIGHT_API_LLM_MAX_RETRIES
              value: "10"
            # CPU cross-encoder on 8-core arm64: default 4 concurrent x 8 torch
            # threads thrashed -> 140-680s recalls, MCP timeouts. Serialize.
            - name: HINDSIGHT_API_RERANKER_LOCAL_MAX_CONCURRENT
              value: "1"
            # default 300; idle rerank 300=~19s, 100=~6s. RRF top-100 enough.
            - name: HINDSIGHT_API_RERANKER_MAX_CANDIDATES
              value: "100"
            # length-sorted batches, less padding (upstream: 36-54% faster)
            - name: HINDSIGHT_API_RERANKER_LOCAL_BUCKET_BATCHING
              value: "true"
          ports:
            - name: api # REST + MCP
              containerPort: 8888
            - name: ui
              containerPort: 9999
          resources:
            requests:
              cpu: 500m
              memory: 2Gi # embedder + reranker in-process, CPU
            limits:
              memory: 4Gi
          volumeMounts:
            - name: cache
              mountPath: /home/hindsight/.cache # embedder/reranker downloads
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: hindsight-cache
