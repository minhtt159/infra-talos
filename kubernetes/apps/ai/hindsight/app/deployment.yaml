---
# Hindsight — Claude Code memory backend (web UI + streamable-HTTP MCP).
# Postgres = the CNPG cluster (rides its barman/Garage backups); LLM = ollama.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name hindsight
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: *name
  template:
    metadata:
      labels:
        app: *name
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000 # image runs as user hindsight; needs the cache mount writable
      containers:
        - name: hindsight
          image: ghcr.io/vectorize-io/hindsight:0.8.4
          envFrom:
            - secretRef:
                name: hindsight-config # HINDSIGHT_API_DATABASE_URL
            - secretRef:
                name: hindsight-auth # HINDSIGHT_API_TENANT_API_KEY (Bearer)
          env:
            # App-level auth: require Bearer on all HTTP API + MCP. Edge is also
            # gated by Cloudflare Access, but this holds even if CF is bypassed.
            - name: HINDSIGHT_API_TENANT_EXTENSION
              value: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
            - name: HINDSIGHT_API_LLM_PROVIDER
              value: ollama
            - name: HINDSIGHT_API_LLM_BASE_URL
              value: http://ollama.ai.svc.cluster.local:11434/v1 # OpenAI-compat path
            - name: HINDSIGHT_API_LLM_MODEL
              # qwen3.x are thinking models -> empty content on JSON extraction.
              # Non-thinking, JSON-solid model needed. Fits B580 12GB @ Q4.
              value: qwen2.5:14b
            - name: HINDSIGHT_API_LLM_API_KEY
              value: not-needed # must be set even for local providers
          ports:
            - name: api # REST + MCP
              containerPort: 8888
            - name: ui
              containerPort: 9999
          resources:
            requests:
              cpu: 500m
              memory: 2Gi # local embedder + reranker run in-process on CPU
            limits:
              memory: 4Gi
          volumeMounts:
            - name: cache
              mountPath: /home/hindsight/.cache # embedder/reranker downloads
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: hindsight-cache
