---
# Public via CF tunnel (*.hnimn.art -> envoy-external). CF Access:
#   hindsight     (UI)      -> Entra SSO
#   hindsight-api (API/MCP) -> service token (+ Entra for UI->API)
# Plus app Bearer key (hindsight-auth).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hindsight-external
  annotations:
    # / redirects to /dashboard; the internet view ignores redirects
    gatus.home-operations.com/endpoint: |
      path: /dashboard
spec:
  hostnames:
    - "hindsight.hnimn.art" # UI
    - "hindsight-api.hnimn.art" # REST + MCP
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        - headers:
            - name: Host
              value: "hindsight-api.hnimn.art"
      backendRefs:
        - name: hindsight
          port: 8888
    - backendRefs:
        - name: hindsight
          port: 9999
