---
# Public via CF tunnel (*.${SECRET_DOMAIN} -> envoy-external). CF Access:
#   hindsight     (UI)      -> Entra SSO
#   hindsight-api (API/MCP) -> service token (+ Entra for UI->API)
# Plus app Bearer key (hindsight-auth).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hindsight-external
  annotations:
    # split-horizon: the LAN route probes hindsight; this one would only test CF Access
    gatus.home-operations.com/enabled: "false"
spec:
  hostnames:
    - "hindsight.${SECRET_DOMAIN}" # UI
    - "hindsight-api.${SECRET_DOMAIN}" # REST + MCP
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        - headers:
            - name: Host
              value: "hindsight-api.${SECRET_DOMAIN}"
      backendRefs:
        - name: hindsight
          port: 8888
    - backendRefs:
        - name: hindsight
          port: 9999
