---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# App-level Bearer secrets. secretKey = env var name (loaded via envFrom).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields # custom fields on the item
  target:
    name: hindsight-auth
    creationPolicy: Owner
  data:
    # TODO: Vaultwarden item homelab-talos/hindsight-api-auth with two custom
    # fields (generate long random values): api_key, mcp_token.
    - secretKey: HINDSIGHT_API_TENANT_API_KEY
      remoteRef:
        key: REPLACE-WITH-VAULTWARDEN-UUID # vaultwarden: hindsight-api-auth (field: api_key)
        property: api_key
    - secretKey: HINDSIGHT_API_MCP_AUTH_TOKEN
      remoteRef:
        key: REPLACE-WITH-VAULTWARDEN-UUID
        property: mcp_token
