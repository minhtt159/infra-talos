---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# App Bearer secrets. secretKey = env var name (envFrom).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields # custom fields on the item
  target:
    name: hindsight-auth
    creationPolicy: Owner
  data:
    # tenant key gates whole API incl. /mcp/
    - secretKey: HINDSIGHT_API_TENANT_API_KEY
      remoteRef:
        key: 972dc2c2-e6d5-453c-9a00-d3d99dc4b093 # vaultwarden: hindsight-api-key (field: api_key)
        property: api_key
    # litellm virtual key, scoped to hindsight's models
    - secretKey: HINDSIGHT_API_LLM_API_KEY
      remoteRef:
        key: 972dc2c2-e6d5-453c-9a00-d3d99dc4b093 # same item (field: litellm_api_key)
        property: litellm_api_key
