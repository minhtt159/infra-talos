---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# App-level Bearer secrets. secretKey = env var name (loaded via envFrom).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields # custom fields on the item
  target:
    name: hindsight-auth
    creationPolicy: Owner
  data:
    # Tenant key gates the whole HTTP API incl. /mcp/ — one key is enough.
    - secretKey: HINDSIGHT_API_TENANT_API_KEY
      remoteRef:
        key: 972dc2c2-e6d5-453c-9a00-d3d99dc4b093 # vaultwarden: hindsight-api-key (field: api_key)
        property: api_key
