---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: hindsight-config
    creationPolicy: Owner
    template:
      # Assemble the DSN here so the password never lands in git.
      data:
        HINDSIGHT_API_DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@postgres-rw.database.svc.cluster.local:5432/hindsight"
  data:
    # TODO: same Vaultwarden item as the DB role (homelab-talos/hindsight-db).
    - secretKey: username
      remoteRef:
        key: REPLACE-WITH-VAULTWARDEN-UUID # vaultwarden: homelab-talos/hindsight-db (field: username)
        property: username
    - secretKey: password
      remoteRef:
        key: REPLACE-WITH-VAULTWARDEN-UUID
        property: password
