---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login # login item — username/password under $.data.login
  target:
    name: hindsight-config
    creationPolicy: Owner
    template:
      # Assemble the DSN here so the password never lands in git.
      data:
        HINDSIGHT_API_DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@postgres-rw.database.svc.cluster.local:5432/hindsight"
  data:
    # same Vaultwarden item as the DB role (hindsight-db).
    - secretKey: username
      remoteRef:
        key: 63669701-fb8c-4173-8b68-05f53767c61c # vaultwarden: hindsight-db
        property: username
    - secretKey: password
      remoteRef:
        key: 63669701-fb8c-4173-8b68-05f53767c61c
        property: password
