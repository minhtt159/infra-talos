---
# Public route edge policy. Route BTP does NOT merge with gateway BTP:
# restate every field.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: hindsight-api-ratelimit
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: hindsight-external
  timeout:
    http:
      # else Envoy 15s default -> slow recall/reflect 504s. Whole-request,
      # not idle (SSE pings don't extend). Keep > REFLECT_LLM_TIMEOUT.
      requestTimeout: 600s
  # 600/min per client IP (XFF via cloudflared): leaked-token blast cap,
  # tighter than gateway 3000/min. Global = gateway's ratelimit + Valkey.
  rateLimit:
    type: Global
    global:
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 600
            unit: Minute
