---
# Tighter per-route rate limit for the public Hindsight route, overriding the
# envoy-external gateway default (3000/min). 600 req/min (~10 rps) per distinct
# client IP (XFF behind cloudflared) — blast-radius cap on a leaked token, while
# still surviving the bulk-import burst. Global type -> same envoy-ratelimit +
# Valkey backend the gateway policy uses.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: hindsight-api-ratelimit
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: hindsight-external
  rateLimit:
    type: Global
    global:
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 600
            unit: Minute
