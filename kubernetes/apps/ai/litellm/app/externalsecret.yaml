---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login # login item — username/password under $.data.login
  target:
    name: litellm-config
    creationPolicy: Owner
    template:
      # Assemble the DSN here so the password never lands in git.
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@postgres-rw.database.svc.cluster.local:5432/litellm"
  data:
    # same Vaultwarden item as the DB role (litellm-db).
    - secretKey: username
      remoteRef:
        key: 00000000-0000-0000-0000-000000000000 # TODO: vaultwarden UUID (litellm-db login item)
        property: username
    - secretKey: password
      remoteRef:
        key: 00000000-0000-0000-0000-000000000000 # TODO: vaultwarden UUID (litellm-db login item)
        property: password
