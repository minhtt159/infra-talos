---
# LiteLLM proxy config. Deliberately holds no model_list / backends — models and
# their endpoints are added through the admin UI and persisted in the CNPG
# `litellm` database (store_model_in_db). Keeps GPU/backend topology out of this
# public repo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config-yaml
data:
  config.yaml: |
    general_settings:
      store_model_in_db: true
      store_prompts_in_spend_logs: true # request/response bodies in UI Logs (debugging)
      maximum_spend_logs_retention_period: "30d" # else the spend-logs table grows forever
      allow_requests_on_db_unavailable: true # CNPG restart != LLM outage (keys served from cache)
    litellm_settings:
      callbacks: ["prometheus"] # expose /metrics on the proxy port for the ServiceMonitor
      drop_params: true # strip OpenAI params a backend doesn't support instead of 400ing
      request_timeout: 600 # match the proxy/ollama timeout budget end-to-end
      num_retries: 2 # retry transient backend failures before surfacing to the client
      json_logs: true # structured logs for the observability stack
      # Routing lives in the DB (endpoints out of this public repo). Shared
      # models are single-name GROUPS across both ollama servers (B580 weight 4
      # + pc weight 1) — litellm auto-routes, leaning in-cluster and spilling to
      # pc when the B580 slot is busy; no explicit `-pc` fallback needed. Only
      # cross-model fallbacks (a *different* model on failure) live here:
      fallbacks:
        # interactive chat (3080Ti 35b-a3b, pc-only) degrades to the B580 9b
        # (chat-fast) when the pc is busy/down. research-deep gets no auto
        # fallback (qwen3.5:122b-a10b escalation is deliberate-invoke only).
        - qwen3.6:35b-a3b: ["chat-fast"]
      # Auto model-switch by prompt size: a request too big for chat-fast's
      # 16k window (e.g. a big Hindsight-context Telegram turn) auto-escalates
      # to qwen3.6:35b-a3b (32k). Per-deployment max_input_tokens live in the DB;
      # pricing (input/output_cost_per_token) is set from BerriAI's
      # model_prices_and_context_window.json (nearest hosted equivalent) so
      # spend + these context checks reflect reality.
      context_window_fallbacks:
        - chat-fast: ["qwen3.6:35b-a3b"]
    router_settings:
      # pre-count prompt tokens vs each deployment's max_input_tokens and route
      # accordingly — required for context_window_fallbacks to fire (ollama would
      # otherwise silently truncate instead of erroring).
      enable_pre_call_checks: true
