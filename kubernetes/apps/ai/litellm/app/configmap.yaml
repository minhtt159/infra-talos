---
# LiteLLM proxy config. No model_list here — models, endpoints, routing, pricing
# all live in the CNPG `litellm` DB (store_model_in_db). Keeps topology out of
# this public repo. Ops detail: homelab-platform/litellm-ops-notes.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config-yaml
data:
  config.yaml: |
    general_settings:
      store_model_in_db: true
      store_prompts_in_spend_logs: true # log req/resp bodies
      maximum_spend_logs_retention_period: "30d" # cap table growth
      allow_requests_on_db_unavailable: true # DB restart != LLM outage
    litellm_settings:
      callbacks: ["prometheus"] # /metrics for the ServiceMonitor
      drop_params: true # drop unsupported params, don't 400
      request_timeout: 600 # ollama budget
      num_retries: 2 # retry transient fails
      json_logs: true
      # shared models are DB model-groups spanning both ollama servers — litellm
      # auto-routes (B580-weighted, spills to pc). only cross-model fallback here:
      fallbacks:
        - qwen3.6:35b-a3b: ["chat-fast"] # chat -> B580 9b when pc busy/down
