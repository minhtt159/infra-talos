---
# LiteLLM proxy config. Deliberately holds no model_list / backends — models and
# their endpoints are added through the admin UI and persisted in the CNPG
# `litellm` database (store_model_in_db). Keeps GPU/backend topology out of this
# public repo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config-yaml
data:
  config.yaml: |
    general_settings:
      store_model_in_db: true
      store_prompts_in_spend_logs: true # request/response bodies in UI Logs (debugging)
      maximum_spend_logs_retention_period: "30d" # else the spend-logs table grows forever
      allow_requests_on_db_unavailable: true # CNPG restart != LLM outage (keys served from cache)
    litellm_settings:
      callbacks: ["prometheus"] # expose /metrics on the proxy port for the ServiceMonitor
      drop_params: true # strip OpenAI params a backend doesn't support instead of 400ing
      request_timeout: 600 # match the proxy/ollama timeout budget end-to-end
      num_retries: 2 # retry transient backend failures before surfacing to the client
      json_logs: true # structured logs for the observability stack
