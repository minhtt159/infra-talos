---
# LiteLLM proxy + admin UI — OpenAI/Ollama-compatible gateway to the GPU fleet.
# All state (models, virtual keys, spend) lives in the CNPG `litellm` database;
# no PVC. The -database image variant ships the Prisma client needed to run the
# DB migrations on startup (the plain image can't).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name litellm
  annotations:
    # bounce on configmap/secret change — subPath mounts never update in-place.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: *name
  template:
    metadata:
      labels:
        app: *name
    spec:
      automountServiceAccountToken: false
      initContainers:
        # Migration guard: prisma migrate deploy silently falls back to `db push`
        # on failure, so a wedged migration (P3009) stays invisible while the app
        # keeps serving on a drifting schema. This makes it loud — refuse to start
        # if a migration is in the failed state, turning it into a CrashLoop the
        # existing kube-prometheus-stack KubePodCrashLooping alert catches.
        # Pending (not failed) migrations pass through; the app applies them.
        - name: migration-guard
          image: &image ghcr.io/berriai/litellm-database:v1.92.0
          envFrom:
            - secretRef:
                name: litellm-config # DATABASE_URL
          command: ["sh", "-c"]
          args:
            - |
              cd /app/.venv/lib/python*/site-packages/litellm_proxy_extras
              out=$(python -m prisma migrate status 2>&1) || true
              printf '%s\n' "$out"
              if printf '%s' "$out" | grep -qiE 'have failed|P3009'; then
                echo 'FATAL: failed prisma migration present, refusing to start. See https://pris.ly/d/migrate-resolve'
                exit 1
              fi
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: litellm
          image: *image
          args:
            - "--config"
            - "/app/config.yaml"
          envFrom:
            - secretRef:
                name: litellm-config # DATABASE_URL
            - secretRef:
                name: litellm-auth # LITELLM_MASTER_KEY
          ports:
            - name: http
              containerPort: 4000
          # entrypoint runs prisma migrate before serving — can take minutes.
          # startupProbe carries that window (30×10s = 5min) so the tight
          # liveness probe doesn't kill the pod mid-migration.
          startupProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: litellm-config-yaml
