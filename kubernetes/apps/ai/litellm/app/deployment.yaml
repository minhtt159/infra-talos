---
# LiteLLM proxy + admin UI — OpenAI/Ollama-compatible gateway to the GPU fleet.
# All state (models, virtual keys, spend) lives in the CNPG `litellm` database;
# no PVC. The -database image variant ships the Prisma client needed to run the
# DB migrations on startup (the plain image can't).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name litellm
  annotations:
    # bounce on configmap/secret change — subPath mounts never update in-place.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: *name
  template:
    metadata:
      labels:
        app: *name
    spec:
      automountServiceAccountToken: false
      initContainers:
        # Single source of DB migrations (upstream's production pattern). The app
        # container has DISABLE_SCHEMA_UPDATE=true, so it never touches the schema
        # — otherwise litellm's entrypoint reconciles drift via `prisma db push`
        # on every boot, which silently masked a wedged migration (P3009) while
        # serving on a drifting schema. Here `migrate deploy` is the only writer:
        # it applies pending migrations and, on a failed one, exits non-zero →
        # CrashLoop the kube-prometheus-stack KubePodCrashLooping alert catches.
        - name: db-migrate
          # repeated below, not anchored — Renovate can't see `&image`.
          image: ghcr.io/berriai/litellm-database:v1.97.0
          envFrom:
            - secretRef:
                name: litellm-config # DATABASE_URL
          command: ["sh", "-c"]
          args:
            - |
              cd /app/.venv/lib/python*/site-packages/litellm_proxy_extras
              exec python -m prisma migrate deploy
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            # prisma's node schema engine spikes well past 256Mi; less OOM-kills
            # the migrator into a CrashLoop before it can apply anything.
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm-database:v1.97.0
          args:
            - "--config"
            - "/app/config.yaml"
          envFrom:
            - secretRef:
                name: litellm-config # DATABASE_URL
            - secretRef:
                name: litellm-auth # LITELLM_MASTER_KEY
          env:
            # the db-migrate initContainer owns migrations; keep the serving pod
            # from running prisma db push / diff-reconcile on every boot.
            - name: DISABLE_SCHEMA_UPDATE
              value: "true"
          ports:
            - name: http
              containerPort: 4000
          # migrations run in the db-migrate initContainer, but first boot can
          # still be slow (model load, cache warm). startupProbe carries that
          # window (30×10s = 5min) so the tight liveness probe doesn't kill it.
          startupProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: litellm-config-yaml
