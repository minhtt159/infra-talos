---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# App-level auth. secretKey = env var name (loaded via envFrom).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields # custom fields on the item
  target:
    name: litellm-auth
    creationPolicy: Owner
  data:
    # Admin UI login (user admin + master key) and virtual-key minting key.
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: 00000000-0000-0000-0000-000000000000 # TODO: vaultwarden UUID (litellm-master-key item, field: master_key)
        property: master_key
