---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: yoke
  annotations:
    # /healthz answers without auth; everything else wants the hub's basic auth or bearer.
    gatus.home-operations.com/endpoint: |
      path: /healthz
      conditions:
        - "[STATUS] == 200"
spec:
  hostnames:
    - "yoke.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: yoke
          port: 8099
