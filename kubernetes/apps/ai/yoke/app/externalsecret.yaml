---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# KP_HUB_TOKEN: the shared hub bearer (every worker holds the same string in ~/kp-hub.token).
# ES_API_KEY: Elasticsearch key for the audit sweep thread (--sweep-every).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: yoke-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: yoke-secrets
    creationPolicy: Owner
  data:
    - secretKey: KP_HUB_TOKEN
      remoteRef:
        key: 00000000-0000-0000-0000-000000000000 # vaultwarden: yoke-hub-token, owner fills
        property: token
    - secretKey: ES_API_KEY
      remoteRef:
        key: 00000000-0000-0000-0000-000000000000 # vaultwarden: yoke-es-apikey, owner fills
        property: token
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Pull credential for the yoke image only: a Forgejo bot user whose token has read:package
# and nothing else. Used by this HelmRelease alone (imagePullSecrets). git.hnimn.art is
# split-horizon, so the nodes pull over the LAN; the public path is behind Access anyway.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: yoke-registry
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: yoke-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: '{"auths":{"git.hnimn.art":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: 00000000-0000-0000-0000-000000000000 # vaultwarden: yoke-registry (login: bot user + read:package token), owner fills
        property: username
    - secretKey: password
      remoteRef:
        key: 00000000-0000-0000-0000-000000000000
        property: password
