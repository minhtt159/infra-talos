---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Log shipper: container stdout -> TrueNAS Elasticsearch (data streams).
# Envoy external-gateway access logs (ECS JSON) get their own stream via
# rewrite_tag; everything else lands in logs-kubernetes. Index templates/ILM
# are owned by the es-policies replay Job.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
spec:
  chartRef:
    kind: OCIRepository
    name: fluent-bit
  interval: 1h
  values:
    serviceMonitor:
      enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    envFrom:
      - secretRef:
          name: fluent-bit-es-credentials
    config:
      service: |
        [SERVICE]
            Daemon Off
            Flush 5
            Log_Level info
            Parsers_File /fluent-bit/etc/parsers.conf
            HTTP_Server On
            HTTP_Listen 0.0.0.0
            HTTP_Port 2020
            Health_Check On
            storage.path /var/log/flb-storage/
            storage.sync normal
            storage.checksum off
            storage.backlog.mem_limit 16M

      inputs: |
        [INPUT]
            Name tail
            Path /var/log/containers/*.log
            multiline.parser cri
            Tag kube.*
            Mem_Buf_Limit 16MB
            storage.type filesystem
            Skip_Long_Lines On

      filters: |
        [FILTER]
            Name kubernetes
            Match kube.*
            # kube-apiserver metadata responses for pods with many labels/annotations
            # exceed the 32k default HTTP client buffer ("cannot increase buffer:
            # requested=64768 max=32000") -> enrich silently fails for that pod. Raise it.
            Buffer_Size 1M
            Merge_Log On
            # Nest parsed app JSON under a single key instead of the doc root.
            # The es template maps `app` as `flattened` (one mapping for any
            # structure) so unpredictable per-app keys can't explode the
            # logs-kubernetes field count. Query in Kibana as `app.<field>`.
            Merge_Log_Key app
            Merge_Log_Trim On
            Keep_Log Off
            K8S-Logging.Parser Off
            K8S-Logging.Exclude On
            Labels On
            Annotations Off

        # envoy-external access logs -> own tag/stream. Match on the parsed
        # event.dataset marker, NOT the pod label: the same pods also emit
        # coraza-wasm chatter and startup logs that must stay in
        # logs-kubernetes, not pollute the access stream.
        [FILTER]
            Name rewrite_tag
            Match kube.*
            Rule $app['event.dataset'] ^envoy\.access$ envoy.access false

        # Merge_Log_Key nested the parsed ECS JSON under app.* (right for
        # logs-kubernetes, wrong here) — lift it back to the doc root where
        # the logs-envoy template maps it. @timestamp stays out_es-owned
        # (CRI record time); Envoy emits its %START_TIME% as event.start.
        [FILTER]
            Name nest
            Match envoy.access
            Operation lift
            Nested_under app

      outputs: |
        # ECS envoy access logs -> data stream logs-envoy.access
        [OUTPUT]
            Name es
            Match envoy.access
            Host elastic.${SECRET_DOMAIN}
            Port 443
            Tls On
            HTTP_User $${ES_USER}
            HTTP_Passwd $${ES_PASSWORD}
            Index logs-envoy.access
            Suppress_Type_Name On
            Write_Operation create
            Generate_ID Off
            Logstash_Format Off
            Trace_Error On
            # default Retry_Limit is 1 — a chunk is DISCARDED after one failed
            # retry; ES is external (TrueNAS), so reboots/upgrades would punch
            # holes in the stream. False = retry until the 512M backlog fills.
            Retry_Limit False
            storage.total_limit_size 512M

        # everything else -> data stream logs-kubernetes
        [OUTPUT]
            Name es
            Match kube.*
            Host elastic.${SECRET_DOMAIN}
            Port 443
            Tls On
            HTTP_User $${ES_USER}
            HTTP_Passwd $${ES_PASSWORD}
            Index logs-kubernetes
            Suppress_Type_Name On
            Write_Operation create
            Generate_ID Off
            Logstash_Format Off
            Trace_Error On
            Retry_Limit False
            storage.total_limit_size 512M
