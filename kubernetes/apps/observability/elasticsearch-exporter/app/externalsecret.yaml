---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: elasticsearch-exporter
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: elasticsearch-exporter-secret # name the HelmRelease references
    creationPolicy: Owner
  data:
    - secretKey: ES_API_KEY
      remoteRef:
        # TODO: create the Vaultwarden item and put its UUID here.
        # Store the base64-encoded "id:api_key" that Elasticsearch returns.
        key: <vaultwarden-item-uuid> # vaultwarden: homelab-talos/elasticsearch-exporter
        property: api-key
