---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: elasticsearch-exporter
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: elasticsearch-exporter-secret # name the HelmRelease references
    creationPolicy: Owner
  data:
    - secretKey: ES_API_KEY
      remoteRef:
        key: 244c2a5d-f1c5-47e0-b5fa-b49268c5c0a3 # vaultwarden: homelab-talos/elasticsearch-exporter (field: api-key)
        property: api-key
