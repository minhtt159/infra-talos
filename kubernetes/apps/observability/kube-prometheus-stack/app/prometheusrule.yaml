---
# Prometheus runs in agent mode; Thanos Ruler evaluates every rule against promeo
# (TrueNAS). If remote_write stalls while promeo stays up, every data-based rule
# (KubePodCrashLooping included) goes quiet while Watchdog (vector(1)) keeps
# firing. This is the one rule that notices.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: metrics-pipeline
spec:
  groups:
    - name: metrics-pipeline
      rules:
        - alert: MetricsStale
          # absent(), not time()-timestamp(): once samples stop, the series leaves
          # the 5m lookback and max() returns nothing - that form never fires.
          expr: absent(up{job="kube-state-metrics"})
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: No kube-state-metrics samples in promeo for ~10m
            description: >-
              remote_write from the in-cluster Prometheus agent to promeo has
              stalled (or kube-state-metrics is down). Every other data-based alert
              is blind until this clears.
