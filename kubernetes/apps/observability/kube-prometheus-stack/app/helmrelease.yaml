apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    # ref: https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
    cleanPrometheusOperatorObjectNames: true
    crds:
      upgradeJob:
        enabled: true
        forceConflicts: true
    alertmanager:
      route:
        main:
          enabled: true
          hostnames:
            - alertmanager.${SECRET_DOMAIN}
          parentRefs:
            - name: envoy-internal
              namespace: network
      alertmanagerSpec:
        # alertmanagerConfiguration:
        #   name: alertmanager
        externalUrl: https://alertmanager.${SECRET_DOMAIN}
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: truenas-nfs
              resources:
                requests:
                  storage: 1Gi

    # Rules + alerting in-cluster; TrueNAS runs promeo only. Prometheus below is
    # agent (no TSDB, no rule engine) → Thanos Ruler evaluates every
    # PrometheusRule against promeo's query API, remote-writes recording rules
    # back (mixin dashboards need `:sum_rate` series), alerts → Alertmanager
    # above. remoteWrite set → stateless, no local TSDB.
    thanosRuler:
      enabled: true
      thanosRulerSpec:
        ruleSelectorNilUsesHelmValues: false
        evaluationInterval: 1m
        # skip seconds promeo hasn't received yet (remote_write lag)
        ruleQueryOffset: 1m
        alertQueryUrl: https://promeo.${SECRET_DOMAIN}
        alertmanagersUrl:
          - http://alertmanager-operated.observability.svc.cluster.local:9093
        # --query = http only; https needs query config file → secret.yaml
        queryConfig:
          existingSecret:
            name: thanos-ruler-query-config
            key: query-configs.yaml
        remoteWrite:
          - url: https://promeo.${SECRET_DOMAIN}/api/v1/write
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
    kubeEtcd:
      enabled: true
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes
    kubeProxy:
      enabled: false
    prometheus:
      # Agent: scrape + remote_write only. No TSDB, rules, query API. Store =
      # promeo (Prometheus on TrueNAS, 6w); Grafana, Kargo, Thanos Ruler query
      # it. Nothing node-pinned here; dead node costs in-flight WAL at most.
      agentMode: true
      route:
        main:
          enabled: true
          hostnames:
            - prometheus.${SECRET_DOMAIN}
          parentRefs:
            - name: envoy-internal
              namespace: network
      prometheusSpec:
        externalUrl: https://prometheus.${SECRET_DOMAIN}
        securityContext:
          runAsNonRoot: true
          runAsUser: 64535
          runAsGroup: 64535
          fsGroup: 64535
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        # promeo sized for full set (~300k series, 12k samples/s; homelab-platform
        # docs/observability/promeo-sizing.md). Queue raised: default max 50
        # shards, filtered set already wanted 112. Watch shards_desired,
        # samples_dropped_total.
        remoteWrite:
          - url: https://promeo.${SECRET_DOMAIN}/api/v1/write
            queueConfig:
              maxShards: 200
              maxSamplesPerSend: 2000
              capacity: 20000
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2000Mi

    prometheus-node-exporter:
      fullnameOverride: node-exporter
      resources:
        requests:
          cpu: 10m
          memory: 32Mi

    prometheusOperator:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
      # the config-reloader sidecar injected into prometheus/alertmanager pods
      # — without this those pods fail require-resource-requests (main
      # containers have requests via {prometheus,alertmanager}Spec.resources)
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi

    # Flux resource-state metrics come from flux-operator (flux_resource_info)
    # — the customResourceState recipe from flux2-monitoring-example is gone.
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      resources:
        requests:
          cpu: 10m
          memory: 64Mi

    grafana:
      enabled: false
      forceDeployDashboards: true
      operator:
        dashboardsConfigMapRefEnabled: true
        folder: observability
        matchLabels:
          grafana.internal/instance: grafana
