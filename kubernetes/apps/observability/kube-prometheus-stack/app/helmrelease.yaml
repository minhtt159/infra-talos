apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    # ref: https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
    cleanPrometheusOperatorObjectNames: true
    crds:
      upgradeJob:
        enabled: true
        forceConflicts: true
    alertmanager:
      route:
        main:
          enabled: true
          hostnames:
            - alertmanager.${SECRET_DOMAIN}
          parentRefs:
            - name: envoy-internal
              namespace: network
      alertmanagerSpec:
        # alertmanagerConfiguration:
        #   name: alertmanager
        externalUrl: https://alertmanager.${SECRET_DOMAIN}
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: truenas-nfs
              resources:
                requests:
                  storage: 1Gi

    # Rules + alerting stay in-cluster; TrueNAS runs promeo and nothing else.
    # The Prometheus below is an agent (no TSDB, no rule engine), so Thanos
    # Ruler evaluates every PrometheusRule against promeo's Prometheus-compatible
    # query API, remote-writes recording-rule results back to promeo (mixin
    # dashboards need the `:sum_rate`-style series) and pushes alerts to the
    # Alertmanager above. Stateless: remoteWrite set → no local TSDB.
    thanosRuler:
      enabled: true
      thanosRulerSpec:
        ruleSelectorNilUsesHelmValues: false
        evaluationInterval: 1m
        # remote_write lag: don't evaluate the seconds promeo hasn't received yet
        ruleQueryOffset: 1m
        alertQueryUrl: https://promeo.${SECRET_DOMAIN}
        alertmanagersUrl:
          - http://alertmanager-operated.observability.svc.cluster.local:9093
        # --query only speaks http; https needs a query config file → secret.yaml
        queryConfig:
          existingSecret:
            name: thanos-ruler-query-config
            key: query-configs.yaml
        remoteWrite:
          - url: https://promeo.${SECRET_DOMAIN}/api/v1/write
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
    kubeEtcd:
      enabled: true
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes
    kubeProxy:
      enabled: false
    prometheus:
      # Agent mode: scrape + remote_write only. No TSDB, no rules, no query API —
      # promeo (Prometheus on TrueNAS, 6w retention) is the store; Grafana, Kargo
      # and Thanos Ruler query it. Nothing node-pinned left in this stack, so a
      # dead node costs at most the in-flight WAL.
      agentMode: true
      route:
        main:
          enabled: true
          hostnames:
            - prometheus.${SECRET_DOMAIN}
          parentRefs:
            - name: envoy-internal
              namespace: network
      prometheusSpec:
        externalUrl: https://prometheus.${SECRET_DOMAIN}
        securityContext:
          runAsNonRoot: true
          runAsUser: 64535
          runAsGroup: 64535
          fsGroup: 64535
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        # promeo needs --web.enable-remote-write-receiver. It ingests slowly —
        # the full series set overran it (339 desired shards vs max 50), hence
        # the drops. Still >50 after this = promeo is under-resourced, don't
        # raise maxShards.
        remoteWrite:
          - url: https://promeo.${SECRET_DOMAIN}/api/v1/write
            writeRelabelConfigs:
              # biggest volume driver; _sum/_count kept
              - sourceLabels: [__name__]
                regex: ".+_bucket"
                action: drop
              - sourceLabels: [__name__]
                regex: "go_.*|process_.*"
                action: drop
              # cAdvisor churn from short-lived pods; cpu/mem kept
              - sourceLabels: [__name__]
                regex: "container_(network|fs|tasks_state|memory_failures|spec)_.*"
                action: drop
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2000Mi

    prometheus-node-exporter:
      fullnameOverride: node-exporter
      resources:
        requests:
          cpu: 10m
          memory: 32Mi

    prometheusOperator:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
      # the config-reloader sidecar injected into prometheus/alertmanager pods
      # — without this those pods fail require-resource-requests (main
      # containers have requests via {prometheus,alertmanager}Spec.resources)
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi

    # Flux resource-state metrics come from flux-operator (flux_resource_info)
    # — the customResourceState recipe from flux2-monitoring-example is gone.
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      resources:
        requests:
          cpu: 10m
          memory: 64Mi

    grafana:
      enabled: false
      forceDeployDashboards: true
      operator:
        dashboardsConfigMapRefEnabled: true
        folder: observability
        matchLabels:
          grafana.internal/instance: grafana
