apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    # ref: https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
    cleanPrometheusOperatorObjectNames: true
    crds:
      upgradeJob:
        enabled: true
        forceConflicts: true
    alertmanager:
      route:
        main:
          enabled: true
          labels:
            forward-auth: authentik
          annotations:
            gatus.home-operations.com/enabled: "false" # gated by authentik forward-auth
          hostnames:
            - alertmanager.hnimn.art
          parentRefs:
            - name: envoy-internal
              namespace: network
      alertmanagerSpec:
        alertmanagerConfiguration:
          name: alertmanager # alertmanagerconfig.yaml
        externalUrl: https://alertmanager.hnimn.art
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: truenas-nfs
              resources:
                requests:
                  storage: 1Gi

    # Rules + alerting in-cluster; TrueNAS runs promeo only. Prometheus below is
    # agent (no TSDB, no rule engine) → Thanos Ruler evaluates every
    # PrometheusRule against promeo's query API, remote-writes recording rules
    # back (mixin dashboards need `:sum_rate` series), alerts → Alertmanager
    # above. remoteWrite set → stateless, no local TSDB.
    thanosRuler:
      enabled: true
      thanosRulerSpec:
        ruleSelectorNilUsesHelmValues: false
        evaluationInterval: 1m
        # skip seconds promeo hasn't received yet (remote_write lag)
        ruleQueryOffset: 1m
        alertQueryUrl: https://promeo.hnimn.art
        alertmanagersUrl:
          - http://alertmanager-operated.observability.svc.cluster.local:9093
        # --query = http only; https needs query config file → secret.yaml
        queryConfig:
          existingSecret:
            name: thanos-ruler-query-config
            key: query-configs.yaml
        remoteWrite:
          - url: https://promeo.hnimn.art/api/v1/write
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
    defaultRules:
      disabled:
        # Agent-mode Prometheus never talks to Alertmanager (Thanos Ruler does),
        # so this fires permanently.
        PrometheusNotConnectedToAlertmanagers: true
    kubelet:
      serviceMonitor:
        # cAdvisor refreshes stats every 10-15s but is scraped every 10s, so about a
        # third of scrapes resend the previous timestamp. Agent-mode Prometheus
        # rejects t <= last t as out-of-order (a server would accept the repeat):
        # ~700 samples/s, PrometheusOutOfOrderTimestamps on every node. The dropped
        # samples are exact repeats (no data loss), but the alert never clears.
        # Scrape-time timestamps instead. Both keys: the chart forces
        # honorTimestamps=true on cAdvisor while trackTimestampsStaleness is on
        # (helm-charts#5483).
        honorTimestamps: false
        trackTimestampsStaleness: false
        # With scrape-time stamps, a 10s scrape mostly stores repeats (cAdvisor
        # refreshes every 10-20s, 15-30s idle); 30s = upstream kube-prometheus.
        cAdvisorInterval: 30s
    kubeEtcd:
      enabled: true
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes
    kubeProxy:
      enabled: false
    prometheus:
      # Agent: scrape + remote_write only. No TSDB, rules, query API. Store =
      # promeo (Prometheus on TrueNAS, 6w); Grafana, Kargo, Thanos Ruler query
      # it. Nothing node-pinned here; dead node costs in-flight WAL at most.
      agentMode: true
      route:
        main:
          enabled: true
          labels:
            forward-auth: authentik
          annotations:
            gatus.home-operations.com/enabled: "false" # gated by authentik forward-auth
          hostnames:
            - prometheus.hnimn.art
          parentRefs:
            - name: envoy-internal
              namespace: network
      prometheusSpec:
        externalUrl: https://prometheus.hnimn.art
        securityContext:
          runAsNonRoot: true
          runAsUser: 64535
          runAsGroup: 64535
          fsGroup: 64535
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        # promeo sized for full set (~300k series, 12k samples/s; homelab-platform
        # docs/observability/promeo-sizing.md). Queue raised: default max 50
        # shards, filtered set already wanted 112. Watch shards_desired,
        # samples_dropped_total.
        remoteWrite:
          - url: https://promeo.hnimn.art/api/v1/write
            queueConfig:
              maxShards: 200
              maxSamplesPerSend: 2000
              capacity: 20000
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2000Mi

    nodeExporter:
      # no AIX/macOS nodes: drops their dashboards
      operatingSystems:
        aix:
          enabled: false
        darwin:
          enabled: false

    prometheus-node-exporter:
      fullnameOverride: node-exporter
      resources:
        requests:
          cpu: 10m
          memory: 32Mi

    prometheusOperator:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
      # the config-reloader sidecar injected into prometheus/alertmanager pods
      # — without this those pods fail require-resource-requests (main
      # containers have requests via {prometheus,alertmanager}Spec.resources)
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi

    # Flux resource-state metrics come from flux-operator (flux_resource_info)
    # — the customResourceState recipe from flux2-monitoring-example is gone.
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      resources:
        requests:
          cpu: 10m
          memory: 64Mi

    grafana:
      enabled: false
      forceDeployDashboards: true
      operator:
        dashboardsConfigMapRefEnabled: true
        folder: null
        folderUID: kubernetes # GrafanaFolder in observability/grafana/instance
        matchLabels:
          grafana.internal/instance: grafana
  # Multi-cluster board has no chart toggle; single cluster, so drop it.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: GrafanaDashboard
              name: kube-prometheus-stack-k8s-resources-multicluster
            patch: |-
              $patch: delete
              apiVersion: grafana.integreatly.org/v1beta1
              kind: GrafanaDashboard
              metadata:
                name: kube-prometheus-stack-k8s-resources-multicluster
