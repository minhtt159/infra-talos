apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    # ref: https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
    cleanPrometheusOperatorObjectNames: true
    crds:
      upgradeJob:
        enabled: true
        forceConflicts: true
    # No in-cluster alerting: promeo (Prometheus on TrueNAS) is the only TSDB now,
    # so rule evaluation + Alertmanager belong next to it, not here.
    alertmanager:
      enabled: false
    defaultRules:
      create: false
    kubeEtcd:
      enabled: true
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes
    kubeProxy:
      enabled: false
    prometheus:
      # Agent mode: scrape + remote_write only. No TSDB, no rules, no query API —
      # promeo (Prometheus on TrueNAS, 6w retention) is the store; Grafana and
      # Kargo query it directly. Nothing node-pinned left in this stack, so a
      # dead node costs at most the in-flight WAL.
      agentMode: true
      route:
        main:
          enabled: true
          hostnames:
            - prometheus.${SECRET_DOMAIN}
          parentRefs:
            - name: envoy-internal
              namespace: network
      prometheusSpec:
        externalUrl: https://prometheus.${SECRET_DOMAIN}
        securityContext:
          runAsNonRoot: true
          runAsUser: 64535
          runAsGroup: 64535
          fsGroup: 64535
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        # promeo needs --web.enable-remote-write-receiver. It ingests slowly —
        # the full series set overran it (339 desired shards vs max 50), hence
        # the drops. Still >50 after this = promeo is under-resourced, don't
        # raise maxShards.
        remoteWrite:
          - url: https://promeo.${SECRET_DOMAIN}/api/v1/write
            writeRelabelConfigs:
              # biggest volume driver; _sum/_count kept
              - sourceLabels: [__name__]
                regex: ".+_bucket"
                action: drop
              - sourceLabels: [__name__]
                regex: "go_.*|process_.*"
                action: drop
              # cAdvisor churn from short-lived pods; cpu/mem kept
              - sourceLabels: [__name__]
                regex: "container_(network|fs|tasks_state|memory_failures|spec)_.*"
                action: drop
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2000Mi

    prometheus-node-exporter:
      fullnameOverride: node-exporter
      resources:
        requests:
          cpu: 10m
          memory: 32Mi

    prometheusOperator:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
      # the config-reloader sidecar injected into prometheus/alertmanager pods
      # — without this those pods fail require-resource-requests (main
      # containers have requests via {prometheus,alertmanager}Spec.resources)
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi

    # Flux resource-state metrics come from flux-operator (flux_resource_info)
    # — the customResourceState recipe from flux2-monitoring-example is gone.
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      resources:
        requests:
          cpu: 10m
          memory: 64Mi

    grafana:
      enabled: false
      forceDeployDashboards: true
      operator:
        dashboardsConfigMapRefEnabled: true
        folder: observability
        matchLabels:
          grafana.internal/instance: grafana
