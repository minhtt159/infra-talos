apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    # ref: https://github.com/prometheus-community/helm-charts/blob/main/charts/kube-prometheus-stack/values.yaml
    cleanPrometheusOperatorObjectNames: true
    crds:
      upgradeJob:
        enabled: true
        forceConflicts: true
    alertmanager:
      route:
        main:
          enabled: true
          hostnames:
            - alertmanager.${SECRET_DOMAIN}
          parentRefs:
            - name: envoy-internal
              namespace: network
      alertmanagerSpec:
        # alertmanagerConfiguration:
        #   name: alertmanager
        externalUrl: https://alertmanager.${SECRET_DOMAIN}
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: truenas-nfs
              resources:
                requests:
                  storage: 1Gi
    kubeEtcd:
      enabled: true
      service:
        selector:
          component: kube-apiserver # etcd runs on control plane nodes
    kubeProxy:
      enabled: false
    prometheus:
      route:
        main:
          enabled: true
          hostnames:
            - prometheus.${SECRET_DOMAIN}
          parentRefs:
            - name: envoy-internal
              namespace: network
      prometheusSpec:
        externalUrl: https://prometheus.${SECRET_DOMAIN}
        # prompp rebuilds its in-memory index at startup; ~22GB of TSDB on
        # truenas-iscsi reads back at single-digit MB/s, so the operator's
        # 15m default startup probe budget kills the pod mid-replay and it
        # never finishes. 1h is slack over the observed ~40m.
        maximumStartupDurationSeconds: 3600
        version: v2.55.1 # override 'unsupported Prometheus version' error
        image:
          registry: ghcr.io
          repository: deckhouse/prompp
          tag: 0.8.7
        securityContext:
          runAsNonRoot: true
          runAsUser: 64535
          runAsGroup: 64535
          fsGroup: 64535
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        retention: 14d
        retentionSize: 50GB
        # Mirror metrics to the TrueNAS shadow prometheus (long-term FALLBACK
        # archive; cluster gets rebuilt, promeo doesn't). promeo must run with
        # --web.enable-remote-write-receiver. Native remote_write — no mirror
        # agent needed; future VictoriaMetrics = same protocol, different URL.
        #
        # promeo is a plain-Prometheus receiver (slow ingest) — shipping the full
        # series set overran it (desired 339 shards vs max 50 ->
        # PrometheusRemoteWriteDesiredShards). In-cluster Prometheus stays
        # Grafana's primary at full fidelity; only trend-worthy series go to the
        # archive. Drops target the big-volume / low-archive-value offenders;
        # relax a regex if you need a specific series long-term. If desired
        # shards is still >50 after this, promeo itself is under-resourced on
        # TrueNAS (give it more CPU/disk) — don't just raise maxShards.
        remoteWrite:
          - url: https://promeo.${SECRET_DOMAIN}/api/v1/write
            writeRelabelConfigs:
              # histogram buckets — single biggest volume driver; _sum/_count kept
              - sourceLabels: [__name__]
                regex: ".+_bucket"
                action: drop
              # per-target Go runtime + process internals — noise for an archive
              - sourceLabels: [__name__]
                regex: "go_.*|process_.*"
                action: drop
              # cAdvisor per-container churn from short-lived pods; cpu/mem
              # working-set kept for capacity trends (not matched here)
              - sourceLabels: [__name__]
                regex: "container_(network|fs|tasks_state|memory_failures|spec)_.*"
                action: drop
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2000Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: truenas-iscsi
              resources:
                requests:
                  storage: 50Gi

    prometheus-node-exporter:
      fullnameOverride: node-exporter
      resources:
        requests:
          cpu: 10m
          memory: 32Mi

    prometheusOperator:
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
      # the config-reloader sidecar injected into prometheus/alertmanager pods
      # — without this those pods fail require-resource-requests (main
      # containers have requests via {prometheus,alertmanager}Spec.resources)
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi

    # Flux resource-state metrics come from flux-operator (flux_resource_info)
    # — the customResourceState recipe from flux2-monitoring-example is gone.
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      resources:
        requests:
          cpu: 10m
          memory: 64Mi

    grafana:
      enabled: false
      forceDeployDashboards: true
      operator:
        dashboardsConfigMapRefEnabled: true
        folder: observability
        matchLabels:
          grafana.internal/instance: grafana
