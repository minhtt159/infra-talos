---
# Thanos Ruler query endpoints (`--query.config`). Not sensitive — a Secret only
# because that's the type the ThanosRuler CRD takes.
apiVersion: v1
kind: Secret
metadata:
  name: thanos-ruler-query-config
stringData:
  query-configs.yaml: |
    - scheme: https
      static_configs:
        - promeo.${SECRET_DOMAIN}
