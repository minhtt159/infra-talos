---
# Mirrors research/browserless-token (an ESO Password generator, so it exists
# only in-cluster) into this namespace, so gatus can authenticate its
# /pressure probe. RBAC for the gatus SA lives with the source secret, in
# kubernetes/apps/research/browserless/app/externalsecret.yaml.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: browserless-token
spec:
  provider:
    kubernetes:
      remoteNamespace: research
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: gatus
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: browserless-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: browserless-token
  target:
    name: browserless-token
    creationPolicy: Owner
  data:
    # envFrom'd into the gatus container; gatus expands the var itself
    # (os.ExpandEnv over every file in /config, sidecar-generated one included)
    - secretKey: BROWSERLESS_TOKEN
      remoteRef:
        key: browserless-token
        property: TOKEN
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login # login item — username/password under $.data.login
  target:
    name: gatus-db
    creationPolicy: Owner
    template:
      # Assemble the DSN here so the password never lands in git. Shared
      # TrueNAS Postgres, not in-cluster CNPG; envFrom'd, gatus expands it.
      data:
        GATUS_POSTGRES_DSN: "postgres://{{ .username }}:{{ .password | urlquery }}@postgres.${SECRET_DOMAIN}:5432/gatus?sslmode=disable"
  data:
    - secretKey: username
      remoteRef:
        key: d3bd93b1-3d74-43a3-8969-bc4673c002ec # vaultwarden: gatus-creds
        property: username
    - secretKey: password
      remoteRef:
        key: d3bd93b1-3d74-43a3-8969-bc4673c002ec # vaultwarden: gatus-creds
        property: password
