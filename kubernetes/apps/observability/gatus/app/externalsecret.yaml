---
# Mirrors research/browserless-token (an ESO Password generator, so it exists
# only in-cluster) into this namespace, so gatus can authenticate its
# /pressure probe. RBAC for the gatus SA lives with the source secret, in
# kubernetes/apps/research/browserless/app/externalsecret.yaml.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: browserless-token
spec:
  provider:
    kubernetes:
      remoteNamespace: research
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: gatus
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: browserless-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: browserless-token
  target:
    name: browserless-token
    creationPolicy: Owner
  data:
    # envFrom'd into the gatus container; gatus expands the var itself
    # (os.ExpandEnv over every file in /config, sidecar-generated one included)
    - secretKey: BROWSERLESS_TOKEN
      remoteRef:
        key: browserless-token
        property: TOKEN
