---
# Mirrors research/browserless-token (an ESO Password generator, so it exists
# only in-cluster) into this namespace, so gatus can authenticate its
# /pressure probe. RBAC for the gatus SA lives with the source secret, in
# kubernetes/apps/research/browserless/app/externalsecret.yaml.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: browserless-token
spec:
  provider:
    kubernetes:
      remoteNamespace: research
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: gatus
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: browserless-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: browserless-token
  target:
    name: browserless-token
    creationPolicy: Owner
  data:
    # envFrom'd into the gatus container; gatus expands the var itself
    # (os.ExpandEnv over every file in /config, sidecar-generated one included)
    - secretKey: BROWSERLESS_TOKEN
      remoteRef:
        key: browserless-token
        property: TOKEN
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login # login item — username/password under $.data.login
  target:
    name: gatus-db
    creationPolicy: Owner
    template:
      # Assemble the DSN here so the password never lands in git. Shared
      # TrueNAS Postgres, not in-cluster CNPG; envFrom'd, gatus expands it.
      data:
        GATUS_POSTGRES_DSN: "postgres://{{ .username }}:{{ .password | urlquery }}@postgres.hnimn.art:5432/gatus?sslmode=disable"
  data:
    - secretKey: username
      remoteRef:
        key: d3bd93b1-3d74-43a3-8969-bc4673c002ec # vaultwarden: gatus-creds
        property: username
    - secretKey: password
      remoteRef:
        key: d3bd93b1-3d74-43a3-8969-bc4673c002ec # vaultwarden: gatus-creds
        property: password
---
# Discord #homelab-alerts webhook (Gatus + Alertmanager) and the Cloudflare
# service token gatus-access (Gatus internet view). Read by gatus envFrom and by
# kube-prometheus-stack's AlertmanagerConfig (same namespace).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homelab-alerts
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: homelab-alerts
    creationPolicy: Owner
  data:
    - secretKey: DISCORD_WEBHOOK_URL
      remoteRef:
        key: fc26772a-b32c-4a9e-842e-a841da40f146 # vaultwarden: Homelab-alerts Discord
        property: Webhook URL
    - secretKey: GATUS_CF_ACCESS_CLIENT_ID
      remoteRef:
        key: 848630c4-8178-4b32-80e8-979241670fd8 # vaultwarden: Cloudflare Gatus Service Account
        property: CF-Access-Client-Id
    - secretKey: GATUS_CF_ACCESS_CLIENT_SECRET
      remoteRef:
        key: 848630c4-8178-4b32-80e8-979241670fd8
        property: CF-Access-Client-Secret
