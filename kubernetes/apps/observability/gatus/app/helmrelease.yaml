---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
spec:
  chartRef:
    kind: OCIRepository
    name: gatus
  interval: 1h
  # the chart only exposes pod-level resources (K8s 1.34 PodLevelResources);
  # kyverno wants per-container requests, which no chart value reaches
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: gatus
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: gatus
              spec:
                template:
                  spec:
                    containers:
                      - name: gatus
                        resources:
                          requests:
                            cpu: 10m
                            memory: 64Mi
                          limits:
                            memory: 192Mi
                    initContainers:
                      - name: gatus-sidecar
                        resources:
                          requests:
                            cpu: 5m
                            memory: 32Mi
                          limits:
                            memory: 64Mi
  values:
    fullnameOverride: gatus
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    gatus:
      # the sidecar writes gatus-sidecar.yaml in the same second gatus loads
      # /config; gatus's reload check has 1s mtime granularity, so it never
      # picks the file up — and with postgres storage it prunes the missing
      # endpoints' history on startup. Give the sidecar a head start.
      delayStartSeconds: "5"
      envFrom:
        # BROWSERLESS_TOKEN — the browserless HTTPRoute's gatus annotation
        # references it; gatus expands it when it loads /config
        - secretRef:
            name: browserless-token
        # GATUS_POSTGRES_DSN — storage backend, see externalsecret.yaml
        - secretRef:
            name: gatus-db
    sidecar:
      # Skip knative-internal: net-gateway-api strips annotations from the
      # routes it generates, so the per-route opt-out can't reach them, and a
      # 1m probe would keep every function warm — scale-to-zero never happens.
      gatewayNames:
        - envoy-internal
        - envoy-external
      kinds:
        httproute:
          enable: true
          auto: true
        service:
          enable: true
    config:
      existingConfigMap: gatus-configmap
      items:
        - key: config.yaml
          path: config.yaml
    httpRoute:
      enabled: true
      annotations:
        # don't let the sidecar generate an endpoint for gatus itself
        gatus.home-operations.com/enabled: "false"
      hostnames:
        - status.${SECRET_DOMAIN}
      parentRefs:
        - name: envoy-internal
          namespace: network
    monitoring:
      serviceMonitor:
        enabled: true
