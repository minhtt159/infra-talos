---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gatus
spec:
  chartRef:
    kind: OCIRepository
    name: gatus
  interval: 1h
  # the chart only exposes pod-level resources (K8s 1.34 PodLevelResources);
  # kyverno wants per-container requests, which no chart value reaches
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: gatus
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: gatus
              spec:
                template:
                  spec:
                    containers:
                      - name: gatus
                        resources:
                          requests:
                            cpu: 10m
                            memory: 64Mi
                          limits:
                            memory: 192Mi
                    initContainers:
                      - name: gatus-sidecar
                        resources:
                          requests:
                            cpu: 5m
                            memory: 32Mi
                          limits:
                            memory: 64Mi
  values:
    fullnameOverride: gatus
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    sidecar:
      kinds:
        httproute:
          enable: true
          auto: true
        service:
          enable: true
    config:
      existingConfigMap: gatus-configmap
      items:
        - key: config.yaml
          path: config.yaml
    httpRoute:
      enabled: true
      annotations:
        # don't let the sidecar generate an endpoint for gatus itself
        gatus.home-operations.com/enabled: "false"
      hostnames:
        - status.${SECRET_DOMAIN}
      parentRefs:
        - name: envoy-internal
          namespace: network
    monitoring:
      serviceMonitor:
        enabled: true
