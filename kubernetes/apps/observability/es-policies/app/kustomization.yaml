---
# Content hash on the generated ConfigMaps flows into the Job's volume refs —
# a change to any policy or the script makes Flux (force:true) recreate the
# Job and re-run the replay. No change -> no re-run.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./apply-policies-job.yaml
  - ./externalsecret.yaml

configMapGenerator:
  - name: es-apply-scripts
    files:
      - apply_es_policies.py
  - name: es-apply-policies
    files:
      - policies/index-and-ilm-logs-envoy.txt
      - policies/index-and-ilm-logs-kubernetes.txt

generatorOptions:
  disableNameSuffixHash: false # keep the hash: it is the re-run trigger
