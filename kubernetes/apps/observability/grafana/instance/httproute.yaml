---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  hostnames:
    - "grafana.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: grafana-service
          port: 3000
---
# Public half, behind Cloudflare Access (Entra SSO). Same split-horizon shape as
# bank0-portal: cloudflare-dns publishes this route to the tunnel, the label keeps
# unifi-dns answering the LAN with envoy-internal (route above, anonymous).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-external
  labels:
    dns.hnimn.art/lan: "false" # LAN resolves this name to envoy-internal (unifi-dns label filter)
spec:
  hostnames:
    - "grafana.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: grafana-service
          port: 3000
