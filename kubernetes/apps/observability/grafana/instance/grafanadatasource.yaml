---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadatasource_v1beta1.json
# Named `prometheus` so the ~50 dashboards that bind DS_PROMETHEUS to it keep
# working; the URL is promeo (Prometheus on TrueNAS) — the in-cluster
# Prometheus is an agent with no query API.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
spec:
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasource:
    type: prometheus
    name: prometheus
    access: proxy
    isDefault: true
    url: https://promeo.${SECRET_DOMAIN}
