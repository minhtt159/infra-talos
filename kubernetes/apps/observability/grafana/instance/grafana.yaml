---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafana_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    grafana.internal/instance: grafana
spec:
  config:
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      feedback_links_enabled: "false"
      reporting_enabled: "false"
    auth:
      disable_login_form: "false"
    # LAN (envoy-internal) stays anonymous Viewer. The tunnel path is gated by
    # Envoy (securitypolicy.yaml); this only turns the Access JWT Envoy already
    # verified into a Grafana user. Requests without the header fall through to
    # anonymous, which is why the Envoy policy - not this block - is the gate.
    auth.anonymous:
      enabled: "true"
    auth.jwt:
      enabled: "true"
      header_name: Cf-Access-Jwt-Assertion
      email_claim: email
      username_claim: email
      jwk_set_url: https://${SECRET_CF_ACCESS_TEAM}.cloudflareaccess.com/cdn-cgi/access/certs
      cache_ttl: 60m
      expect_claims: '{"iss": "https://${SECRET_CF_ACCESS_TEAM}.cloudflareaccess.com", "aud": ["${SECRET_OBSERVABILITY_ACCESS_AUD}"]}'
      auto_sign_up: "true"
      # ponytail: Access policy admits only the owner, so every JWT user is Admin.
      # Map from a groups claim if the policy ever admits anyone else.
      role_attribute_path: "'Admin'"
    log:
      mode: console
    metrics:
      enabled: "true"
    news:
      news_feed_enabled: "false"
    plugins:
      plugin_admin_enabled: "false"
    security:
      angular_support_enabled: "true"
    server:
      enable_gzip: "true"
      root_url: https://grafana.${SECRET_DOMAIN}
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          containers:
            - name: grafana
              env:
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-password-secret
                      key: GF_SECURITY_ADMIN_PASSWORD
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
                seccompProfile:
                  type: "RuntimeDefault"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          # sqlite ~6M + plugins ~50M; dashboards/datasources = CRs
          storage: 2Gi
      # TrueNAS block: survives node rotation, Retain.
      storageClassName: truenas-iscsi
  disableDefaultSecurityContext: All
