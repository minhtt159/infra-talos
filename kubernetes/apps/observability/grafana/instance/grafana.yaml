---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafana_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  labels:
    grafana.internal/instance: grafana
spec:
  config:
    analytics:
      check_for_updates: "false"
      check_for_plugin_updates: "false"
      feedback_links_enabled: "false"
      reporting_enabled: "false"
    auth:
      disable_login_form: "false"
    # authentik OIDC is the gate on both gateways (LAN bypasses CF Access).
    # Login form stays on: the local admin is the break-glass when authentik is down.
    auth.generic_oauth:
      enabled: "true"
      name: authentik
      scopes: openid profile email
      auth_url: https://auth.${SECRET_DOMAIN}/application/o/authorize/
      token_url: https://auth.${SECRET_DOMAIN}/application/o/token/
      api_url: https://auth.${SECRET_DOMAIN}/application/o/userinfo/
      signout_redirect_url: https://auth.${SECRET_DOMAIN}/application/o/grafana/end-session/
      use_pkce: "true"
      use_refresh_token: "true"
      login_attribute_path: preferred_username
      # ponytail: one homelab-wide admin group, everyone else Viewer. Per-app groups when a second user shows up.
      role_attribute_path: contains(groups, 'homelab-admins') && 'Admin' || 'Viewer'
    log:
      mode: console
    metrics:
      enabled: "true"
    news:
      news_feed_enabled: "false"
    plugins:
      plugin_admin_enabled: "false"
    security:
      angular_support_enabled: "true"
    server:
      enable_gzip: "true"
      root_url: https://grafana.${SECRET_DOMAIN}
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          containers:
            - name: grafana
              envFrom:
                # GF_AUTH_GENERIC_OAUTH_CLIENT_ID / _CLIENT_SECRET
                - secretRef:
                    name: grafana-oidc-secret
              env:
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin-password-secret
                      key: GF_SECURITY_ADMIN_PASSWORD
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
                seccompProfile:
                  type: "RuntimeDefault"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          # sqlite ~6M + plugins ~50M; dashboards/datasources = CRs
          storage: 2Gi
      # TrueNAS block: survives node rotation, Retain.
      storageClassName: truenas-iscsi
  disableDefaultSecurityContext: All
