---
# Node-local hostpath on mini-talos-01's SATA SSD (Talos UserVolumeConfig
# `sata` → /var/mnt/sata, defined in the private Omni cluster template).
# ponytail: only mini-talos-01 has this mount — consumers must pin to that
# node (WaitForFirstConsumer defers binding until the pod is scheduled).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-hostpath-sata
  annotations:
    openebs.io/cas-type: local
    cas.openebs.io/config: |
      - name: StorageType
        value: hostpath
      - name: BasePath
        value: /var/mnt/sata
provisioner: openebs.io/local
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
