---
# LAN VIP from the cilium `bgp` pool (10.1.81.0/24, advertised to the UDM-SE);
# external-dns (unifi webhook, `service` source) publishes the hostname.
apiVersion: v1
kind: Service
metadata:
  name: &name mosquitto
  labels:
    announce: bgp
  annotations:
    external-dns.alpha.kubernetes.io/hostname: mqtt.${SECRET_DOMAIN}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local # keep client IPs in the broker log
  selector:
    app: *name
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
