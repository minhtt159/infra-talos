---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mosquitto-passwd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: mosquitto-passwd
    creationPolicy: Owner
    template:
      data:
        # mosquitto_passwd file: one "user:$7$..." line per client, already hashed in the vault
        passwd: |
          {{ .frigate }}
          {{ .homeassistant }}
  data:
    - secretKey: frigate
      remoteRef:
        key: 7f3eceb6-c96a-45ad-ae7b-019e333e5b74 # vaultwarden: homelab-talos/mosquitto
        property: frigate
    - secretKey: homeassistant
      remoteRef:
        key: 7f3eceb6-c96a-45ad-ae7b-019e333e5b74
        property: homeassistant
