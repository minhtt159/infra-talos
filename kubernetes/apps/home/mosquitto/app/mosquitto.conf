# Plain MQTT on the LAN only (LoadBalancer VIP, no tunnel). Add an 8883 listener
# with a cert-manager cert if a client ever leaves the LAN.
listener 1883
allow_anonymous false
password_file /mosquitto/passwd/passwd

persistence true
persistence_location /mosquitto/data/
autosave_interval 300

log_dest stdout
log_type error
log_type warning
log_type notice
