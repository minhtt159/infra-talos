---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Platform half of bank0/staging: namespace, DB credentials, JWT key, routing.
# The workload itself is Argo CD's (argocd/apps/bank0-staging.yaml) — Flux owns
# nothing inside the Helm release, Argo CD owns nothing outside it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bank0-platform
spec:
  dependsOn:
    - name: postgres # the roles + databases the DSN points at
      namespace: database
  interval: 1h
  path: ./kubernetes/apps/bank0-staging/bank0/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: bank0-staging
  # false: HTTPRoutes stay unresolved until Argo CD creates the Services.
  wait: false
