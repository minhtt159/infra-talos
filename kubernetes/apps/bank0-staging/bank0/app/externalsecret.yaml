---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# DSN the chart reads via database.existingSecret. Same Vaultwarden item as the
# CNPG managed role — one source, or the two drift and the app can't log in.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bank0-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: bank0-db
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # postgres-rw is CNPG's primary service. sslmode=require: CNPG serves
        # TLS, but the cert is its own CA, so don't ask the client to verify it.
        dsn: "postgres://{{ .username }}:{{ .password }}@postgres-rw.database.svc.cluster.local:5432/bank0_staging?sslmode=require"
  data:
    - secretKey: username
      remoteRef:
        key: 00000000-0000-0000-0000-000000000000 # TODO vaultwarden: bank0-staging-db
        property: username
    - secretKey: password
      remoteRef:
        key: 00000000-0000-0000-0000-000000000000
        property: password
---
# JWT signing key: random, never read by a human, must be identical across api
# replicas — generate it in-cluster and leave it alone.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: bank0-jwt
spec:
  length: 48
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bank0-auth
spec:
  refreshInterval: "0" # rotate this and every live session dies
  target:
    name: bank0-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        jwt-secret: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: bank0-jwt
