---
# Chart's own HTTPRoutes want a chart-created Gateway (sectionName
# https-api/https-portal). Switched off (api/portal.exposed: false); routing
# lives here, on shared envoy-internal like every other app. Staging is LAN-only — no external gateway, no public DNS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-api
  annotations:
    # /readyz not /health. /health is DB-blind by design (DB blip must not kill
    # pods) so it can't signal what matters. /readyz pings Postgres, 1s deadline.
    gatus.home-operations.com/endpoint: |
      group: bank0-staging
      path: /readyz
      conditions:
        - "[STATUS] == 200"
spec:
  hostnames:
    - "api.staging.bank0.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: bank0-api
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-portal
  annotations:
    # Portal answers 401 unauthenticated — that IS the healthy signal.
    gatus.home-operations.com/endpoint: |
      group: bank0-staging
      conditions:
        - "[STATUS] == 401"
spec:
  hostnames:
    - "portal.staging.bank0.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: bank0-portal
          port: 80
---
# /metrics (Go internals, DB pool state, per-route traffic) hidden from the
# LAN, like production. Prometheus scrapes the pods direct; Gatus probes
# /readyz and /, which stay open. Exact match wins over the catch-alls above.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: bank0-not-found
spec:
  directResponse:
    statusCode: 404
    contentType: application/json
    body:
      type: Inline
      inline: '{"error":"not_found"}'
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-internal-paths
  annotations:
    gatus.home-operations.com/enabled: "false" # see bank0-api / bank0-portal for the probes
spec:
  hostnames:
    - "api.staging.bank0.${SECRET_DOMAIN}"
    - "portal.staging.bank0.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path: { type: Exact, value: /metrics }
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: bank0-not-found
