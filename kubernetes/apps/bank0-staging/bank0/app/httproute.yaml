---
# The chart's own HTTPRoutes want a chart-created Gateway (sectionName
# https-api/https-portal), so they're switched off (api/portal.exposed: false)
# and routing lives here, on the shared envoy-internal gateway like every other
# app in this cluster. Staging is LAN-only — no external gateway, no public DNS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-api
  annotations:
    gatus.home-operations.com/endpoint: |
      path: /healthz
      conditions:
        - "[STATUS] == 200"
spec:
  hostnames:
    - "api.staging.bank0.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: bank0-api
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bank0-portal
spec:
  hostnames:
    - "portal.staging.bank0.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: bank0-portal
          port: 80
