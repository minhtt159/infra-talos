---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Read-only Garage key for the homelab-docs bucket (the private docs repo's CI
# holds the separate write key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: docs-garage-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: docs-garage-s3
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: REPLACE-WITH-VAULTWARDEN-UUID # vaultwarden: docs-garage-s3-reader
        property: access_key_id
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: REPLACE-WITH-VAULTWARDEN-UUID
        property: secret_access_key
