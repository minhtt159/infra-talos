---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./service.yaml
configMapGenerator:
  - name: docs-dir-template
    files:
      - ./resources/dir-template.html
generatorOptions:
  disableNameSuffixHash: true # referenced from the ksvc, which kustomize does not rewrite
