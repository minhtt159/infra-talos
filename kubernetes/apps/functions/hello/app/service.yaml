---
# Smoke function + cold-start canary: hello-functions.fn.<domain>.
# Proves route Accepted -> ksvc Ready -> DNS -> TLS -> scale to zero.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hello
spec:
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: hello
          image: docker.io/traefik/whoami:v1.12.0
          args: ["--port", "8080"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
