---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unifi-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: unifi-dns-secret
    creationPolicy: Owner
  data:
    - secretKey: api-key # key the HelmRelease references
      remoteRef:
        key: 756109c8-70d1-46bb-ac78-2bd596694b94 # vaultwarden: homelab-talos/unifi-dns
        property: api-token # field name on the item
