---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app unifi-dns
spec:
  chartRef:
    kind: OCIRepository
    name: unifi-dns
  interval: 1h
  values:
    fullnameOverride: *app
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/kashalls/external-dns-unifi-webhook
          tag: v0.9.0@sha256:22f4106f44a0b9ac3c97cf29bbfef93026c1164492152dc797a1d6dc86ddfbb5
        # PodSecurity "restricted" on the network namespace
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        env:
          - name: UNIFI_HOST
            value: https://10.1.80.1
          - name: UNIFI_API_KEY
            valueFrom:
              secretKeyRef:
                name: &secret unifi-dns-secret
                key: api-key
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
    triggerLoopOnEvent: true
    policy: sync
    # A hostname on BOTH gateways (bank0-portal, hindsight) is two CNAME
    # candidates for one LAN name; external-dns warns "Only one CNAME per name"
    # and keeps whichever it iterated first - the LAN answer flips between
    # envoy-internal and envoy-external. Routes that must not be the LAN answer
    # carry `dns.hnimn.art/lan: "false"`; `!=` also matches objects without the
    # label, so everything else is unaffected. cloudflare-dns does not read
    # this label, it filters on --gateway-name=envoy-external instead.
    extraArgs:
      - --label-filter=dns.hnimn.art/lan!=false
    sources:
      - gateway-httproute
      - service
    txtOwnerId: main
    txtPrefix: k8s.main.
    domainFilters:
      - ${SECRET_DOMAIN}
    serviceMonitor:
      enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
    # reloader reads Deployment-level annotations, not pod-template ones
    deploymentAnnotations:
      secret.reloader.stakater.com/reload: *secret
