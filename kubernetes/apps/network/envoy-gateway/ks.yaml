---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy
spec:
  path: ./kubernetes/apps/network/envoy-gateway/app
  targetNamespace: network
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
spec:
  # GatewayClass/EnvoyProxy/policies need the controller + its CRDs from the
  # app HelmRelease first — on a fresh bootstrap this ks hard-fails until the
  # app one reconciles.
  dependsOn:
    - name: envoy
  path: ./kubernetes/apps/network/envoy-gateway/gateway
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  targetNamespace: network
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-dashboard
spec:
  path: ./kubernetes/apps/network/envoy-gateway/dashboard
  targetNamespace: network
