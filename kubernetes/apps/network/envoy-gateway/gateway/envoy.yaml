---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/envoyproxy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy
spec:
  logging:
    level:
      default: info # info for debugging
  provider:
    type: Kubernetes
    kubernetes:
      # node drains may never take both replicas at once (ported from talos-aws)
      envoyPDB:
        minAvailable: 1
      envoyDeployment:
        replicas: 2
        pod:
          # securityContext:
          #   runAsNonRoot: true
          #   runAsUser: 65534
          #   runAsGroup: 65534
          #   fsGroup: 65534
          #   seccompProfile:
          #     type: RuntimeDefault
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: envoy
        container:
          imageRepository: mirror.gcr.io/envoyproxy/envoy
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # cpu: 1000m
              memory: 1Gi
          # securityContext:
          #   allowPrivilegeEscalation: false
          #   readOnlyRootFilesystem: true
          #   capabilities:
          #     drop:
          #       - ALL
      envoyService:
        externalTrafficPolicy: Local # Preserve ClientIP
  shutdown:
    drainTimeout: 180s
  telemetry:
    # No access logs on the shared/internal template — the external gateway
    # has its own EnvoyProxy (envoyproxy-external.yaml) with ECS JSON logs.
    metrics:
      prometheus:
        compression:
          type: Zstd
