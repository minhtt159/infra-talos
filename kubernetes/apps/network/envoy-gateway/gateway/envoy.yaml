---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/envoyproxy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy
spec:
  logging:
    level:
      default: info # info for debugging
  provider:
    type: Kubernetes
    kubernetes:
      # node drains may never take both replicas at once (ported from talos-aws)
      envoyPDB:
        minAvailable: 1
      envoyDeployment:
        replicas: 2
        pod:
          # securityContext:
          #   runAsNonRoot: true
          #   runAsUser: 65534
          #   runAsGroup: 65534
          #   fsGroup: 65534
          #   seccompProfile:
          #     type: RuntimeDefault
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: envoy
        container:
          imageRepository: mirror.gcr.io/envoyproxy/envoy
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # cpu: 1000m
              memory: 1Gi
          # securityContext:
          #   allowPrivilegeEscalation: false
          #   readOnlyRootFilesystem: true
          #   capabilities:
          #     drop:
          #       - ALL
      envoyService:
        externalTrafficPolicy: Local # Preserve ClientIP
  shutdown:
    drainTimeout: 180s
  telemetry:
    # JSON access logs to stdout, one object per request (ported from
    # talos-aws). Backend-agnostic: any shipper can tail container stdout.
    # nginx-style field names; Envoy emits keys alphabetically sorted.
    # Cookie header deliberately dropped (PII).
    accessLog:
      settings:
        - format:
            type: JSON
            json:
              # timing
              time: "%START_TIME%"
              time_epoch_ms: "%START_TIME(%s%3f)%"
              request_time: "%DURATION%" # total downstream duration, ms
              upstream_response_time: "%RESPONSE_DURATION%" # empty if never reached upstream
              # client
              remote_addr: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%" # real client IP via XFF numTrustedHops
              x_forwarded_for: "%REQ(X-FORWARDED-FOR)%"
              user_agent: "%REQ(USER-AGENT)%"
              referer: "%REQ(Referer)%"
              # request
              vhost: "%REQ(:AUTHORITY)%"
              request_method: "%REQ(:METHOD)%"
              request_uri: "%REQ(:PATH)%"
              full_request: "%REQ(:METHOD)% %REQ(:PATH)% %PROTOCOL%"
              protocol: "%PROTOCOL%"
              request_id: "%REQ(X-REQUEST-ID)%" # correlate retries/upstream logs
              request_length: "%BYTES_RECEIVED%"
              # response
              status: "%RESPONSE_CODE%"
              response_code_details: "%RESPONSE_CODE_DETAILS%" # why Envoy chose this code
              response_flags: "%RESPONSE_FLAGS%" # UH/UF/RL/UAEX... key debugging field
              bytes_sent: "%BYTES_SENT%"
              # tls
              tls_version: "%DOWNSTREAM_TLS_VERSION%"
              tls_cipher: "%DOWNSTREAM_TLS_CIPHER%"
              # upstream / routing
              proxy_upstream_name: "%UPSTREAM_CLUSTER%"
              upstream_addr: "%UPSTREAM_REMOTE_ADDRESS%"
              route_name: "%ROUTE_NAME%"
          sinks:
            - type: File
              file:
                path: /dev/stdout
    metrics:
      prometheus:
        compression:
          type: Zstd
