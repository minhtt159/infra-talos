---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/envoyproxy_v1alpha1.json
# Dedicated proxy template for the EXTERNAL gateway (attached via
# Gateway.spec.infrastructure.parametersRef) — log/WAF/limit experiments
# here never roll the internal proxy.
#
# Access logs: ECS field names emitted straight from Envoy — dotted JSON
# keys land in Elasticsearch as proper ECS objects. fluent-bit parses the
# line under app.* (Merge_Log_Key), retags on event.dataset, and lifts the
# keys back to the doc root for the logs-envoy template. @timestamp is
# owned by fluent-bit's es output (CRI record time); Envoy's %START_TIME%
# ships as ECS event.start. Envoy-specific telemetry with no clean ECS
# home lives under the `envoy.*` namespace. Cookie header deliberately
# dropped (PII). Numeric operators (%DURATION%, %BYTES_*%,
# %RESPONSE_CODE%) emit as JSON numbers.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-external-proxy
spec:
  logging:
    level:
      # warn (EG default): silences coraza-wasm per-request info chatter
      # (was outvolumining access logs ~2:1). Coraza rule MATCHES log at
      # error and survive.
      default: warn
  provider:
    type: Kubernetes
    kubernetes:
      envoyPDB:
        minAvailable: 1
      envoyDeployment:
        replicas: 2
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: envoy
        container:
          imageRepository: mirror.gcr.io/envoyproxy/envoy
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      envoyService:
        externalTrafficPolicy: Local # preserve client IP
  shutdown:
    drainTimeout: 180s
  telemetry:
    accessLog:
      settings:
        - format:
            type: JSON
            json:
              # ── ECS core ────────────────────────────────────────────
              # NOT @timestamp: fluent-bit's es output injects that from the
              # CRI record time; a root @timestamp here would duplicate the
              # key after the lift filter and get the bulk request rejected.
              event.start: "%START_TIME%"
              event.dataset: envoy.access
              # client
              source.ip: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%" # real client via XFF (numTrustedHops)
              user_agent.original: "%REQ(USER-AGENT)%"
              # request
              url.domain: "%REQ(:AUTHORITY)%"
              url.path: "%REQ(:PATH)%"
              http.request.method: "%REQ(:METHOD)%"
              http.request.id: "%REQ(X-REQUEST-ID)%"
              http.request.referrer: "%REQ(Referer)%"
              http.request.bytes: "%BYTES_RECEIVED%"
              # response
              http.response.status_code: "%RESPONSE_CODE%"
              http.response.bytes: "%BYTES_SENT%"
              # upstream
              destination.address: "%UPSTREAM_REMOTE_ADDRESS%"
              tls.cipher: "%DOWNSTREAM_TLS_CIPHER%"
              # ── envoy namespace (no clean ECS equivalent) ───────────
              envoy.duration_ms: "%DURATION%" # total downstream duration
              envoy.upstream_ms: "%RESPONSE_DURATION%" # empty if upstream never reached
              envoy.protocol: "%PROTOCOL%" # HTTP/1.1, HTTP/2 — not ECS http.version shape
              envoy.response_flags: "%RESPONSE_FLAGS%" # UH/UF/RL/UAEX — key debugging field
              envoy.response_code_details: "%RESPONSE_CODE_DETAILS%"
              envoy.upstream_cluster: "%UPSTREAM_CLUSTER%"
              envoy.route_name: "%ROUTE_NAME%"
              envoy.tls_version: "%DOWNSTREAM_TLS_VERSION%" # TLSv1.3 — not ECS tls.version shape
              envoy.x_forwarded_for: "%REQ(X-FORWARDED-FOR)%" # full chain
          sinks:
            - type: File
              file:
                path: /dev/stdout
    metrics:
      prometheus:
        # Gzip not Zstd: Prometheus only sends Accept-Encoding: gzip, so a
        # zstd-only response never compresses — it negotiates to identity.
        compression:
          type: Gzip
