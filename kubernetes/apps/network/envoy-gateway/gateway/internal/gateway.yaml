---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-internal
  labels:
    dns.hnimn.art/lan: "true" # unifi-dns publishes this gateway's routes on the LAN
  annotations:
    external-dns.kubernetes.io/target: &hostname internal.hnimn.art
    # Gatus LAN view: every route here inherits this (homelab-platform
    # docs/observability/healthchecks.md). Routes add their own path/conditions.
    gatus.home-operations.com/endpoint: |
      group: lan
      alerts:
        - type: discord
spec:
  gatewayClassName: envoy-internal
  infrastructure:
    annotations:
      external-dns.kubernetes.io/hostname: *hostname
      lbipam.cilium.io/ips: "10.1.81.11" # cilium `bgp` pool; label on the Service via EnvoyProxy envoyService.labels
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: hnimn-art-production-tls
