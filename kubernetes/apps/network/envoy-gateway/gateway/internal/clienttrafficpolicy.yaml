---
# See ../external/clienttrafficpolicy.yaml — KEEP IN SYNC (everything except
# clientIPDetection + connectionLimit, which are external-only).
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/clienttrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy-internal
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
  # HSTS as a native late response header (see ../external for rationale).
  headers:
    lateResponseHeaders:
      set:
        - name: Strict-Transport-Security
          value: "max-age=31536000; includeSubDomains"
  # No proxy in front on the LAN — the connection remote address IS the real
  # client. Omit XFF trust entirely so a LAN client can't forge source.ip by
  # sending its own X-Forwarded-For.
  connection:
    bufferLimit: 8Mi
    maxAcceptPerSocketEvent: 0
  http2:
    initialStreamWindowSize: 2Mi
    initialConnectionWindowSize: 32Mi
    onInvalidMessage: TerminateStream
    maxConcurrentStreams: 100 # HTTP/2 Rapid Reset guard (CVE-2023-44487)
  http3: {}
  tcpKeepalive: {}
  timeout:
    http:
      requestReceivedTimeout: 30s
  tls:
    # 1.2 not 1.3: TLS-1.3-only broke the Hindsight MCP client (and any other
    # TLS-1.2 client) — handshake refused. 1.2 floor still allows 1.3.
    minVersion: "1.2"
    alpnProtocols:
      - h2
      - http/1.1
