---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/envoyproxy_v1alpha1.json
# Proxy template for the INTERNAL gateway (via GatewayClass envoy-internal).
# No access logs here — the external gateway's proxy (../external/envoyproxy.yaml)
# emits ECS JSON logs; internal is LAN-only and quiet.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-internal-proxy
spec:
  logging:
    level:
      default: warn # EG default; component logs add nothing at info
  provider:
    type: Kubernetes
    kubernetes:
      # node drains may never take both replicas at once 
      envoyPDB:
        minAvailable: 1
      envoyDeployment:
        replicas: 2
        pod:
          # securityContext:
          #   runAsNonRoot: true
          #   runAsUser: 65534
          #   runAsGroup: 65534
          #   fsGroup: 65534
          #   seccompProfile:
          #     type: RuntimeDefault
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: envoy
        container:
          imageRepository: mirror.gcr.io/envoyproxy/envoy
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # cpu: 1000m
              memory: 1Gi
          # securityContext:
          #   allowPrivilegeEscalation: false
          #   readOnlyRootFilesystem: true
          #   capabilities:
          #     drop:
          #       - ALL
      envoyService:
        externalTrafficPolicy: Local # Preserve ClientIP
  shutdown:
    drainTimeout: 180s
  telemetry:
    metrics:
      prometheus:
        # Gzip not Zstd: Prometheus only sends Accept-Encoding: gzip.
        compression:
          type: Gzip
