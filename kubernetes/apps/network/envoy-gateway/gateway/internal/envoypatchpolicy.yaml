---
# HSTS on the internal gateway — see ../external/envoypatchpolicy.yaml for the
# how/why. Same header, patched onto the internal https listener's route config.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: hsts-internal
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-internal
  type: JSONPatch
  jsonPatches:
    - type: "type.googleapis.com/envoy.config.route.v3.RouteConfiguration"
      name: network/envoy-internal/https
      operation:
        op: add
        path: "/response_headers_to_add"
        value:
          - header:
              key: Strict-Transport-Security
              value: "max-age=31536000; includeSubDomains"
