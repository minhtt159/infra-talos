---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # per-gateway config (each dir owns its GatewayClass + EnvoyProxy + policies)
  - ./external
  - ./internal
  # own gateway: its :80 is a real probe path, not a redirect stub
  - ./knative
  # shared: the http->https redirect binds external + internal :80 by name.
  # Deliberately not knative.
  - ./httpredirect.yaml
