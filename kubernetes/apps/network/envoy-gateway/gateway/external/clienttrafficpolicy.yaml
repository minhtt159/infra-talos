---
# Client-IP trust differs by edge shape, so each gateway gets its own
# ClientTrafficPolicy (one attaches per gateway). Everything except
# clientIPDetection + connectionLimit is duplicated — KEEP IN SYNC with
# ../internal/clienttrafficpolicy.yaml.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/clienttrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy-external
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
  # HSTS as a native late response header — replaces the EnvoyPatchPolicy
  # (no extensionApi, no controller restart, no fragile xDS route-config name).
  headers:
    lateResponseHeaders:
      set:
        - name: Strict-Transport-Security
          value: "max-age=31536000; includeSubDomains"
  # Trust exactly one XFF hop for the real client IP (feeds source.ip logging +
  # the per-IP rate-limit key). Not because cloudflared is unconditionally in
  # front — two paths reach this gateway, and the trust holds on both:
  #   - internet traffic arrives via the tunnel, where cloudflared IS the one hop
  #   - the LB IP is private, so anything connecting to it directly is on the LAN
  # A forged X-Forwarded-For therefore only gets you as far as a client we
  # already trust. That stops being true the moment this LB IP is reachable by
  # anyone untrusted — then drop this stanza, as ../internal does.
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
  connection:
    bufferLimit: 8Mi
    maxAcceptPerSocketEvent: 0
    # Absolute concurrent-connection ceiling per proxy replica. With the 8Mi
    # buffer, ~120 fully-buffering conns exhaust the 1Gi limit; 100 keeps
    # worst-case buffering under it while staying way above real cloudflared-
    # fronted concurrency. Raise if legit clients get connection-refused.
    connectionLimit:
      value: 100
      closeDelay: 1s
  http2:
    initialStreamWindowSize: 2Mi
    initialConnectionWindowSize: 32Mi
    onInvalidMessage: TerminateStream
    # Cap concurrent streams per connection — bounds HTTP/2 Rapid Reset
    # (CVE-2023-44487) stream-churn abuse. 100 is Envoy's own default; set
    # explicit so it can't drift.
    maxConcurrentStreams: 100
  http3: {}
  tcpKeepalive: {}
  timeout:
    http:
      # Slowloris protection: full request (headers+body) within this
      # window. Generous on purpose — tighten
      # after watching real upload patterns.
      requestReceivedTimeout: 30s
  tls:
    # 1.2 not 1.3: TLS-1.3-only broke the Hindsight MCP client (and any other
    # TLS-1.2 client) — handshake refused. 1.2 floor still allows 1.3.
    minVersion: "1.2"
    alpnProtocols:
      - h2
      - http/1.1
