---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/envoyextensionpolicy_v1alpha1.json
# Coraza WAF (ModSecurity-compatible) as a Wasm
# filter on the EXTERNAL gateway. Enforcing (SecRuleEngine On) since
# 2026-07: 8 days of DetectionOnly showed zero matches outside the flux
# webhook FPs carved out below.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: coraza-waf
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
  wasm:
    - name: coraza
      # WAF must never take the edge down while trust-building: if the
      # wasm module fails to load/crashes, traffic passes.
      failOpen: true
      code:
        type: Image
        image:
          # Coraza v3.3.3 + OWASP CRS v4.14.0 embedded. tinygo GC can grow
          # memory under load — watch proxy container_memory_working_set;
          # the 1Gi limit OOM-restarts if it leaks (tolerable: 2 replicas
          # + failOpen).
          url: ghcr.io/corazawaf/coraza-proxy-wasm:0.6.0
      config:
        directives_map:
          default:
            - Include @recommended-conf
            - SecRuleEngine On
            - Include @crs-setup-conf
            - Include @owasp_crs/*.conf
            # Request-side inspection only: response body inspection breaks
            # chunked/gzip streaming (ERR_INCOMPLETE_CHUNKED_ENCODING) and
            # buffers responses. Must come AFTER the includes to override
            # @recommended-conf's SecResponseBodyAccess On.
            - SecResponseBodyAccess Off
            # Body limits aligned to Cloudflare's 100MB Free/Pro upload cap
            # (CF rejects larger at the edge before it reaches us — bump both
            # if you move to Business/Enterprise). ProcessPartial: inspect up
            # to the limit, then pass rather than 413 a legit large upload.
            # NoFilesLimit keeps non-upload bodies (JSON/form) fully inspected.
            - SecRequestBodyLimit 104857600
            - SecRequestBodyNoFilesLimit 1048576
            - SecRequestBodyLimitAction ProcessPartial
          # GitHub push payloads trip CRS SQLI rules (942140/151/190 →
          # anomaly 949110) on commit-message text ("database", …) — every
          # DetectionOnly match ever logged was this. The receiver already
          # HMAC-verifies the payload (X-Hub-Signature), inspection adds
          # nothing there.
          flux-webhook:
            - SecRuleEngine Off
        default_directives: default
        per_authority_directives:
          flux-webhook.${SECRET_DOMAIN}: flux-webhook
