---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-external
  annotations:
    external-dns.kubernetes.io/target: &hostname external.hnimn.art
    # Gatus internet view: every route here inherits this - public DNS, through
    # Cloudflare Access with the gatus-access token (passes the gate only; each
    # app's own login still applies). ignore-redirect: an Access 302 must fail.
    # $$ escapes Flux postBuild; Gatus expands ${VAR} from its own env
    # (homelab-platform docs/observability/healthchecks.md).
    gatus.home-operations.com/endpoint: |
      group: internet
      client:
        dns-resolver: tcp://1.1.1.1:53
        ignore-redirect: true
      headers:
        CF-Access-Client-Id: $${GATUS_CF_ACCESS_CLIENT_ID}
        CF-Access-Client-Secret: $${GATUS_CF_ACCESS_CLIENT_SECRET}
      alerts:
        - type: discord
spec:
  # class envoy-external → EnvoyProxy envoy-external-proxy (ECS logs, WAF).
  gatewayClassName: envoy-external
  infrastructure:
    annotations:
      external-dns.kubernetes.io/hostname: *hostname
      lbipam.cilium.io/ips: "10.1.81.12" # cilium `bgp` pool; label on the Service via EnvoyProxy envoyService.labels
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: hnimn-art-production-tls
