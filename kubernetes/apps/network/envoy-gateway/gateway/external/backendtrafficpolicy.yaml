---
# One BackendTrafficPolicy per gateway (EG attaches at most one, no merge).
# Compression + connection settings are duplicated — KEEP IN SYNC with
# ../internal/backendtrafficpolicy.yaml. External-only: the global rate limit.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: envoy-external
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
  # --- common (keep in sync with ../internal) ---
  compressor:
    - type: Brotli
    - type: Gzip
    - type: Zstd
  connection:
    bufferLimit: 8Mi
  tcpKeepalive: {}
  # Per-backend ceilings so one hot/stuck upstream can't consume the proxy's
  # whole connection/request budget (explicit — Envoy's silent defaults are
  # 1024). maxParallelRetries bounds a retry storm.
  circuitBreaker:
    maxConnections: 1024
    maxPendingRequests: 256
    maxParallelRequests: 1024
    maxParallelRetries: 10
  # Passive outlier ejection: pull an endpoint out of rotation after
  # consecutive failures instead of serving through it.
  healthCheck:
    passive:
      interval: 10s
      consecutive5XxErrors: 5
      consecutiveGatewayErrors: 5
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  # Connection-level retries only (connect-failure/refused-stream/reset =
  # request not processed), so retrying is safe for non-idempotent POSTs.
  # Deliberately NOT retrying on 5xx — a per-route BTP can opt in for
  # idempotent routes.
  retry:
    numRetries: 2
    retryOn:
      triggers:
        - connect-failure
        - refused-stream
        - reset
    perRetry:
      backOff:
        baseInterval: 100ms
        maxInterval: 1s
  timeout:
    http:
      # Finite upstream timeout on the internet-facing edge: a hung backend
      # otherwise ties up a connection until Envoy's 5m stream-idle default.
      # No streaming routes ride external. Scope a per-route 0s BTP if one
      # ever does.
      requestTimeout: 300s
  # --- external-only: global rate limit ---
  # 3000 req/min (~50 rps) per distinct client IP — flood protection, not a
  # usage budget. Behind cloudflared the client IP comes from XFF
  # (numTrustedHops: 1). Counters in Valkey, fail-open (see app/helmrelease.yaml).
  rateLimit:
    type: Global
    global:
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 3000
            unit: Minute
