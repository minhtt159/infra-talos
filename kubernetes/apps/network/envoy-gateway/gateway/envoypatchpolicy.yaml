---
# HSTS on both gateways. Envoy Gateway has no native Gateway-API field for a
# gateway-wide response header, so this JSON-patches the xDS RouteConfiguration
# for each https listener. EG names route configs <namespace>/<gateway>/<listener>.
# Requires config.envoyGateway.extensionApis.enableEnvoyPatchPolicy (app/helmrelease.yaml).
# preload deliberately omitted — it's a hard-to-reverse commitment to the
# browser preload list; max-age + includeSubDomains is the reversible baseline.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: hsts-external
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-external
  type: JSONPatch
  jsonPatches:
    - type: "type.googleapis.com/envoy.config.route.v3.RouteConfiguration"
      name: network/envoy-external/https
      operation:
        op: add
        path: "/response_headers_to_add"
        value:
          - header:
              key: Strict-Transport-Security
              value: "max-age=31536000; includeSubDomains"
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: hsts-internal
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-internal
  type: JSONPatch
  jsonPatches:
    - type: "type.googleapis.com/envoy.config.route.v3.RouteConfiguration"
      name: network/envoy-internal/https
      operation:
        op: add
        path: "/response_headers_to_add"
        value:
          - header:
              key: Strict-Transport-Security
              value: "max-age=31536000; includeSubDomains"
