---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: envoy-clusters
spec:
  allowCrossNamespaceImport: true
  folderUID: network-envoy-gateway
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  configMapRef:
    name: grafana-dashboards
    key: envoy-clusters.json
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: envoy-gateway-global
spec:
  allowCrossNamespaceImport: true
  folderUID: network-envoy-gateway
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  configMapRef:
    name: grafana-dashboards
    key: envoy-gateway-global.json
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: envoy-proxy-global
spec:
  allowCrossNamespaceImport: true
  folderUID: network-envoy-gateway
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  configMapRef:
    name: grafana-dashboards
    key: envoy-proxy-global.json
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
# Partly empty: the chart's rate-limit panels hard-code a demo route key; only
# the memory panels show data. Kept as the ratelimit deep-dive; the Network
# Overview covers 429s and fail-open.
metadata:
  name: global-ratelimit
spec:
  allowCrossNamespaceImport: true
  folderUID: network-envoy-gateway
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  configMapRef:
    name: grafana-dashboards
    key: global-ratelimit.json
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: resources-monitor
spec:
  allowCrossNamespaceImport: true
  folderUID: network-envoy-gateway
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  configMapRef:
    name: grafana-dashboards
    key: resources-monitor.gen.json
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
# In-repo SRE front door (Envoy + Cilium + CoreDNS golden signals); the
# vendor dashboards above and in the Cilium folder are the drill-downs.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: network-overview
spec:
  allowCrossNamespaceImport: true
  folderUID: network
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  configMapRef:
    name: network-overview-dashboard
    key: network-overview.json
