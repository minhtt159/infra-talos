---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  interval: 1h
  # EG >=1.9 requires the Gateway API v1.6 CRDs the chart ships (1.8.3 had
  # v1.5.1), and Flux defaults upgrade.crds to Skip — without this the
  # controller upgrades past its own CRDs. Render-diff: no fields removed.
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    global:
      imageRegistry: mirror.gcr.io
    deployment:
      annotations:
        # EG doesn't self-reload its config, and Flux won't cycle the
        # controller on a values-only ConfigMap change — so config edits
        # silently don't take effect until a manual restart. Reloader watches
        # the config CM and restarts the controller when it changes.
        configmap.reloader.stakater.com/reload: envoy-gateway-config
    config:
      envoyGateway:
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              type: GatewayNamespace
        # Global rate limiting: controller deploys envoy-ratelimit once a
        # backend is configured; counters in Valkey, shared across replicas.
        # Consumed by gateway/backendtrafficpolicy.yaml.
        rateLimit:
          backend:
            type: Redis
            redis:
              url: valkey.network.svc.cluster.local:6379
          # If ratelimit service or Valkey is down, traffic PASSES
          # un-throttled — availability over strictness at the edge.
          failClosed: false
