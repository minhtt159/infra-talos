---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  interval: 1h
  values:
    global:
      imageRegistry: mirror.gcr.io
    config:
      envoyGateway:
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              type: GatewayNamespace
        # Global rate limiting: controller deploys envoy-ratelimit once a
        # backend is configured; counters in Valkey, shared across replicas.
        # Consumed by gateway/ratelimit.yaml (BackendTrafficPolicy).
        rateLimit:
          backend:
            type: Redis
            redis:
              url: valkey.network.svc.cluster.local:6379
          # If ratelimit service or Valkey is down, traffic PASSES
          # un-throttled — availability over strictness at the edge.
          failClosed: false
