---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-proxy
spec:
  jobLabel: envoy-proxy
  namespaceSelector:
    matchNames:
      - network
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
      honorLabels: true
  selector:
    matchLabels:
      app.kubernetes.io/component: proxy
      app.kubernetes.io/name: envoy
---
# The rate-limit service (RLS) exports ratelimit_service_* prometheus metrics
# on :19001 (USE_PROMETHEUS=true). Without this the global-ratelimit dashboard
# is empty — the proxy PodMonitor above only matches component: proxy.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-ratelimit
spec:
  jobLabel: envoy-ratelimit
  namespaceSelector:
    matchNames:
      - network
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      honorLabels: true
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: envoy-gateway
      app.kubernetes.io/component: ratelimit
---
# envoy-gateway controller self-metrics (reconcile errors, xDS snapshot /
# status updates) on :19001/metrics — powers the envoy-gateway-global
# dashboard, which renders empty without this.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-gateway
spec:
  namespaceSelector:
    matchNames:
      - network
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
  selector:
    matchLabels:
      control-plane: envoy-gateway
