---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: "hnimn-art-production"
spec:
  secretName: "hnimn-art-production-tls"
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "hnimn.art"
  # A wildcard covers exactly one label, so anything nested deeper than
  # <host>.hnimn.art needs its own SAN — hence the bank0 entries.
  dnsNames:
    - "hnimn.art"
    - "*.hnimn.art"
    - "*.bank0.hnimn.art"
    - "*.staging.bank0.hnimn.art"
    # ksvc hostnames: <name>-<namespace>.fn.hnimn.art
    - "*.fn.hnimn.art"
