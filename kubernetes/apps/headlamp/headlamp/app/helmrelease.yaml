---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Kubernetes UI, mainly for Knative (functions, revisions, traffic). LAN-only.
# Login via authentik OIDC: Headlamp passes the user's id_token straight to
# kube-apiserver, which trusts the authentik `kubernetes` provider as an extra
# issuer (Omni config patch). RBAC lives in kube-system/rbac.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
spec:
  chart:
    spec:
      chart: headlamp
      version: 0.45.0
      sourceRef:
        kind: HelmRepository
        name: headlamp
  interval: 1h
  values:
    config:
      oidc:
        issuerURL: https://auth.${SECRET_DOMAIN}/application/o/kubernetes/
        # authentik has no groups scope (profile carries the claim);
        # offline_access gets a refresh token for the 15 min id_token.
        scopes: profile,email,offline_access
        callbackURL: https://headlamp.${SECRET_DOMAIN}/oidc-callback
    # the chart binds its own SA to cluster-admin by default. Not needed:
    # every request uses the logged-in user's token.
    clusterRoleBinding:
      create: false
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 100
      runAsGroup: 101
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
    pluginsManager:
      enabled: true
      # ponytail: plugins are npm-installed from Artifact Hub at pod start, so
      # a restart needs internet. Bake an image if that ever bites. baseImage
      # is untracked: the annotation regex can't split an image:tag value —
      # it only runs npx, bump by hand on a node LTS change.
      baseImage: docker.io/library/node:24.21.0-alpine
      # renovate: datasource=npm depName=@headlamp-k8s/pluginctl
      version: 0.1.1
      resources:
        requests:
          cpu: 10m
          memory: 128Mi
        limits:
          memory: 512Mi
      configContent: |
        plugins:
          - name: knative
            source: https://artifacthub.io/packages/headlamp/headlamp-plugins/headlamp_knative
            version: 0.3.0-beta
    httpRoute:
      enabled: true
      labels:
        forward-auth: authentik
      annotations:
        gatus.home-operations.com/enabled: "false" # gated by authentik forward-auth
      hostnames:
        - headlamp.${SECRET_DOMAIN}
      parentRefs:
        - name: envoy-internal
          namespace: network
  valuesFrom:
    - kind: Secret
      name: headlamp-oidc
      valuesKey: client-id
      targetPath: config.oidc.clientID
    - kind: Secret
      name: headlamp-oidc
      valuesKey: client-secret
      targetPath: config.oidc.clientSecret
