---
# authentik `kubernetes` OIDC client, used by Headlamp (helmrelease.yaml valuesFrom).
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: headlamp-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: decc862e-6ce0-4612-b909-d7d8ca59855d # vaultwarden: kubernetes-oidc
        property: username
    - secretKey: client-secret
      remoteRef:
        key: decc862e-6ce0-4612-b909-d7d8ca59855d # vaultwarden: kubernetes-oidc
        property: password
