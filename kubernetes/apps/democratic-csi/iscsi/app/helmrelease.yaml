---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: truenas-iscsi
spec:
  chartRef:
    kind: OCIRepository
    name: truenas-iscsi
  interval: 1h
  values:
    # ref: https://github.com/democratic-csi/charts/blob/master/stable/democratic-csi/values.yaml
    fullnameOverride: "truenas-iscsi"

    driver:
      existingConfigSecret: truenas-iscsi-secret-config
      config:
        driver: freenas-api-iscsi

    csiDriver:
      # should be globally unique for a given cluster
      name: "org.democratic-csi.freenas-iscsi"

    storageClasses:
      - name: truenas-iscsi
        defaultClass: false
        # Retain: TrueNAS zvol survives PVC/cluster deletion; reclaim via
        # docs/runbooks/cluster-rebuild.md (PV export/reapply)
        reclaimPolicy: Retain
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          fsType: xfs
          detachedVolumesFromSnapshots: "false"
        mountOptions: []
        secrets:
          provisioner-secret:
          controller-publish-secret:
          node-stage-secret:
          node-publish-secret:
          controller-expand-secret:

    volumeSnapshotClasses:
      - name: truenas-iscsi
        parameters:
          detachedSnapshots: "true"

    controller:
      # chart defaults sidecars to --v=5, which floods logs with per-5s
      # "successfully renewed lease" + reflector watch-close noise. v=2 keeps
      # provision/attach/resize/error events. Driver's own log is unaffected.
      externalAttacher:
        verbosityLevel: 2
      externalProvisioner:
        verbosityLevel: 2
      externalResizer:
        verbosityLevel: 2
      externalSnapshotter:
        verbosityLevel: 2
      driver:
        # warn: silences per-60s Probe (liveness) + NodeGetVolumeStats shell-exec
        # traces (findmnt/df/lsblk) logged at info. Keeps warnings + errors.
        logLevel: warn
        image: &image
          registry: ghcr.io/democratic-csi/democratic-csi
          tag: next
    csiProxy:
      driver:
        image: *image
    node:
      hostPID: true
      driverRegistrar:
        verbosityLevel: 2
      driver:
        logLevel: warn
        image: *image
        extraEnv:
          - name: ISCSIADM_HOST_STRATEGY
            value: nsenter
          - name: ISCSIADM_HOST_PATH
            value: /usr/local/sbin/iscsiadm
        iscsiDirHostPath: /var/iscsi
        iscsiDirHostPathType: ""
