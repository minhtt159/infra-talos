---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: truenas-nfs
spec:
  chartRef:
    kind: OCIRepository
    name: truenas-nfs
  interval: 1h
  values:
    # ref: https://github.com/democratic-csi/charts/blob/master/stable/democratic-csi/values.yaml
    fullnameOverride: "truenas-nfs"

    driver:
      existingConfigSecret: truenas-nfs-secret-config
      config:
        driver: freenas-api-nfs

    csiDriver:
      # should be globally unique for a given cluster
      name: "org.democratic-csi.freenas-nfs"

    storageClasses:
      - name: truenas-nfs
        defaultClass: false
        # Retain: TrueNAS dataset survives PVC/cluster deletion; reclaim via
        # docs/runbooks/cluster-rebuild.md (PV export/reapply)
        reclaimPolicy: Retain
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          fsType: nfs
        mountOptions:
          - noatime
          - nfsvers=4

    volumeSnapshotClasses:
      - name: truenas
        # chart renders `parameters: null` without this — API rejects it
        parameters:
          detachedSnapshots: "true"

    controller:
      # chart defaults sidecars to --v=5, which floods logs with per-5s
      # "successfully renewed lease" + reflector watch-close noise. v=2 keeps
      # provision/attach/resize/error events. Driver's own log is unaffected.
      externalAttacher:
        verbosityLevel: 2
      externalProvisioner:
        verbosityLevel: 2
      externalResizer:
        verbosityLevel: 2
      externalSnapshotter:
        verbosityLevel: 2
      driver: &driver
        image:
          registry: ghcr.io/democratic-csi/democratic-csi
          tag: next
    node:
      driverRegistrar:
        verbosityLevel: 2
      driver: *driver
    csiProxy:
      driver: *driver
