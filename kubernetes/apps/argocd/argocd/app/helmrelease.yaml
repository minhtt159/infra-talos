---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Argo CD. Delivery plane for app environments (bank0 → staging → production),
# driven by Kargo. Flux keeps platform/infra in this repo. Never same objects.
# Argo CD stateless: state is k8s objects, redis is throwaway cache. No DB.
# ponytail: non-HA, single replicas, chart's own redis. HA wants >=3 nodes for
# redis-ha quorum. Scale a component when it actually bottlenecks.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argocd
spec:
  chartRef:
    kind: OCIRepository
    name: argocd
  interval: 1h
  values:
    global:
      domain: argocd.${SECRET_DOMAIN}
    configs:
      params:
        # TLS ends at envoy-internal. HTTPS here too = second self-signed hop,
        # no gain.
        server.insecure: true
    # No SSO yet. Chart-generated argocd-initial-admin-secret is the only
    # account. Drop dex, turn on OIDC when Authentik lands.
    dex:
      enabled: false
    # Nothing consumes Argo CD notifications. Flux already alerts.
    notifications:
      enabled: false
    controller:
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
    server:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    repoServer:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
    # Chart 10.3.0 has no applicationSet.enabled switch — ships either way.
    # Bootstrap is app-of-apps; generators sit there until they earn it.
    applicationSet:
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 256Mi
    redis:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
    redisSecretInit:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
