---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  annotations:
    # /healthz unauthenticated on argocd-server. Covers DNS, gateway, API
    # process.
    gatus.home-operations.com/endpoint: |
      path: /healthz
      conditions:
        - "[STATUS] == 200"
spec:
  hostnames:
    - "argocd.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
