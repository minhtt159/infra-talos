---
# authentik OIDC client for Argo CD. oidc.config reads it as $argocd-oidc:<key>;
# Argo CD only resolves secrets labelled part-of: argocd.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: argocd-oidc
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: clientID
      remoteRef:
        key: 4c8720ff-30ca-4d34-b047-1cdfb42f342f # vaultwarden: argocd-oidc
        property: username
    - secretKey: clientSecret
      remoteRef:
        key: 4c8720ff-30ca-4d34-b047-1cdfb42f342f # vaultwarden: argocd-oidc
        property: password
