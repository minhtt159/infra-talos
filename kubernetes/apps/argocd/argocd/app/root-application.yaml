---
# The one Argo CD object Flux owns: the app-of-apps root. Everything below the
# path it points at belongs to Argo CD alone.
# kubernetes/argocd sits next to kubernetes/apps, NOT inside it — Flux only ever
# reads kubernetes/flux/cluster (its entry point) and kubernetes/apps
# (cluster-apps). Moving that directory under kubernetes/apps would hand both
# controllers the same objects.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/minhtt159/infra-talos
    targetRevision: main
    path: kubernetes/argocd
    directory:
      recurse: true
      exclude: "README.md"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
