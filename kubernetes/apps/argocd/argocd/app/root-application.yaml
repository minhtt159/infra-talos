---
# Only Argo CD object Flux owns: the app-of-apps root. Everything under its
# path is Argo CD's alone.
# kubernetes/argocd sits NEXT TO kubernetes/apps, not inside. Flux reads only
# kubernetes/flux/cluster and kubernetes/apps. Move it inside apps and both
# controllers claim the same objects.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/minhtt159/infra-talos
    targetRevision: main
    path: kubernetes/argocd
    directory:
      recurse: true
      exclude: "README.md"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
