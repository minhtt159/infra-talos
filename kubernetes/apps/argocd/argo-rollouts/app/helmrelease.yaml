---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Argo Rollouts. Kargo verification gate: AnalysisTemplate/AnalysisRun run
# after promote, fail = freight not verified, next stage blocked.
# AnalysisRun works on plain Deployments. Canary/blue-green needs Deployment
# rewritten as Rollout — separate job, not done here.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-rollouts
spec:
  chartRef:
    kind: OCIRepository
    name: argo-rollouts
  interval: 1h
  values:
    controller:
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 256Mi
    # Traffic routers we don't run. Gateway API stays — envoy-gateway
    # implements it, so canary routing later needs no RBAC change.
    providerRBAC:
      providers:
        istio: false
        smi: false
        ambassador: false
        awsLoadBalancerController: false
        awsAppMesh: false
        traefik: false
        apisix: false
        contour: false
        glooPlatform: false
        gatewayAPI: true
