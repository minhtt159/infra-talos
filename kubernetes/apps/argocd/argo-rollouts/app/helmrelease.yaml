---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Argo Rollouts. Kargo verification gate: AnalysisTemplate/AnalysisRun run
# after promote, fail = freight not verified, next stage blocked.
# AnalysisRun works on plain Deployments. Canary/blue-green needs Deployment
# rewritten as Rollout — separate job, not done here.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-rollouts
spec:
  chartRef:
    kind: OCIRepository
    name: argo-rollouts
  interval: 1h
  values:
    controller:
      # The Gateway API traffic router, needed for canary weights on an
      # HTTPRoute. The controller downloads the binary at startup (once — a
      # restart re-downloads), so it needs egress to github releases.
      # renovate: datasource=github-releases depName=argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi
      trafficRouterPlugins:
        - name: argoproj-labs/gatewayAPI # must match what the plugin expects
          location: https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/v0.16.0/gatewayapi-plugin-linux-amd64
          sha256: 3f129e6a1ea948932f440b16dfb9eae636a065857eb27311928e5790593103c1
      # A plugin location is ONE url, so it is one architecture. This cluster is
      # mixed (arm64 RK1 workers), and a replica scheduled on arm64 would fail to
      # load an amd64 binary — latent behind leader election until failover.
      # Pin to amd64 rather than ship a plugin that works on some replicas.
      nodeSelector:
        kubernetes.io/arch: amd64
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 256Mi
    # Traffic routers we don't run. Gateway API stays — envoy-gateway
    # implements it, so canary routing later needs no RBAC change.
    providerRBAC:
      providers:
        istio: false
        smi: false
        ambassador: false
        awsLoadBalancerController: false
        awsAppMesh: false
        traefik: false
        apisix: false
        contour: false
        glooPlatform: false
        gatewayAPI: true
