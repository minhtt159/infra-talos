---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argo-rollouts
spec:
  interval: 1h
  path: ./kubernetes/apps/argocd/argo-rollouts/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: argocd
  wait: true # kargo sanity-checks Rollouts CRDs at startup
