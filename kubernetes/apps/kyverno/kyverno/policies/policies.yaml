---
# The three validate policies Enforce (blocking at admission) since their
# PolicyReports reached zero failures. Rollback: set a policy's
# validationFailureAction back to Audit. New exemptions go in
# policyexceptions.yaml; check kubectl get polr -A after changes.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    # Autogen for top-level controllers only — exclude ReplicaSet/
    # ReplicationController: they are always owned by a Deployment that is
    # already checked, so reporting them just triples the violation count
    # (and flags stale zero-replica revisions kept for rollback).
    pod-policies.kyverno.io/autogen-controllers: Deployment,StatefulSet,DaemonSet,Job,CronJob
    policies.kyverno.io/description: >-
      Mutable image tags make rollbacks and audits impossible.
      Require a pinned tag (anything but :latest or tagless).
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-pinned-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      validate:
        message: "Image tag must be pinned — ':latest' or tagless not allowed."
        foreach:
          - list: request.object.spec.containers
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:latest"
                  - key: "{{ contains(element.image, ':') }}"
                    operator: Equals
                    value: false
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-requests
  annotations:
    # Autogen for top-level controllers only — exclude ReplicaSet/
    # ReplicationController: they are always owned by a Deployment that is
    # already checked, so reporting them just triples the violation count
    # (and flags stale zero-replica revisions kept for rollback).
    pod-policies.kyverno.io/autogen-controllers: Deployment,StatefulSet,DaemonSet,Job,CronJob
    policies.kyverno.io/description: >-
      Pods without requests wreck scheduling on a small mixed-arch cluster.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-cpu-memory-requests
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces: [kube-system] # CNI/CSI daemonsets managed by charts
      validate:
        message: "CPU and memory requests are required."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-sa-token-automount
  annotations:
    # Autogen for top-level controllers only — exclude ReplicaSet/
    # ReplicationController: they are always owned by a Deployment that is
    # already checked, so reporting them just triples the violation count
    # (and flags stale zero-replica revisions kept for rollback).
    pod-policies.kyverno.io/autogen-controllers: Deployment,StatefulSet,DaemonSet,Job,CronJob
    policies.kyverno.io/description: >-
      Least privilege: pods that don't talk to the API server shouldn't
      mount a ServiceAccount token.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-explicit-automount
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - flux-system
                - kyverno
                - external-secrets
                - cert-manager
                - observability
                - democratic-csi
                - openebs
                - network # controllers legitimately need the API
                - argocd # ditto — every component watches/writes cluster state
                # (argo-rollouts lives here too)
                - kargo
                - knative-serving # operator + Serving controllers watch/write cluster state
                - headlamp # in-cluster mode reads the API CA/host from the SA mount
          # CNPG instance manager (instances + initdb/join jobs) reads its Cluster,
          # writes status and Secrets — needs the API wherever the Cluster lives.
          - resources:
              selector:
                matchExpressions:
                  - key: cnpg.io/cluster
                    operator: Exists
      validate:
        message: "Set automountServiceAccountToken: false unless the workload needs the API."
        pattern:
          spec:
            automountServiceAccountToken: false
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-litellm-signature
  annotations:
    policies.kyverno.io/description: >-
      LiteLLM images are cosign-signed with a static key; upstream rotated it
      in commit e82a3c6 (github.com/BerriAI/litellm/cosign.pub). Verify the
      signature so a tampered/typosquatted image can't run. If upstream rotates
      again, new tags are rejected until the key below is re-pinned.
spec:
  # verifyImages honours a per-rule failureAction; Enforce blocks admission.
  background: false
  rules:
    - name: check-litellm-cosign
      match:
        any:
          - resources:
              kinds: [Pod]
      verifyImages:
        - imageReferences:
            - "ghcr.io/berriai/litellm*"
          failureAction: Enforce
          # don't rewrite tag→digest in the live manifest; just verify.
          mutateDigest: false
          verifyDigest: false
          attestors:
            - entries:
                - keys:
                    publicKeys: |-
                      -----BEGIN PUBLIC KEY-----
                      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEG06dpKM+vEDnmp2zcjyXgVCXxzRg
                      JA5H2LnmwBKQafZGka6OOrWujCEWATQewiAgyD4WQdJ0pvU9RC4mvNAjvQ==
                      -----END PUBLIC KEY-----
