---
# CEL policies (policies.kyverno.io/v1). The three validate policies Deny at
# admission; rollback: set validationActions to [Audit]. New exemptions go in
# policyexceptions.yaml; check kubectl get polr -A after changes.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/description: >-
      Mutable image tags make rollbacks and audits impossible.
      Require a pinned tag (anything but :latest or tagless).
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  # top-level controllers only — ReplicaSets are owned by an already-checked
  # Deployment and would just multiply the violation count.
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        object.spec.containers.all(c,
        c.image.contains(':') && !c.image.endsWith(':latest'))
      message: "Image tag must be pinned — ':latest' or tagless not allowed."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resource-requests
  annotations:
    policies.kyverno.io/description: >-
      Pods without requests wreck scheduling on a small mixed-arch cluster.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system] # CNI/CSI daemonsets managed by charts
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        object.spec.containers.all(c,
        has(c.resources) && has(c.resources.requests) &&
        'cpu' in c.resources.requests && 'memory' in c.resources.requests)
      message: "CPU and memory requests are required."
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-sa-token-automount
  annotations:
    policies.kyverno.io/description: >-
      Least privilege: pods that don't talk to the API server shouldn't
      mount a ServiceAccount token.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - flux-system
            - kyverno
            - external-secrets
            - cert-manager
            - observability
            - truenas-csi
            - openebs
            - network # controllers legitimately need the API
            - argocd # ditto — every component watches/writes cluster state
            # (argo-rollouts lives here too)
            - kargo
            - knative-serving # operator + Serving controllers watch/write cluster state
            - headlamp # in-cluster mode reads the API CA/host from the SA mount
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  # CNPG instance manager (instances + initdb/join jobs) reads its Cluster,
  # writes status and Secrets — needs the API wherever the Cluster lives.
  # matchConditions, not objectSelector: background scans ignore objectSelector.
  matchConditions:
    - name: not-cnpg-instance
      expression: >-
        !has(object.metadata.labels) ||
        !('cnpg.io/cluster' in object.metadata.labels)
  validations:
    - expression: >-
        has(object.spec.automountServiceAccountToken) &&
        object.spec.automountServiceAccountToken == false
      message: "Set automountServiceAccountToken: false unless the workload needs the API."
---
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-litellm-signature
  annotations:
    policies.kyverno.io/description: >-
      LiteLLM images are cosign-signed with a static key; upstream rotated it
      in commit e82a3c6 (github.com/BerriAI/litellm/cosign.pub). Verify the
      signature so a tampered/typosquatted image can't run. If upstream rotates
      again, new tags are rejected until the key below is re-pinned.
spec:
  # Deny = Enforce: unsigned/mis-signed litellm images are rejected at admission.
  validationActions: [Deny]
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchImageReferences:
    - glob: "ghcr.io/berriai/litellm*"
  # don't rewrite tag→digest in the live manifest; just verify.
  validationConfigurations:
    mutateDigest: false
    verifyDigest: false
  attestors:
    - name: litellm
      cosign:
        key:
          data: |-
            -----BEGIN PUBLIC KEY-----
            MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEG06dpKM+vEDnmp2zcjyXgVCXxzRg
            JA5H2LnmwBKQafZGka6OOrWujCEWATQewiAgyD4WQdJ0pvU9RC4mvNAjvQ==
            -----END PUBLIC KEY-----
  validations:
    - expression: >-
        (images.containers + images.initContainers).map(image,
        verifyImageSignatures(image, [attestors.litellm])).all(e, e > 0)
      message: LiteLLM image signature does not verify against the pinned cosign key.
