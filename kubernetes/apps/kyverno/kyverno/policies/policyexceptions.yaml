---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kyverno.io/policyexception_v2.json
# democratic-csi pods carry 4-5 upstream-tuned sidecars each; setting
# per-sidecar requests is boilerplate with no operational value.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: democratic-csi-resource-requests
  # ClusterPolicies around it are cluster-scoped so this Kustomization sets no
  # targetNamespace; PolicyException is namespaced and must live in kyverno
  # (features.policyExceptions.namespace restriction)
  namespace: kyverno
spec:
  exceptions:
    - policyName: require-resource-requests
      ruleNames:
        - require-cpu-memory-requests
  match:
    any:
      - resources:
          namespaces:
            - democratic-csi
          kinds:
            - Pod
            - Deployment
            - DaemonSet
            - ReplicaSet
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kyverno.io/policyexception_v2.json
# CNPG operator and postgres instance pods legitimately need the API
# (controller + instance-manager failover); neither the chart nor the
# Cluster CRD exposes automountServiceAccountToken to set it explicitly.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: cloudnative-pg-sa-token
  namespace: kyverno
spec:
  exceptions:
    - policyName: restrict-sa-token-automount
      ruleNames:
        - require-explicit-automount
  match:
    any:
      - resources:
          namespaces:
            - database
          kinds:
            - Pod
            - Deployment
            - ReplicaSet
            - Job
