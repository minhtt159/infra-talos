---
# CEL PolicyExceptions (policies.kyverno.io/v1). Namespaced; must live in
# kyverno (features.policyExceptions.namespace). The policies run autogen, so
# `object` may be a Pod or its controller — match on metadata only.
# truenas-csi pods carry upstream-tuned sidecars and the chart has no sidecar
# `resources` values to set.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: truenas-csi-resource-requests
  namespace: kyverno
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: require-resource-requests
  matchConditions:
    - name: truenas-csi-namespace
      expression: object.metadata.namespace == 'truenas-csi'
---
# Covers every workload in the `database` namespace that legitimately needs the
# API token and can't disable it declaratively:
#   - CNPG operator + postgres instance pods (controller + instance-manager
#     failover); neither the chart nor the Cluster CRD exposes
#     automountServiceAccountToken.
#   - Strimzi cluster operator, entity operator (topic + user operators) and
#     KafkaNodePool/StrimziPodSet broker pods; the Strimzi CRDs don't expose
#     automountServiceAccountToken either.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: cloudnative-pg-sa-token
  namespace: kyverno
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: restrict-sa-token-automount
  matchConditions:
    - name: database-namespace
      expression: object.metadata.namespace == 'database'
---
# kube-prometheus-stack helm-hook Jobs (webhook cert-gen + CRD upgrade) have
# no chart value to set resources and run on every chart upgrade.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: kube-prometheus-stack-hook-jobs
  namespace: kyverno
spec:
  policyRefs:
    - kind: ValidatingPolicy
      name: require-resource-requests
  matchConditions:
    - name: kps-hook-jobs
      expression: >-
        object.metadata.namespace == 'observability' &&
        ['kube-prometheus-stack-admission-', 'kube-prometheus-stack-crds-'].exists(p,
        object.metadata.name.startsWith(p))
