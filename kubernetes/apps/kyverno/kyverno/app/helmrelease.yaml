---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  chart:
    spec:
      chart: kyverno
      version: 3.9.1
      sourceRef:
        kind: HelmRepository
        name: kyverno
  interval: 1h
  values:
    # PolicyExceptions accepted only from the kyverno namespace (git-managed)
    features:
      policyExceptions:
        enabled: true
        namespace: kyverno
      # don't take the cluster down if kyverno is: fail-open for admission
      forceFailurePolicyIgnore:
        enabled: true
    # dashboard ConfigMap (kyverno-grafana), imported by grafanadashboard.yaml
    grafana:
      enabled: true
    admissionController:
      # HA: a single replica blocked the cluster's admissions while its node rebooted
      replicas: 3
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      serviceMonitor:
        enabled: true
    backgroundController:
      serviceMonitor:
        enabled: true
    reportsController:
      serviceMonitor:
        enabled: true
