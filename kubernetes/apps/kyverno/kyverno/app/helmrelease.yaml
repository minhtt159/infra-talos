---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
spec:
  chart:
    spec:
      chart: kyverno
      version: 3.8.1
      sourceRef:
        kind: HelmRepository
        name: kyverno
  interval: 1h
  values:
    admissionController:
      # don't take the cluster down if kyverno is: fail-open for admission
      webhooks:
        failurePolicy: Ignore
      serviceMonitor:
        enabled: true
    backgroundController:
      serviceMonitor:
        enabled: true
    reportsController:
      serviceMonitor:
        enabled: true
