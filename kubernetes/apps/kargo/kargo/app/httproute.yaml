---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kargo
  annotations:
    # One host serves the UI and the Connect/gRPC-Web API. /healthz is
    # unauthenticated and is what the pod's own probes use.
    gatus.home-operations.com/endpoint: |
      path: /healthz
      conditions:
        - "[STATUS] == 200"
spec:
  hostnames:
    - "kargo.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: kargo-api
          port: 80
