---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Kargo's local admin account. Keys are fixed by the chart (api.secret.name):
#   ADMIN_ACCOUNT_PASSWORD_HASH      bcrypt hash of the admin password
#   ADMIN_ACCOUNT_TOKEN_SIGNING_KEY  random string used to sign ID tokens
# TODO: create the Vaultwarden item and replace the placeholder UUID below —
# see the PR description for the two commands that generate both values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: kargo-api
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_ACCOUNT_PASSWORD_HASH
      remoteRef:
        key: 00000000-0000-0000-0000-000000000000 # vaultwarden: kargo-admin
        property: password_hash
    - secretKey: ADMIN_ACCOUNT_TOKEN_SIGNING_KEY
      remoteRef:
        key: 00000000-0000-0000-0000-000000000000 # vaultwarden: kargo-admin
        property: token_signing_key
