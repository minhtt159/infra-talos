---
# Signing key is random and nobody ever reads it — generate in-cluster, never
# store it anywhere. Kargo's own docs suggest ~32 chars of base64 minus the
# symbols, so: no symbols here either.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: kargo-token-signing-key
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Kargo local admin. Key names fixed by chart (api.secret.name):
#   ADMIN_ACCOUNT_PASSWORD_HASH      bcrypt of the password you type at login —
#                                    must come from outside, generate it
#                                    in-cluster and nobody knows the plaintext
#   ADMIN_ACCOUNT_TOKEN_SIGNING_KEY  random, from the generator above
# TODO: create Vaultwarden item, swap placeholder UUID below. Generate command
# in the PR description.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-api
spec:
  # "0": generate once. On a refresh the generator makes a NEW signing key and
  # every issued token dies. Cost: rotating the password in Vaultwarden needs
  # the kargo-api Secret deleted by hand.
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: kargo-api
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ADMIN_ACCOUNT_PASSWORD_HASH: "{{ .password_hash }}"
        ADMIN_ACCOUNT_TOKEN_SIGNING_KEY: "{{ .password }}" # generator's key
  data:
    - secretKey: password_hash
      remoteRef:
        key: 00000000-0000-0000-0000-000000000000 # vaultwarden: kargo-admin
        property: password_hash
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: kargo-token-signing-key
