---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Kargo — promotion pipelines on top of Argo CD: Warehouse (watches an image or
# chart) → Freight → Stage (bank0 → staging → production), promoting by writing
# back to the app GitOps repo.
# State lives entirely in CRDs (etcd) — no database, nothing to back up beyond
# what already backs up etcd.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kargo
spec:
  chartRef:
    kind: OCIRepository
    name: kargo
  interval: 1h
  values:
    global:
      # The chart defaults these to {} and the namespace warns on `restricted`.
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: ["ALL"] }
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    api:
      host: kargo.${SECRET_DOMAIN}
      # TLS terminates at envoy-internal, so the API serves plain HTTP but must
      # still generate https:// URLs for the UI and token issuer.
      tls:
        enabled: false
        terminatedUpstream: true
      # Admin password hash + token signing key come from Vaultwarden via ESO
      # (externalsecret.yaml) — setting this stops the chart generating them,
      # which would put a bcrypt hash in git.
      secret:
        name: kargo-api
      argocd:
        urls:
          "": https://argocd.${SECRET_DOMAIN}
      # Argo Rollouts isn't installed; disabling explicitly grants less RBAC
      # than letting the startup sanity check discover it.
      rollouts:
        integrationEnabled: false
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    controller:
      rollouts:
        integrationEnabled: false
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
    managementController:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
    webhooksServer:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
    garbageCollector:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
    # ponytail: no inbound git/image webhooks — Warehouses poll on their own
    # interval. Enable this plus an envoy-external HTTPRoute when polling lag
    # actually hurts.
    externalWebhooksServer:
      enabled: false
