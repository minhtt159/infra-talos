---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Kargo's bank0 pipeline. No targetNamespace: the Project is cluster-scoped and
# creates its own namespace, everything else names it explicitly.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bank0-pipeline
spec:
  dependsOn:
    - name: kargo
  interval: 1h
  path: ./kubernetes/apps/kargo/bank0/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # false: the git credential waits on a Vaultwarden item, and the Stages wait
  # on the credential.
  wait: false
