---
# production: only accepts Freight that staging has already run AND verified.
# Promotion is manual (see projectconfig.yaml) — this Stage decides what MAY be
# promoted, a human decides when.
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: production
  namespace: bank0
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: bank0
      sources:
        stages:
          - staging
  promotionTemplate:
    spec:
      vars:
        - name: chartVersion
          value: ${{ chartFrom("oci://ghcr.io/minhtt159/charts/bank0").Version }}
      steps:
        - uses: git-clone
          config:
            repoURL: https://github.com/minhtt159/infra-talos
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          as: update
          config:
            path: ./repo/kubernetes/argocd/envs/bank0/production.yaml
            updates:
              - key: chartVersion
                value: ${{ vars.chartVersion }}
        # yaml-update's own commitMessage is just "Updated <path>", which says
        # nothing about who or what. ctx.meta.promotion.actor is the Promotion's
        # creator — a username for a UI/CLI promotion, the controller for an
        # auto-promotion. Not using git-commit's `author`: deprecated in v1.10.0,
        # removal in v1.12.0; authorship belongs in git-clone now.
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: |
              chore(bank0): promote production to ${{ vars.chartVersion }}

              Promoted-by: ${{ ctx.meta.promotion.actor }}
              Freight: ${{ ctx.targetFreight.name }}
              Promotion: ${{ ctx.promotion }}
        # Straight to main, which is unprotected. Protect it and this fails —
        # swap for the PR-opening step and give the PAT pull-requests:write.
        # Kargo's commits are unsigned, so a signed-commits rule breaks it too.
        - uses: git-push
          config:
            path: ./repo
        # No argocd-update: production's Application is manual-sync on purpose.
        # Kargo lands the commit; a human clicks sync.
