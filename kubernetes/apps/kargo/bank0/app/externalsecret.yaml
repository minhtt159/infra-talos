---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The credential Kargo pushes promotion commits with. The cred-type label is how
# Kargo finds it; repoURL is matched against the step's repoURL.
# Fine-grained PAT, scoped to THIS repo with contents:write and nothing else —
# it writes into a directory Argo CD syncs, so it is effectively deploy access.
# Not an SSH deploy key: Kargo deprecated sshPrivateKey in v1.10.0, removal in
# v1.13.0 (we run 1.11.0), because its HTTP API steps can't use one.
# TODO: create the Vaultwarden item and replace the placeholder UUID.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bank0-git
  namespace: bank0
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: bank0-git
    creationPolicy: Owner
    template:
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: https://github.com/minhtt159/infra-talos
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: 00000000-0000-0000-0000-000000000002 # TODO vaultwarden: bank0-kargo-git
        property: username
    - secretKey: password
      remoteRef:
        key: 00000000-0000-0000-0000-000000000002
        property: password
