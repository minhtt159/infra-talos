---
apiVersion: v1
kind: Namespace
metadata:
  name: _
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # baseline not restricted: chart leaves container securityContext empty.
    # We fill it via global.securityContext, but chart's own cert/migration
    # helper pods aren't covered. Warn first.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
