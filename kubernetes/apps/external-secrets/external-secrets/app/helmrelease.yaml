---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  chartRef:
    kind: OCIRepository
    name: external-secrets
  interval: 1h
  values:
    serviceMonitor:
      enabled: true
    resources: &resources
      requests:
        cpu: 10m
        memory: 64Mi
    certController:
      resources: *resources
    webhook:
      resources: *resources
