---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-secrets
      namespace: external-secrets
  path: ./kubernetes/apps/external-secrets/external-secrets/app
  targetNamespace: external-secrets
  wait: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-stores
spec:
  dependsOn:
    - name: external-secrets
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: bitwarden-cli
      namespace: external-secrets
  path: ./kubernetes/apps/external-secrets/external-secrets/stores
  # No cluster-secrets postBuild: nothing here needs it, and the
  # bitwarden-cli command has literal bash ${BW_HOST}/${BW_SESSION} that
  # strict-mode envsubst would otherwise fail on ("variable not set").
  targetNamespace: external-secrets
  wait: true
