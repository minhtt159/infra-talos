---
# Replaces kubernetes/components/sops (cluster-secrets fan-out to every namespace).
# Cutover steps in docs/secrets-migration.md — do NOT enable while the sops
# component still manages cluster-secrets, they would fight over the same Secret.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: cluster-secrets
spec:
  externalSecretName: cluster-secrets
  namespaceSelectors:
    - matchLabels: {} # all namespaces (sops component removed in the same commit)
  refreshTime: 1h
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: bitwarden-fields
    target:
      name: cluster-secrets
      creationPolicy: Owner
    data:
      - secretKey: SECRET_DOMAIN # what ${SECRET_DOMAIN} postBuild substitution reads
        remoteRef:
          key: d0b70cc8-fd26-448a-bf23-6ad096a38942 # vaultwarden: homelab-talos/cluster-secrets
          property: secret-domain # field name on the item
