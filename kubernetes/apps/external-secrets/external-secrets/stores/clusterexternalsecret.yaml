---
# Replaces kubernetes/components/sops (cluster-secrets fan-out to every namespace).
# Cutover steps in docs/secrets-migration.md — do NOT enable while the sops
# component still manages cluster-secrets, they would fight over the same Secret.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: cluster-secrets
spec:
  externalSecretName: cluster-secrets
  namespaceSelectors:
    - matchLabels: {} # all namespaces
  refreshTime: 1h
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: bitwarden-fields
    target:
      name: cluster-secrets
      creationPolicy: Owner
    data:
      - secretKey: SECRET_DOMAIN
        remoteRef:
          key: REPLACE-WITH-VAULTWARDEN-ITEM-UUID # item: "cluster-secrets"
          property: SECRET_DOMAIN
