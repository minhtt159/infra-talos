---
# Fans out the cluster-secrets Secret (e.g. ${SECRET_DOMAIN}) to every namespace
# from Vaultwarden. Sole source now that SOPS is fully decommissioned.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: cluster-secrets
spec:
  externalSecretName: cluster-secrets
  namespaceSelectors:
    - matchLabels: {} # all namespaces
  refreshTime: 1h
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: bitwarden-fields
    target:
      name: cluster-secrets
      creationPolicy: Owner
    data:
      - secretKey: SECRET_DOMAIN # what ${SECRET_DOMAIN} postBuild substitution reads
        remoteRef:
          key: d0b70cc8-fd26-448a-bf23-6ad096a38942 # vaultwarden: homelab-talos/cluster-secrets
          property: secret-domain # field name on the item
