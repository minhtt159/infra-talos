---
# Fans out the cluster-secrets Secret (e.g. ${SECRET_DOMAIN}) to every namespace
# from Vaultwarden. Sole source now that SOPS is fully decommissioned.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: cluster-secrets
spec:
  externalSecretName: cluster-secrets
  namespaceSelectors:
    - matchLabels: {} # all namespaces
  refreshTime: 1h
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: bitwarden-fields
    target:
      name: cluster-secrets
      creationPolicy: Owner
    data:
      - secretKey: SECRET_DOMAIN # what ${SECRET_DOMAIN} postBuild substitution reads
        remoteRef:
          key: d0b70cc8-fd26-448a-bf23-6ad096a38942 # vaultwarden: homelab-talos/cluster-secrets
          property: secret-domain # field name on the item
      # Cloudflare Access on the bank0 operator console (bank0-production
      # securitypolicy.yaml). Neither is confidential - the team slug is in every
      # Access login URL, the AUD in every Access JWT - but the repo has never
      # committed the team domain and the AUD changes if the app is recreated.
      - secretKey: SECRET_CF_ACCESS_TEAM
        remoteRef:
          key: 7dc9a8a1-b3cc-4f9f-82e0-0d83219a2df1 # vaultwarden: bank0 Cloudflare Access Dash
          property: SECRET_CF_ACCESS_TEAM
      - secretKey: SECRET_BANK0_PORTAL_ACCESS_AUD
        remoteRef:
          key: 7dc9a8a1-b3cc-4f9f-82e0-0d83219a2df1
          property: SECRET_BANK0_PORTAL_ACCESS_AUD
