---
# Fans out the cluster-secrets Secret (e.g. ${SECRET_DOMAIN}) to every namespace
# from Vaultwarden. Sole source now that SOPS is fully decommissioned.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: cluster-secrets
spec:
  externalSecretName: cluster-secrets
  namespaceSelectors:
    - matchLabels: {} # all namespaces
  refreshTime: 1h
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: bitwarden-fields
    target:
      name: cluster-secrets
      creationPolicy: Owner
    data:
      - secretKey: SECRET_DOMAIN # what ${SECRET_DOMAIN} postBuild substitution reads
        remoteRef:
          key: d0b70cc8-fd26-448a-bf23-6ad096a38942 # vaultwarden: homelab-talos/cluster-secrets
          property: secret-domain # field name on the item
      # bank0's Postgres role names. Not secret, but per-installation, so they
      # come from the same items that hold the passwords rather than being
      # hardcoded — CNPG's managed role, the Database owner and the app's DSN
      # all substitute these, so they can never drift apart.
      # Different store to the rest of this ExternalSecret, hence the per-entry
      # sourceRef: these are login items, and the value is the username field.
      - secretKey: BANK0_STAGING_DB_USER
        sourceRef:
          storeRef:
            kind: ClusterSecretStore
            name: bitwarden-login
        remoteRef:
          key: 9b068286-6fa4-4e9e-beb9-4dc5d500ab50 # vaultwarden: bank0-staging-db
          property: username
      - secretKey: BANK0_PRODUCTION_DB_USER
        sourceRef:
          storeRef:
            kind: ClusterSecretStore
            name: bitwarden-login
        remoteRef:
          key: e8a448e1-ba43-43b8-9ba4-271ca55c2b11 # vaultwarden: bank0-production-db
          property: username
