---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # bitwarden-cli bootstrap Secret is seeded out-of-band (SOPS-encrypted in the
  # private omni-selfhosted repo: `task cluster:seed-secrets`) — it can't come from
  # ESO itself, and it stays labelled kustomize.toolkit.fluxcd.io/prune=disabled.
  - ./bitwarden-cli.yaml
  - ./clustersecretstore.yaml
  - ./clusterexternalsecret.yaml
