---
# Vaultwarden bridge: Bitwarden CLI running `bw serve`, consumed by the
# ESO webhook ClusterSecretStores. Pattern from
# https://external-secrets.io/latest/examples/bitwarden/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name bitwarden-cli
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: *name
  template:
    metadata:
      labels:
        app: *name
    spec:
      automountServiceAccountToken: false
      # image is amd64-only — keep off the arm64 RK1 workers
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: bitwarden-cli
          image: ghcr.io/charlesthomas/bitwarden-cli:2026.3.0
          imagePullPolicy: IfNotPresent
          # container restarts reuse the pod's emptyDir; stale bw session
          # wedges the entrypoint ("Logout required before server config
          # update") — start from a clean slate every time
          command: ["sh", "-c", "rm -rf /data/.config /data/*; exec /entrypoint.sh"]
          envFrom:
            - secretRef:
                name: bitwarden-cli
          env:
            - name: HOME
              value: /data
          ports:
            - name: http
              containerPort: 8087
              protocol: TCP
          # Liveness is a plain TCP check — the old sync-in-liveness design
          # kill-looped the pod whenever Vaultwarden was slow (23 restarts).
          # Vault refresh is the vault-sync CronJob below instead.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bitwarden-cli
spec:
  selector:
    app: bitwarden-cli
  ports:
    - name: http
      port: 8087
      targetPort: http
      protocol: TCP
---
# Periodic vault refresh, decoupled from pod health. ESO refreshInterval is
# 1h, so 15m sync freshness is plenty. Failures are retried next tick and
# never restart the bridge.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bitwarden-cli-sync
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: sync
              image: mirror.gcr.io/curlimages/curl:8.17.0
              # bw serve /sync is POST-only (GET -> 405)
              args: ["-sf", "-X", "POST", "--max-time", "90", "http://bitwarden-cli:8087/sync?force=true"]
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  memory: 32Mi
