---
# Vaultwarden bridge: Bitwarden CLI running `bw serve`, consumed by the
# ESO webhook ClusterSecretStores. Pattern from
# https://external-secrets.io/latest/examples/bitwarden/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name bitwarden-cli
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: *name
  template:
    metadata:
      labels:
        app: *name
    spec:
      automountServiceAccountToken: false
      # image is amd64-only — keep off the arm64 RK1 workers
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: bitwarden-cli
          image: ghcr.io/charlesthomas/bitwarden-cli:2026.8.0
          imagePullPolicy: IfNotPresent
          # Replaces the image entrypoint: it hardcodes `bw serve --hostname
          # 0.0.0.0`, but bitwarden-cli 2026.6+ added DNS-rebinding protection
          # that then rejects the service FQDN ("disallowed Host"). `--hostname
          # all` disables host binding. Also wipes the emptyDir first — a stale
          # bw session wedges login on container restart.
          command:
            - bash
            - -c
            - |
              set -e
              rm -rf /data/.config /data/* || true
              bw config server "${BW_HOST}"
              bw login --apikey --raw
              export BW_SESSION=$(bw unlock --passwordenv BW_PASSWORD --raw)
              bw unlock --check
              exec bw serve --hostname all
          envFrom:
            - secretRef:
                name: bitwarden-cli
          env:
            - name: HOME
              value: /data
          ports:
            - name: http
              containerPort: 8087
              protocol: TCP
          # Liveness is a plain TCP check — the old sync-in-liveness design
          # kill-looped the pod whenever Vaultwarden was slow (23 restarts).
          # Vault refresh is the vault-sync CronJob below instead.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bitwarden-cli
spec:
  selector:
    app: bitwarden-cli
  ports:
    - name: http
      port: 8087
      targetPort: http
      protocol: TCP
---
# Periodic vault refresh, decoupled from pod health. ESO refreshInterval is
# 1h, so 15m sync freshness is plenty. Failures are retried next tick and
# never restart the bridge.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bitwarden-cli-sync
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: bitwarden-cli-sync # allowlisted by the NetworkPolicy
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: sync
              image: mirror.gcr.io/curlimages/curl:8.22.0
              # bw serve /sync is POST-only (GET -> 405)
              args: ["-sf", "-X", "POST", "--max-time", "90", "http://bitwarden-cli:8087/sync?force=true"]
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 5m
                  memory: 16Mi
                limits:
                  memory: 32Mi
---
# The bridge serves the ENTIRE vault over :8087 with no auth — any pod that can
# reach it can read every secret. --hostname's DNS-rebinding check is a browser
# mitigation and irrelevant here (no browser path); this is the real control.
# Selecting the pod flips it to default-deny ingress; only the ESO controller
# and the sync CronJob are allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bitwarden-cli-allow
spec:
  podSelector:
    matchLabels:
      app: bitwarden-cli
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: external-secrets
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bitwarden-cli-sync
      ports:
        - protocol: TCP
          port: 8087
