---
# THE one SOPS-encrypted secret that survives the SOPS deprecation.
# Credentials for the bitwarden-cli bridge to reach Vaultwarden.
#
# !!! PLACEHOLDER — before merging:
#   1. Fill in real values below
#   2. sops --encrypt --in-place kubernetes/apps/external-secrets/external-secrets/stores/secret.sops.yaml
apiVersion: v1
kind: Secret
metadata:
  name: bitwarden-cli
type: Opaque
stringData:
  BW_HOST: "https://REPLACE-ME.vaultwarden.host"
  BW_CLIENTID: "user.REPLACE-ME"
  BW_CLIENTSECRET: "REPLACE-ME"
  BW_USER: "REPLACE-ME@example.com"
  BW_PASSWORD: "REPLACE-ME"
