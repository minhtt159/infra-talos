---
# Lets gatus (observability) read this one secret, so its healthcheck can send
# the token. Consumed by the SecretStore in
# kubernetes/apps/observability/gatus/app/externalsecret.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: browserless-token-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["browserless-token"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: browserless-token-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: browserless-token-reader
subjects:
  - kind: ServiceAccount
    name: gatus
    namespace: observability
