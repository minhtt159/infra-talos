---
# One host serves both the CDP WebSocket (ws://…:3000?token=) and the /docs UI.
# WS upgrade is on by default in Envoy Gateway. Auth is the ?token= (ESO-gen);
# reachable only on the LAN (envoy-internal + private DNS).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: browserless
  annotations:
    # /pressure needs the token but reports whether chromium is actually
    # available, not just that the HTTP server answers. The doubled `$$`
    # escapes Flux postBuild, so gatus receives the token as a var reference
    # and expands it from its own env (see the gatus app's externalsecret.yaml).
    gatus.home-operations.com/endpoint: |
      path: /pressure
      interval: 30s
      headers:
        Authorization: Bearer $${BROWSERLESS_TOKEN}
      conditions:
        - "[STATUS] == 200"
        - "[BODY].pressure.isAvailable == true"
spec:
  hostnames:
    - "browser.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: browserless
          port: 3000
