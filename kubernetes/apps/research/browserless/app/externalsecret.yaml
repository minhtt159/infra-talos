---
# Generate a stable API token locally (no Vaultwarden item needed, never in git).
# symbols:0 so it drops cleanly into the CDP ws query string (?token=...).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: browserless-token
spec:
  length: 40
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: browserless-token
spec:
  refreshInterval: "0" # generate once; keep the token stable across reconciles
  target:
    name: browserless-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        TOKEN: "{{ .password }}" # envFrom injects this key verbatim as $TOKEN
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: browserless-token
---
# The token only exists in this namespace, so let gatus (observability) read
# this one secret — its healthcheck authenticates with it. Mirrored across by
# the SecretStore in kubernetes/apps/observability/gatus/app/externalsecret.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: browserless-token-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["browserless-token"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: browserless-token-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: browserless-token-reader
subjects:
  - kind: ServiceAccount
    name: gatus
    namespace: observability
