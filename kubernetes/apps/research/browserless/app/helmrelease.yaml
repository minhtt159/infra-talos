---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# browserless: self-hosted headless-chrome platform. Serves Hermes `browser`
# (CDP ws on :3000) + a docs/debug UI (/docs). Non-root (uid 999, no caps) so
# the ns is restricted PSA. Egress-locked (networkpolicy.yaml). Replaces steel,
# whose bundled chromium SIGTRAPs on this cluster (any arch/seccomp/caps).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: browserless
spec:
  chartRef:
    kind: OCIRepository
    name: browserless
  interval: 1h
  values:
    controllers:
      browserless:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/browserless/chromium
              tag: v2.58.1@sha256:f2950a079c3172339f1dfeac597b64ee0561e0843acb956ffec235b93bf77aff
            env:
              CONCURRENT: "3"
              TIMEOUT: "120000" # ms; kill a session after 2m idle
              QUEUED: "10"
            envFrom:
              - secretRef:
                  name: browserless-token # provides TOKEN
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  # /docs/ is the only unauthenticated route (everything else
                  # 401s without TOKEN, and a probe can't read a Secret into a
                  # header), so it's the deepest check available without an
                  # exec. Capacity is gatus's job via /pressure.
                  httpGet:
                    path: /docs/
                    port: 3000
                  initialDelaySeconds: 15
                  periodSeconds: 20
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 4Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
    persistence:
      # Chrome wants more than the default 64MB /dev/shm under real load.
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 2Gi
        globalMounts:
          - path: /dev/shm
    service:
      app:
        controller: browserless
        ports:
          http:
            port: 3000
    # One host serves both the CDP WebSocket (ws://…:3000?token=) and the /docs UI.
    # WS upgrade is on by default in Envoy Gateway. Auth is the ?token= (ESO-gen);
    # reachable only on the LAN (envoy-internal + private DNS).
    route:
      app:
        annotations:
          # /pressure needs the token but reports whether chromium is actually
          # available, not just that the HTTP server answers. The doubled `$$`
          # escapes Flux postBuild, so gatus receives the token as a var reference
          # and expands it from its own env (see the gatus app's externalsecret.yaml).
          gatus.home-operations.com/endpoint: |
            path: /pressure
            interval: 30s
            headers:
              Authorization: Bearer $${BROWSERLESS_TOKEN}
            conditions:
              - "[STATUS] == 200"
              - "[BODY].pressure.isAvailable == true"
        hostnames: ["browser.hnimn.art"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
