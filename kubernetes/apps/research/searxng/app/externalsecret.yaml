---
# Generate a stable secret_key locally (no Vaultwarden item needed, never in git)
# and render the full settings.yml into a Secret with it interpolated.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: searxng-secret
spec:
  length: 40
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng-settings
spec:
  refreshInterval: "0" # generate once; keep secret_key stable across reconciles
  target:
    name: searxng-settings
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        settings.yml: |
          use_default_settings: true
          general:
            instance_name: "hnimn search"
            debug: false
          server:
            secret_key: "{{ .password }}"
            base_url: "https://searxng.${SECRET_DOMAIN}"
            # Private LAN instance; disable the bot limiter so Hermes's JSON API
            # calls aren't blocked as non-browser traffic.
            limiter: false
            image_proxy: true
          search:
            formats:
              - html
              - json
          engines:
            # brave 429s our datacenter IP; other engines cover it. Silences the
            # SearxEngineTooManyRequestsException log noise.
            - name: brave
              disabled: true
          valkey:
            url: redis://valkey.database.svc.cluster.local:6379/0
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: searxng-secret
