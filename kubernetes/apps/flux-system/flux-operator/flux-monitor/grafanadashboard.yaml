---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
# flux-operator's maintained performance dashboards, fetched by grafana-operator
# from the release tag the cluster runs. Renovate bumps the tag in the URL in
# lockstep with the flux-operator group (flux-operator-manifests shares the v-tag).
# Per-resource reconcile state lives in the Flux Web UI.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: flux-performance
spec:
  allowCrossNamespaceImport: true
  folderUID: platform
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: prometheus
  # renovate: datasource=docker depName=ghcr.io/controlplaneio-fluxcd/flux-operator-manifests
  url: https://raw.githubusercontent.com/controlplaneio-fluxcd/flux-operator/v0.62.1/config/monitoring/dashboards/flux-performance.json
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: flux-k8s-api-performance
spec:
  allowCrossNamespaceImport: true
  folderUID: platform
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: prometheus
  # renovate: datasource=docker depName=ghcr.io/controlplaneio-fluxcd/flux-operator-manifests
  url: https://raw.githubusercontent.com/controlplaneio-fluxcd/flux-operator/v0.62.1/config/monitoring/dashboards/flux-k8s-api-performance.json
