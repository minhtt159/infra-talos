---
# The web UI impersonates the logged-in user (email + authentik groups), so
# what they can see and do is plain k8s RBAC. flux-web-admin ships with the chart.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flux-web-homelab-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flux-web-admin
subjects:
  - kind: Group
    name: homelab-admins
    apiGroup: rbac.authorization.k8s.io
