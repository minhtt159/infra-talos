---
# authentik OIDC client for the Flux web UI (helmrelease.yaml valuesFrom).
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-web-client
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: flux-web-client
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: 21e464b6-1587-4879-a56a-a39434589a7f # vaultwarden: flux-web-oidc
        property: username
    - secretKey: client-secret
      remoteRef:
        key: 21e464b6-1587-4879-a56a-a39434589a7f # vaultwarden: flux-web-oidc
        property: password
