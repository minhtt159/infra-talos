---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator
  interval: 1h
  values:
    # ref: https://github.com/controlplaneio-fluxcd/charts/blob/main/charts/flux-operator/values.yaml
    serviceMonitor:
      create: true
    # flux_resource_info & friends refresh with the FluxReport — 30s is the
    # upstream-recommended interval when Prometheus scrapes the operator
    reporting:
      interval: 30s
    # Web UI login via authentik OIDC; the UI impersonates the user for k8s RBAC
    # (rbac.yaml). Client id/secret come in through valuesFrom below.
    web:
      config:
        baseURL: https://flux.${SECRET_DOMAIN}
        authentication:
          type: OAuth2
          oauth2:
            provider: OIDC
            issuerURL: https://auth.${SECRET_DOMAIN}/application/o/flux-web/
            # The defaults add `groups` + `offline_access`; authentik has no
            # groups scope (profile carries the claim).
            scopes: [openid, profile, email]
            autoLogin: true
            impersonation:
              username: claims.email
              groups: claims.groups
    # NOTE: I made a PR to fix networkPolicy
    # https://github.com/controlplaneio-fluxcd/charts/pull/135
    # web:
    #   networkPolicy:
    #     create: false
  valuesFrom:
    - kind: Secret
      name: flux-web-client
      valuesKey: client-id
      targetPath: web.config.authentication.oauth2.clientID
    - kind: Secret
      name: flux-web-client
      valuesKey: client-secret
      targetPath: web.config.authentication.oauth2.clientSecret
