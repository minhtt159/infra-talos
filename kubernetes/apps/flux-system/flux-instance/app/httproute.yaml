---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: github-webhook
  # the receiver only answers /hook/<digest>, so 404 at /hook/ is the healthy
  # signal — it proves DNS, the gateway, and notification-controller are up
  annotations:
    # The body pins it to the receiver's Go mux; Envoy's no-route 404 is empty.
    gatus.home-operations.com/endpoint: |
      conditions:
        - "[STATUS] == 404"
        - "[BODY] == pat(*404 page not found*)"
spec:
  hostnames:
    - "flux-webhook.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: webhook-receiver
          namespace: flux-system
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /hook/
