---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# steel-browser: self-hosted browser platform (CDP + REST + session UI/replay).
# api (:3000 CDP ws + REST, :9223 inspect) + ui (:80). Runs as root (Xvfb/dbus)
# → baseline PSA ns, hardened: caps dropped, no priv-esc, no SA token, egress
# locked (networkpolicy.yaml). Serves Hermes `browser` (CDP) + dev Playwright
# (connectOverCDP) + the web UI.
# Steel only publishes :latest to ghcr → pin by DIGEST (immutable; Kyverno-safe
# as the ref doesn't end in :latest; Renovate helm-values tracks the digest).
# BETA — expect breaking changes, test on bump.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: steel
spec:
  chartRef:
    kind: OCIRepository
    name: steel
  interval: 1h
  values:
    controllers:
      api:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/steel-dev/steel-browser-api
              tag: latest@sha256:457e2a884d7d52e8a3cdbe2c1b0cdfcb99dc639bf9e5aff9a2b0a6f7f6a9e57d
            env:
              DOMAIN: "steel.${SECRET_DOMAIN}"
              CDP_DOMAIN: "steel-api.${SECRET_DOMAIN}"
              # entrypoint.sh only runs init_dbus (starts the system dbus chrome
              # needs) under DEBUG=true. Without it chrome launch_failed under our
              # hardened caps. Also enables steel's verbose logging.
              DEBUG: "true"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  initialDelaySeconds: 20
                  periodSeconds: 20
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              # root (Xvfb/dbus + nginx front). Drop ALL, add back only the caps
              # nginx-as-root needs to set up its dirs + drop to the worker user.
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "SETGID", "SETUID", "DAC_OVERRIDE", "NET_BIND_SERVICE"]
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 4Gi
      ui:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/steel-dev/steel-browser-ui
              tag: latest@sha256:9478993b5f028ad4a437ee1df19d74acc21118296a8a42a82a795865316c3372
            env:
              API_URL: http://steel-api.research-browser.svc.cluster.local:3000
            probes:
              liveness: &uprobes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *uprobes
            securityContext:
              # nginx-as-root: same minimal cap set as api.
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "SETGID", "SETUID", "DAC_OVERRIDE", "NET_BIND_SERVICE"]
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
    persistence:
      # Chrome crashes with the default 64MB /dev/shm.
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 2Gi
        advancedMounts:
          api:
            app:
              - path: /dev/shm
      exports:
        type: emptyDir
        advancedMounts:
          api:
            app:
              - path: /tmp/steel-browser-exports
    service:
      api:
        controller: api
        ports:
          http:
            port: 3000
          cdp:
            port: 9223
      ui:
        controller: ui
        ports:
          http:
            port: 80
