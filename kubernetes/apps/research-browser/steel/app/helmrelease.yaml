---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# steel-browser: self-hosted browser platform (CDP + REST + session UI/replay).
# api (:3000 CDP ws + REST, :9223 inspect) + ui (:80). Runs as root (Xvfb/dbus)
# → baseline PSA ns, hardened: caps dropped, no priv-esc, no SA token, egress
# locked (networkpolicy.yaml). Serves Hermes `browser` (CDP) + dev Playwright
# (connectOverCDP) + the web UI. BETA — pin hard, expect breaking changes.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: steel
spec:
  chartRef:
    kind: OCIRepository
    name: steel
  interval: 1h
  values:
    controllers:
      api:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/steel-dev/steel-browser-api
              tag: v0.5.3-beta
            env:
              DOMAIN: "steel.${SECRET_DOMAIN}"
              CDP_DOMAIN: "steel-api.${SECRET_DOMAIN}"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 3000
                  initialDelaySeconds: 20
                  periodSeconds: 20
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              # root (steel needs Xvfb/dbus) but no caps, no priv-esc.
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 4Gi
      ui:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/steel-dev/steel-browser-ui
              tag: v0.5.3-beta
            env:
              API_URL: http://steel-api.research-browser.svc.cluster.local:3000
            probes:
              liveness: &uprobes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *uprobes
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              seccompProfile:
                type: RuntimeDefault
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      seccompProfile:
        type: RuntimeDefault
    persistence:
      # Chrome crashes with the default 64MB /dev/shm.
      dshm:
        type: emptyDir
        medium: Memory
        sizeLimit: 2Gi
        advancedMounts:
          api:
            app:
              - path: /dev/shm
      exports:
        type: emptyDir
        advancedMounts:
          api:
            app:
              - path: /tmp/steel-browser-exports
    service:
      api:
        controller: api
        ports:
          http:
            port: 3000
          cdp:
            port: 9223
      ui:
        controller: ui
        ports:
          http:
            port: 80
