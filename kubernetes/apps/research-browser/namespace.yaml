---
apiVersion: v1
kind: Namespace
metadata:
  name: _
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # browserless runs non-root (uid 999, no caps) → restricted. Still its own
    # ns: a browser is semi-untrusted egress, bounded by no-SA-token +
    # egress-lockdown NetworkPolicy.
    pod-security.kubernetes.io/enforce: restricted
