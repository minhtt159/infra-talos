---
# One host serves both the CDP WebSocket (ws://…:3000?token=) and the /docs UI.
# WS upgrade is on by default in Envoy Gateway. Auth is the ?token= (ESO-gen);
# reachable only on the LAN (envoy-internal + private DNS).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: browserless
spec:
  hostnames:
    - "browser.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: browserless
          port: 3000
