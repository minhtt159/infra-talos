---
# Generate a stable API token locally (no Vaultwarden item needed, never in git).
# symbols:0 so it drops cleanly into the CDP ws query string (?token=...).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: browserless-token
spec:
  length: 40
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: browserless-token
spec:
  refreshInterval: "0" # generate once; keep the token stable across reconciles
  target:
    name: browserless-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        TOKEN: "{{ .password }}" # envFrom injects this key verbatim as $TOKEN
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: browserless-token
