---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugins-operator
spec:
  chart:
    spec:
      chart: intel-device-plugins-operator
      version: 0.35.0
      sourceRef:
        kind: HelmRepository
        name: intel
  interval: 1h
  values:
    manager:
      devices:
        gpu: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugins-gpu
spec:
  chart:
    spec:
      chart: intel-device-plugins-gpu
      version: 0.35.0
      sourceRef:
        kind: HelmRepository
        name: intel
  dependsOn:
    - name: intel-device-plugins-operator
  interval: 1h
  values:
    # ponytail: one dGPU shared by up to 5 inference pods; bump if contention shows
    sharedDevNum: 5
    # only run on nodes NFD labeled with an Intel GPU (mini-talos-04)
    nodeFeatureRule: true
