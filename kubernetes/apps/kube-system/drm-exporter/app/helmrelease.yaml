---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: drm-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: drm-exporter
  interval: 1h
  values:
    # plain hostPath device access — the cluster uses the classic Intel device
    # plugin, not DRA
    hostAccess:
      devDri: /dev/dri
    securityContext:
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
        # chart default also adds SYS_RAWIO for /dev/cpu MSR reads; Talos ships
        # no msr module, so PERFMON (engine utilization via perf PMU) suffices
        add: ["PERFMON"]
    # only schedule on nodes NFD-labeled with an Intel display controller
    nodeSelector:
      feature.node.kubernetes.io/pci-0300_8086.present: "true"
    monitoring:
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            grafana.internal/instance: grafana
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
