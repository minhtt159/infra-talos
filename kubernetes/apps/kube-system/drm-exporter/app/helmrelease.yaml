---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: drm-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: drm-exporter
  interval: 1h
  values:
    # plain hostPath device access — the cluster uses the classic Intel device
    # plugin, not DRA
    hostAccess:
      devDri: /dev/dri
    # privileged: the device cgroup denies /dev/dri to non-privileged
    # containers (EPERM at "discovering DRM devices"); capabilities alone
    # don't get past it
    securityContext:
      privileged: true
      allowPrivilegeEscalation: true
      readOnlyRootFilesystem: true
    # only schedule on nodes NFD-labeled with an Intel GPU; image is amd64-only
    nodeSelector:
      kubernetes.io/arch: amd64
      intel.feature.node.kubernetes.io/gpu: "true"
    monitoring:
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            grafana.internal/instance: grafana
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
