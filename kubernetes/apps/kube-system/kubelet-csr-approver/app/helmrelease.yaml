---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubelet-csr-approver
spec:
  chart:
    spec:
      chart: kubelet-csr-approver
      version: 1.2.15
      sourceRef:
        kind: HelmRepository
        name: postfinance
  interval: 1h
  values:
    # Approves kubelet SERVING cert CSRs — the pair to
    # machine.kubelet.extraArgs rotate-server-certificates: true
    # (patches/global/machine-kubelet.yaml). Without this, kubelets get no
    # serving cert and port 10250 scrapes (metrics-server, prometheus) fail.
    providerRegex: ^talos-[a-z0-9]+-[a-z0-9]+$ # Talos generated hostnames
    providerIpPrefixes:
      - 10.1.80.0/24
    # Node names don't resolve in DNS on this LAN
    bypassDnsResolution: true
    metrics:
      enable: true
      serviceMonitor:
        enabled: true
