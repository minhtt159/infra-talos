---
# Humans logging in through authentik (Headlamp today). Read-only: writes go
# through git or the admin's Omni session. The group only exists on the API once
# kube-apiserver trusts authentik; until then these bindings match nobody.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab:authentik-admins:view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: Group
    name: authentik:homelab-admins
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab:authentik-admins:cluster-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homelab:cluster-reader
subjects:
  - kind: Group
    name: authentik:homelab-admins
    apiGroup: rbac.authorization.k8s.io
