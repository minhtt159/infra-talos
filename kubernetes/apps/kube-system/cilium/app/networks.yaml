---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumloadbalancerippool_v2.json
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: bgp
spec:
  # Routed prefix OUTSIDE node subnet. Router learns /32s via BGP (bgp.yaml).
  # Nobody ARPs → no L2, no DHCP overlap, no leader blackhole. Not a UniFi network object.
  # Opt-in: Service label `announce: bgp` (Gateway: infrastructure.labels).
  allowFirstLastIPs: "No" # smoke test got handed 10.1.81.0
  blocks:
    - cidr: "10.1.81.0/24"
  serviceSelector:
    matchLabels:
      announce: bgp
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumloadbalancerippool_v2.json
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  # LEGACY L2/ARP. Delete with L2 policy once both gateways on `bgp` pool.
  allowFirstLastIPs: "No"
  blocks:
    # Narrow range, not whole /24 (router/nodes/DHCP live there). Keep out of DHCP scope.
    - start: "10.1.80.10"
      stop: "10.1.80.49"
  serviceSelector:
    matchExpressions:
      - { key: announce, operator: NotIn, values: [bgp] }
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliuml2announcementpolicy_v2alpha1.json
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
spec:
  loadBalancerIPs: true
  # Leader picked without regard to pod placement (cilium/cilium#27800) →
  # eTP:Local VIP can blackhole. BGP Services excluded, never need ARP.
  serviceSelector:
    matchExpressions:
      - { key: announce, operator: NotIn, values: [bgp] }
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  interfaces:
    - ^ens[0-9]+
    - ^eth[0-9]+
