---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumloadbalancerippool_v2.json
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: bgp
spec:
  # Routed prefix OUTSIDE node subnet. Router learns /32s via BGP (bgp.yaml).
  # Nobody ARPs → no L2, no DHCP overlap, no leader blackhole. Not a UniFi network object.
  # Opt-in: Service label `announce: bgp` (Gateway: EnvoyProxy envoyService.labels).
  allowFirstLastIPs: "No"
  blocks:
    - cidr: "10.1.81.0/24"
  serviceSelector:
    matchLabels:
      announce: bgp
