---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
# Chart ships dashboards as ConfigMaps; these bridge them into grafana-operator.
# The chart JSON declares __inputs (${DS_PROMETHEUS}), so each CR maps it.
# Skipped: hubble-l7-http-metrics-by-workload (no httpV2) and hubble-dns-namespace
# (Hubble DNS metrics need a DNS-proxy L7 policy; CoreDNS metrics cover DNS).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cilium
spec:
  allowCrossNamespaceImport: true
  folderUID: network-cilium
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  configMapRef:
    name: cilium-dashboard
    key: cilium-dashboard.json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
# Mostly empty: most panels are AWS ENI/EC2 IPAM (we run ipam: kubernetes).
metadata:
  name: cilium-operator
spec:
  allowCrossNamespaceImport: true
  folderUID: network-cilium
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  configMapRef:
    name: cilium-operator-dashboard
    key: cilium-operator-dashboard.json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: hubble
spec:
  allowCrossNamespaceImport: true
  folderUID: network-cilium
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  configMapRef:
    name: hubble-dashboard
    key: hubble-dashboard.json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: hubble-network-overview-namespace
spec:
  allowCrossNamespaceImport: true
  folderUID: network-cilium
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  configMapRef:
    name: hubble-network-overview-namespace
    key: hubble-network-overview-namespace.json
