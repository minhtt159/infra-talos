---
# authentik forward-auth (domain level): one login, cookie on the parent domain,
# covers every gated host. Fails closed if authentik is unreachable.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: hubble-ui-authentik
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: hubble-ui
  extAuth:
    timeout: 3s
    http:
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: authentik-outpost
          namespace: network
      # path, not pathOverride: EG appends the original path and the outpost
      # derives the post-login redirect from it.
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
        - x-authentik-username
        - x-authentik-groups
        - x-authentik-email
        - x-authentik-name
        - x-authentik-uid
    # EG forwards only Host/Method/Path/Authorization by default; without the
    # session cookie the outpost never sees a login and redirects forever.
    headersToExtAuth:
      - cookie
