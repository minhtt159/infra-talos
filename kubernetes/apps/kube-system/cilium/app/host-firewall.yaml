---
# Talos host firewall. INERT (not in kustomization; hostFirewall off in values).
# Before enforcing: run with policyAuditMode:true a few days, review
#   hubble observe --verdict AUDIT --identity host
# and add rules for every legit flow FIRST.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: host-firewall-control-plane
spec:
  description: "Host firewall for Talos control plane"
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  ingress:
    # Kubernetes API
    - fromEntities:
        - cluster
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # Kubelet
    - fromEntities:
        - cluster
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
    # Cilium health
    - fromEntities:
        - cluster
        - remote-node
      toPorts:
        - ports:
            - port: "4240"
              protocol: TCP
    # Cilium WireGuard
    - fromEntities:
        - cluster
        - remote-node
      toPorts:
        - ports:
            - port: "51871"
              protocol: UDP
    # Talos API
    - fromCIDR:
        - "10.1.80.0/24"
      toPorts:
        - ports:
            - port: "50000"
              protocol: TCP
            - port: "50001"
              protocol: TCP
    # etcd client+peer. Without this, hostFirewall breaks quorum.
    - fromEntities:
        - cluster
        - remote-node
      toPorts:
        - ports:
            - port: "2379"
              protocol: TCP
            - port: "2380"
              protocol: TCP
    # Prometheus scrapes: etcd 2381, KPR healthz 10256, controller-manager 10257,
    # scheduler 10259, node-exporter 9100
    - fromEntities:
        - cluster
        - remote-node
      toPorts:
        - ports:
            - port: "2381"
              protocol: TCP
            - port: "10256"
              protocol: TCP
            - port: "10257"
              protocol: TCP
            - port: "10259"
              protocol: TCP
            - port: "9100"
              protocol: TCP
    # Hubble server (relay → agent)
    - fromEntities:
        - cluster
        - remote-node
      toPorts:
        - ports:
            - port: "4244"
              protocol: TCP
    # ICMP echo
    - icmps:
        - fields:
            - type: 8
    # LB health checks
    - fromCIDR:
        - "10.1.80.0/24"
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
  egress:
    - {}
