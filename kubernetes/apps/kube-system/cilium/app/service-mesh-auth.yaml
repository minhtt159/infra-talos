---
# Cilium mutual auth (beta, deprecated 1.19, removal after 1.20). INERT, not in kustomization.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: require-identity-auth
  namespace: kube-system
spec:
  description: "Require identity-based authentication for L7 traffic"
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: cilium
  ingress:
    - fromEndpoints:
        - {}
      authentication:
        mode: required
  egress:
    - toEndpoints:
        - {}
      authentication:
        mode: required
