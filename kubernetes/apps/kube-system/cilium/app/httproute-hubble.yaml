---
# LAN-only, gated by authentik forward-auth (securitypolicy-hubble.yaml).
# Break-glass: kubectl -n kube-system port-forward svc/hubble-ui 8080:80
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  annotations:
    # ponytail: no probe while forward-auth is new. When wanted: [STATUS] == 302
    # + client.ignore-redirect (an unauthenticated probe gets authentik's 302).
    gatus.home-operations.com/enabled: "false"
spec:
  hostnames:
    - "hubble.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
