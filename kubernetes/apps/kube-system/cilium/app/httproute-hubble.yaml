---
# LAN-only, gated by authentik forward-auth (securitypolicy-hubble.yaml).
# Break-glass: kubectl -n kube-system port-forward svc/hubble-ui 8080:80
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  annotations:
    # Gated: an unauthenticated probe gets authentik's 302. Don't follow it - a
    # dead outpost shows up as 5xx/403 instead.
    gatus.home-operations.com/endpoint: |
      client:
        ignore-redirect: true
      conditions:
        - "[STATUS] == 302"
spec:
  hostnames:
    - "hubble.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
