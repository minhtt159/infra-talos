---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  chartRef:
    kind: OCIRepository
    name: cilium
  interval: 1h
  values:
    # ref: https://github.com/cilium/cilium/blob/main/install/kubernetes/cilium/values.yaml
    # Talos-required + used features only. Rest = chart defaults.

    # Talos mounts cgroup2 itself
    cgroup:
      automount:
        enabled: false
      hostRoot: /sys/fs/cgroup

    # no kube-proxy; API via KubePrism :7445
    kubeProxyReplacement: true
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445

    # explicit caps, not privileged
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE

    # single L2 → native routing, no overlay
    routingMode: native
    autoDirectNodeRoutes: true
    ipv4NativeRoutingCIDR: "10.69.0.0/16" # = Omni podSubnets
    # pin to LAN NICs (eth0 / Proxmox ens18): auto-detect also grabs
    # siderolinktun (MTU 1280), dragging pod MTU to 1185 under WireGuard
    devices: [eth+, ens+]
    ipam:
      mode: kubernetes

    bpf:
      masquerade: true # needs Omni forwardKubeDNSToHost:false (talos#10002)
      # eBPF host routing. July 2026 SideroLink break blamed on siderolinktun
      # being a device (now excluded). KubeSpan must stay off (Talos: needs legacy)
      hostLegacyRouting: false

    cni:
      exclusive: true

    # fq qdisc/EDT pacing + BBR for pods (needs eBPF host routing)
    # netkit skipped: can't switch with veth pods running, needs per-node drain
    bandwidthManager:
      enabled: true
      bbr: true

    # consistent backend pick across nodes → survives router ECMP rehash of BGP VIPs
    loadBalancer:
      algorithm: maglev

    # pod↔pod WireGuard :51871; nodeEncryption wedged etcd (July 2026, cilium#28965)
    encryption:
      enabled: true
      type: wireguard
      nodeEncryption: false

    # LB VIPs over BGP (bgp.yaml, networks.yaml); L2 announcements retired Sept 2026
    bgpControlPlane:
      enabled: true

    # embedded Envoy unused (no L7 policy); edge = ../../../network/envoy-gateway
    envoy:
      enabled: false
    gatewayAPI:
      enabled: false

    hubble:
      # bootstrap helmfile forces false; Flux flips on
      enabled: &hubble-state true
      metrics:
        # contexts + namespace labels feed the Hubble "(Namespace)" dashboards,
        # which filter on source/destination_namespace and group by source/destination
        enabled:
          - drop:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity;labelsContext=source_namespace,destination_namespace
          - tcp:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity;labelsContext=source_namespace,destination_namespace
          - flow:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity;labelsContext=source_namespace,destination_namespace
          - port-distribution:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity;labelsContext=source_namespace,destination_namespace
          - icmp:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity;labelsContext=source_namespace,destination_namespace
          # no httpV2 / dns: both need flows through Cilium Envoy / DNS proxy (L7 policy)
        serviceMonitor:
          enabled: true
        dashboards:
          enabled: true
      relay:
        enabled: *hubble-state
        replicas: 2
        rollOutPods: true
        prometheus:
          enabled: true
          serviceMonitor:
            enabled: true
      ui:
        enabled: *hubble-state
        rollOutPods: true
        replicas: 1
        ingress:
          enabled: false # not exposed
      tls:
        enabled: *hubble-state
        auto:
          enabled: true
          method: helm
          certValidityDuration: 1095

    dashboards:
      enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true

    operator:
      replicas: 2
      rollOutPods: true
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  io.cilium/app: operator
      dashboards:
        enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true

    resources:
      requests:
        cpu: 100m
        memory: 256Mi # observed ~140-190Mi
      limits:
        memory: 1Gi
    rollOutCiliumPods: true
