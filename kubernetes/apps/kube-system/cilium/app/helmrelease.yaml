---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  chartRef:
    kind: OCIRepository
    name: cilium
  interval: 1h
  values:
    # ref: https://github.com/cilium/cilium/blob/main/install/kubernetes/cilium/values.yaml
    # Only: Talos-required, used features, observability. Rest = chart defaults.

    # ── Talos ──
    # Talos mounts cgroup2 itself.
    cgroup:
      automount:
        enabled: false
      hostRoot: /sys/fs/cgroup

    # No kube-proxy on Talos. API via KubePrism (local :7445) — survives CP endpoint moves.
    kubeProxyReplacement: true
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445

    # Explicit caps instead of privileged.
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE

    # ── Routing ──
    # All nodes on one L2 → native routing, no vxlan. Plain routes per PodCIDR.
    routingMode: native
    autoDirectNodeRoutes: true # needs single L2 segment
    ipv4NativeRoutingCIDR: "10.69.0.0/16" # = podSubnets in Omni template
    ipam:
      mode: kubernetes

    bpf:
      # BPF masq, no iptables. Needs forwardKubeDNSToHost:false in Omni (talos#10002).
      masquerade: true
      # Host-netns traffic on kernel stack. BPF host routing ate SideroLink/Omni
      # flows at July 2026 bootstrap (fdae:: timeouts, wedged etcd). Pods keep full BPF.
      hostLegacyRouting: true

    cni:
      exclusive: true

    # Pod-to-pod WireGuard (UDP 51871). nodeEncryption OFF: beta, key-update
    # paradox, wedged etcd July 2026. Revisit with cilium/cilium#28965.
    encryption:
      enabled: true
      type: wireguard
      nodeEncryption: false

    # ── LB VIPs ──
    # BGP: nodes peer eBGP with router (bgp.yaml). `bgp` pool VIPs advertised as /32
    # only from nodes with local endpoint — eTP:Local honoured, no L2-leader blackhole.
    # Cilium dials out; no listening port.
    # L2/ARP: legacy `pool` in node subnet. Drop with L2 policy once gateways on BGP pool.
    bgpControlPlane:
      enabled: true
    l2announcements:
      enabled: true

    # No L7 policy; Gateway API = envoy-gateway (../../../network/envoy-gateway).
    envoy:
      enabled: false
    gatewayAPI:
      enabled: false

    # ── Hubble ──
    hubble:
      # Bootstrap helmfile forces false (DNS chicken-egg); Flux flips on.
      enabled: &hubble-state true
      metrics:
        enabled:
          - dns:query;ignoreAAAA
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction
        serviceMonitor:
          enabled: true
        dashboards:
          enabled: true
          annotations:
            grafana_folder: "Cilium"
      relay:
        enabled: *hubble-state
        replicas: 2
        rollOutPods: true
        prometheus:
          enabled: true
          serviceMonitor:
            enabled: true
      ui:
        enabled: *hubble-state
        rollOutPods: true
        replicas: 1
        ingress:
          enabled: false # via Gateway API
      tls:
        enabled: *hubble-state
        auto:
          enabled: true
          method: helm
          certValidityDuration: 1095

    # ── Observability ──
    dashboards:
      enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true

    operator:
      replicas: 2
      rollOutPods: true
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  io.cilium/app: operator
      dashboards:
        enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    rollOutCiliumPods: true

    # ── Removed July 2026 ──
    # nodeEncryption: blackholed node traffic, wedged etcd. Pod WG kept.
    # hostFirewall+policyAuditMode: audit-only, enforced nothing. CCNPs inert in git.
    # loadBalancer dsr/maglev: asymmetric-return debugging pain, no need.
    # bpf map sizing, endpointRoutes, socketLB, identityAllocationMode: defaults.
    # localRedirectPolices: typo (real: localRedirectPolicy), ignored since day one.
