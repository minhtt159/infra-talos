---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  chartRef:
    kind: OCIRepository
    name: cilium
  interval: 1h
  values:
    # ref: https://github.com/cilium/cilium/blob/main/install/kubernetes/cilium/values.yaml
    # Talos-required + used features only. Rest = chart defaults.

    # Talos mounts cgroup2 itself
    cgroup:
      automount:
        enabled: false
      hostRoot: /sys/fs/cgroup

    # no kube-proxy; API via KubePrism :7445
    kubeProxyReplacement: true
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445

    # explicit caps, not privileged
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE

    # single L2 → native routing, no overlay
    routingMode: native
    autoDirectNodeRoutes: true
    ipv4NativeRoutingCIDR: "10.69.0.0/16" # = Omni podSubnets
    ipam:
      mode: kubernetes

    bpf:
      masquerade: true # needs Omni forwardKubeDNSToHost:false (talos#10002)
      hostLegacyRouting: true # BPF host routing broke SideroLink (July 2026)

    cni:
      exclusive: true

    # pod↔pod WireGuard :51871; nodeEncryption wedged etcd (July 2026, cilium#28965)
    encryption:
      enabled: true
      type: wireguard
      nodeEncryption: false

    # LB VIPs over BGP (bgp.yaml, networks.yaml); L2 announcements retired Sept 2026
    bgpControlPlane:
      enabled: true

    # embedded Envoy unused (no L7 policy); edge = ../../../network/envoy-gateway
    envoy:
      enabled: false
    gatewayAPI:
      enabled: false

    hubble:
      # bootstrap helmfile forces false; Flux flips on
      enabled: &hubble-state true
      metrics:
        enabled:
          - dns:query;ignoreAAAA
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          # no httpV2: nothing flows through Cilium Envoy
        serviceMonitor:
          enabled: true
        dashboards:
          enabled: true
          annotations:
            grafana_folder: "Cilium"
      relay:
        enabled: *hubble-state
        replicas: 2
        rollOutPods: true
        prometheus:
          enabled: true
          serviceMonitor:
            enabled: true
      ui:
        enabled: *hubble-state
        rollOutPods: true
        replicas: 1
        ingress:
          enabled: false # not exposed
      tls:
        enabled: *hubble-state
        auto:
          enabled: true
          method: helm
          certValidityDuration: 1095

    dashboards:
      enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true

    operator:
      replicas: 2
      rollOutPods: true
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  io.cilium/app: operator
      dashboards:
        enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    rollOutCiliumPods: true
