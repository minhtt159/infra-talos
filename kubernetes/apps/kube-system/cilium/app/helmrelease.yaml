---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  chartRef:
    kind: OCIRepository
    name: cilium
  interval: 1h
  values:
    # ref: https://github.com/cilium/cilium/blob/main/install/kubernetes/cilium/values.yaml
    #
    # Layout: every value below is either (a) required on Talos, (b) a used
    # feature, or (c) observability. Anything tunable-but-default was removed
    # on purpose — chart defaults are the baseline.

    # ── (a) Required on Talos ────────────────────────────────────────────
    # Talos mounts cgroup2 at /sys/fs/cgroup itself; cilium must not remount.
    cgroup:
      automount:
        enabled: false
      hostRoot: /sys/fs/cgroup

    # Talos runs no kube-proxy (cluster.proxy.disabled) — cilium replaces it.
    # API server is reached via KubePrism (local LB on every node, port 7445),
    # so agents survive control-plane endpoint moves.
    kubeProxyReplacement: true
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445

    # Talos SELinux/capability model: the exact capability set the agent
    # needs — chart default assumes privileged, Talos wants this explicit.
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE

    # ── Routing: native on the shared L2 ─────────────────────────────────
    # All 6 nodes sit on 10.1.80.0/24, so pods route directly (no vxlan
    # overlay): each node installs plain routes to every other node's
    # PodCIDR. Simpler datapath, line-rate, easy to tcpdump.
    routingMode: native
    autoDirectNodeRoutes: true # requires: all nodes on one L2 segment
    ipv4NativeRoutingCIDR: "10.69.0.0/16" # must match podSubnets in the Omni cluster template
    ipam:
      mode: kubernetes # node PodCIDRs come from kube-controller-manager

    bpf:
      # Masquerade pod egress to the node IP in BPF (no iptables).
      # Pairs with machine-network.yaml forwardKubeDNSToHost:false
      # (talos#10002 — host-DNS 169.254 forward breaks under BPF masq).
      masquerade: true
      # Keep HOST-namespace traffic on the normal kernel stack. The BPF
      # host-routing fastpath ate SideroLink/Omni management flows during
      # the July 2026 bootstrap (fdae:: timeouts, wedged etcd). Pod traffic
      # keeps the full BPF path; only host sockets take the boring route.
      hostLegacyRouting: true

    # Only cilium manages CNI config on the node.
    cni:
      exclusive: true

    # Pod-to-pod traffic between nodes encrypted with WireGuard (UDP 51871
    # node-to-node; Talos kernel ships WG). Safe during bootstrap: no
    # workload pods exist yet when cilium first rolls out.
    # nodeEncryption stays FALSE: beta, documented key-update bootstrapping
    # paradox (docs.cilium.io encryption-wireguard), and it wedged etcd
    # during the July 2026 bootstrap. Revisit only with a healthy cluster
    # and cilium/cilium#28965 in mind.
    encryption:
      enabled: true
      type: wireguard
      nodeEncryption: false

    # ── (b) Used features ────────────────────────────────────────────────
    # LoadBalancer service IPs are announced via ARP on the LAN
    # (CiliumL2AnnouncementPolicy + CiliumLoadBalancerIPPool in networks.yaml).
    l2announcements:
      enabled: true

    # Envoy DaemonSet off (v1.19 default is on): no L7 policies in use,
    # Gateway API is handled by envoy-gateway separately.
    envoy:
      enabled: false
    gatewayAPI:
      enabled: false # ref: ../../../network/envoy-gateway/ks.yaml

    # ── Hubble (flow observability) ──────────────────────────────────────
    hubble:
      # bootstrap helmfile overrides this to false (01-apps.yaml) — DNS
      # chicken-egg; Flux enables it once coredns exists.
      enabled: &hubble-state true
      metrics:
        enabled:
          - dns:query;ignoreAAAA
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction
        serviceMonitor:
          enabled: true
        dashboards:
          enabled: true
          annotations:
            grafana_folder: "Cilium"
      relay:
        enabled: *hubble-state
        replicas: 2
        rollOutPods: true
        prometheus:
          enabled: true
          serviceMonitor:
            enabled: true
      ui:
        enabled: *hubble-state
        rollOutPods: true
        replicas: 1
        ingress:
          enabled: false # exposed via Gateway API instead
      tls:
        enabled: *hubble-state
        auto:
          enabled: true
          method: helm
          certValidityDuration: 1095

    # ── (c) Observability ────────────────────────────────────────────────
    dashboards:
      enabled: true # agent Grafana dashboards via sidecar labels
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true

    operator:
      replicas: 2
      rollOutPods: true
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  io.cilium/app: operator
      dashboards:
        enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    rollOutCiliumPods: true # restart agents on config change

    # ── Removed (deliberately, July 2026 rework) ─────────────────────────
    # encryption.nodeEncryption — blackholed node-to-node traffic mid-rollout
    #                           (wedged etcd); beta upstream. Pod-to-pod WG
    #                           kept above.
    # hostFirewall + policyAuditMode — was audit-only (enforced nothing);
    #                           host-firewall.yaml CCNPs stay in git, inert.
    #                           Re-enable both together when ready to enforce.
    # loadBalancer dsr/maglev — debugging pain (asymmetric returns) for zero
    #                           observed need; chart default SNAT is fine.
    # bpf map sizing          — premature tuning, chart defaults.
    # endpointRoutes, socketLB, identityAllocationMode, healthzBindAddr —
    #                           chart defaults already.
    # localRedirectPolices    — misspelled key (real: localRedirectPolicy),
    #                           was silently ignored since day one.
