---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumbgpclusterconfig_v2.json
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: unifi
spec:
  # all nodes peer; router accepts the node subnet as dynamic neighbours
  bgpInstances:
    - name: unifi
      localASN: 64513
      peers:
        - name: udm
          peerASN: 64512
          peerAddress: "10.1.80.1"
          peerConfigRef:
            name: udm
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumbgppeerconfig_v2.json
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: udm
spec:
  # 3/9 must match router; no graceful restart on purpose (agent restart = withdraw)
  timers:
    keepAliveTimeSeconds: 3
    holdTimeSeconds: 9
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: bgp
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumbgpadvertisement_v2.json
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: lb-vips
  labels:
    advertise: bgp
spec:
  advertisements:
    # LB VIPs of Services labelled announce=bgp; PodCIDR deliberately not advertised
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchLabels:
          announce: bgp
