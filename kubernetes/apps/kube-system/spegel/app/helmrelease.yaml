---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
spec:
  chartRef:
    kind: OCIRepository
    name: spegel
  interval: 1h
  values:
    grafanaDashboard:
      enabled: true
      mode: GrafanaOperator
      grafanaOperator:
        matchLabels:
          grafana.internal/instance: grafana
    service:
      registry:
        hostPort: 29999
    serviceMonitor:
      enabled: true
    # Talos paths. Requires a machine-config patch in the Omni template so
    # containerd keeps unpacked layers available for serving:
    #   [plugins."io.containerd.cri.v1.images"]
    #     discard_unpacked_layers = false
    spegel:
      containerdSock: /run/containerd/containerd.sock
      containerdRegistryConfigPath: /etc/cri/conf.d/hosts
    # chart default requests memory only
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 128Mi
  # The chart-rendered GrafanaDashboard doesn't expose spec.datasources, so its
  # ${DS_PROMETHEUS} input never resolves (panels query a literal datasource).
  # Patch the remap in post-render, matching the repo convention (→ prometheus).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: GrafanaDashboard
              name: spegel
            patch: |-
              apiVersion: grafana.integreatly.org/v1beta1
              kind: GrafanaDashboard
              metadata:
                name: spegel
              spec:
                datasources:
                  - inputName: DS_PROMETHEUS
                    datasourceName: prometheus
