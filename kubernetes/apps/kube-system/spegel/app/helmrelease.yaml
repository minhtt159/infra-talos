---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spegel
spec:
  chartRef:
    kind: OCIRepository
    name: spegel
  interval: 1h
  # 0.8 dropped the registry hostPort: containerd mirrors to the NodePort
  # (:30020) and the Service's trafficDistribution: PreferSameNode keeps it on
  # the local pod (Cilium needs loadBalancer.serviceTopology for that).
  # 0.8 also dropped the chart dashboard; ours is ./grafanadashboard.yaml.
  values:
    serviceMonitor:
      enabled: true
      # DaemonSet: label series by node for the dashboard's $node variable
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
    # Talos paths. Requires a machine-config patch in the Omni template so
    # containerd keeps unpacked layers available for serving:
    #   [plugins."io.containerd.cri.v1.images"]
    #     discard_unpacked_layers = false
    spegel:
      containerdSock: /run/containerd/containerd.sock
      containerdRegistryConfigPath: /etc/cri/conf.d/hosts
    # chart default requests memory only
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 128Mi
