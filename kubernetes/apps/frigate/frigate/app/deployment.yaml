---
# Detection back on the Coral TPU (turing-01, arm64/Rockchip) — frees the Intel
# dGPU (mini-talos-04) for Ollama only. Coral = PCIe /dev/apex_0 via hostPath,
# which needs a privileged pod (no Coral device plugin) + PSA privileged ns.
# NOTE: frigate config (config PVC / UI) must switch detectors back to
#   detectors:
#     coral:
#       type: edgetpu
#       device: pci
# before this rolls out, or detection stops.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name frigate
spec:
  selector:
    matchLabels:
      app: *name
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: *name
    spec:
      restartPolicy: Always
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: capability # Omni nodeLabel on turing-01 (Coral PCIe)
                    operator: In
                    values:
                      - coral
      containers:
        - name: frigate
          # -rk (Rockchip) variant: hardware video decode on the RK1
          image: ghcr.io/blakeblackshear/frigate:0.17.2-rk
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 400Mi
          ports:
            - name: webui
              containerPort: 8971
            - name: internal
              containerPort: 5000
            - name: rstp
              containerPort: 8554
            - name: webrtc
              containerPort: 8555
          volumeMounts:
            - name: coral
              mountPath: /dev/apex_0
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media/frigate
            - name: shm-volume
              mountPath: /dev/shm
          securityContext:
            privileged: true # required for the Coral hostPath device
      volumes:
        - name: coral
          hostPath:
            path: /dev/apex_0
        - name: config
          persistentVolumeClaim:
            claimName: frigate-config
        - name: media
          persistentVolumeClaim:
            claimName: frigate-media
        - name: shm-volume
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
