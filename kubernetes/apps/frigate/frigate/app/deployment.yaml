---
# Detection moved Coral TPU (turing-01, arm64) → Intel dGPU (mini-talos-04):
# non-privileged, GPU via device plugin instead of hostPath /dev/apex_0.
# NOTE: frigate config (in the config PVC / UI) must switch detectors to
#   detectors:
#     ov:
#       type: openvino
#       device: GPU
# before this rolls out, or detection stops.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: &name frigate
spec:
  selector:
    matchLabels:
      app: *name
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: *name
    spec:
      restartPolicy: Always
      automountServiceAccountToken: false
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      containers:
        - name: frigate
          # renovate will pin digest; -rk (Rockchip) variant no longer needed off the RK1
          image: ghcr.io/blakeblackshear/frigate:0.17.1
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 400Mi
            limits:
              gpu.intel.com/i915: "1"
          ports:
            - name: webui
              containerPort: 8971
            - name: internal
              containerPort: 5000
            - name: rstp
              containerPort: 8554
            - name: webrtc
              containerPort: 8555
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media/frigate
            - name: shm-volume
              mountPath: /dev/shm
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: frigate-config
        - name: media
          persistentVolumeClaim:
            claimName: frigate-media
        - name: shm-volume
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
