---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # iSCSI, not NFS: /config holds SQLite (frigate.db); Frigate docs say no
  # network FS for the DB (locking). Media stays on NFS.
  name: frigate-config-iscsi
  labels:
    app: frigate
spec:
  # Static PV adopting a pre-existing zvol; PVs are cluster state,
  # `task pv:export` backs them up.
  storageClassName: truenas-csi-iscsi
  volumeName: frigate-config-data
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
