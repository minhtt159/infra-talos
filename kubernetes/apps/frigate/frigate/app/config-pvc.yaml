---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # iSCSI, not NFS: /config holds SQLite (frigate.db); Frigate docs say no
  # network FS for the DB (locking). Media stays on NFS.
  name: frigate-config-iscsi
  labels:
    app: frigate
spec:
  storageClassName: truenas-iscsi
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
