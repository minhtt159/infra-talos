---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frigate
  # Frigate serves TLS with a self-signed cert on 8971, so the gateway-path
  # probe (and the route itself) gets "HTTP request was sent to an HTTPS
  # port": envoy speaks plaintext to the backend. Probe the service directly
  # over TLS instead. Proper fix: set `tls: enabled: false` in the frigate
  # config (UI/PVC, not git) — the documented reverse-proxy setup — then drop
  # this annotation.
  annotations:
    gatus.home-operations.com/endpoint: |
      url: https://frigate.frigate.svc:8971/
      client:
        insecure: true
spec:
  hostnames:
    - "frigate.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: frigate
          namespace: frigate
          port: 8971
