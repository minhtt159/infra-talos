---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Camera RTSP password -> env FRIGATE_RTSP_PASSWORD, referenced as {FRIGATE_RTSP_PASSWORD} in config.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate-camera
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-login
  target:
    name: frigate-camera
    creationPolicy: Owner
  data:
    - secretKey: FRIGATE_RTSP_PASSWORD
      remoteRef:
        key: 84ee79c2-3f73-4c53-8ff4-eb046f0ad4c6 # vaultwarden: homelab-talos/frigate-bot (camera user `bot`)
        property: password
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Broker password for the `frigate` MQTT user -> env FRIGATE_MQTT_PASSWORD
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frigate-mqtt
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: frigate-mqtt
    creationPolicy: Owner
  data:
    - secretKey: FRIGATE_MQTT_PASSWORD
      remoteRef:
        key: 7f3eceb6-c96a-45ad-ae7b-019e333e5b74 # vaultwarden: homelab-talos/mosquitto
        property: frigate_plain
