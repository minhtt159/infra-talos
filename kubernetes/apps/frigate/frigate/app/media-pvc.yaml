---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-media
  labels:
    app: frigate
spec:
  # Static PV adopting the democratic-csi dataset (runbook Phase 3); keeps
  # democratic's share until the Phase 4 TrueNAS sweep.
  storageClassName: truenas-csi-nfs
  volumeName: frigate-media-data
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
