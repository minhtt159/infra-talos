---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-media
  labels:
    app: frigate
spec:
  # Static PV adopting a pre-existing dataset; keeps the old NFS share until
  # the TrueNAS cleanup (homelab-platform).
  storageClassName: truenas-csi-nfs
  volumeName: frigate-media-data
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
