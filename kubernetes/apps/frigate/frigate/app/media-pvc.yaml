---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-media
  labels:
    app: frigate
spec:
  # Static PV adopting a pre-existing dataset (migration runbook Phase 3); keeps
  # the old NFS share until the Phase 4 TrueNAS sweep.
  storageClassName: truenas-csi-nfs
  volumeName: frigate-media-data
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Ti
