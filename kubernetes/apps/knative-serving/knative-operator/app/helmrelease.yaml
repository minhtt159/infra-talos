---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: knative-operator
spec:
  chart:
    spec:
      chart: knative-operator
      # Bumping this also upgrades Serving: the KnativeServing CR leaves
      # spec.version unset, so the operator installs its latest bundled
      # Serving (v1.23.1 bundles Serving 1.23.0).
      version: v1.23.1
      sourceRef:
        kind: HelmRepository
        name: knative-operator
  interval: 1h
  # chart defaults already set requests on both operator pods; its CRDs are
  # plain templates (templates/crds/), so the crds install/upgrade knobs don't apply
  values: {}
