---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# API key plus the two values that would leak topology into this public repo
# (appliance URL, pool name). helmrelease.yaml reads url/pool via valuesFrom and
# the key via truenas.existingSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: truenas-csi
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: truenas-csi-secret
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: 00000000-0000-0000-0000-000000000000 # TODO vaultwarden: homelab-talos/truenas-csi
        property: api-key
    - secretKey: url
      remoteRef:
        key: 00000000-0000-0000-0000-000000000000 # TODO vaultwarden: homelab-talos/truenas-csi
        property: url # wss://<truenas>/api/current
    - secretKey: pool
      remoteRef:
        key: 00000000-0000-0000-0000-000000000000 # TODO vaultwarden: homelab-talos/truenas-csi
        property: pool
