---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# API key plus the values that would leak topology into this public repo
# (appliance URL, pool names). helmrelease.yaml reads url/pools via valuesFrom
# and the key via truenas.existingSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: truenas-csi
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: truenas-csi-secret
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: f097d7db-0b53-49ed-a979-dd897172cbd6 # vaultwarden: homelab-talos/truenas-csi
        property: api-key
    - secretKey: url
      remoteRef:
        key: f097d7db-0b53-49ed-a979-dd897172cbd6
        property: url # wss://<truenas>/api/current
    - secretKey: pool-iscsi
      remoteRef:
        key: f097d7db-0b53-49ed-a979-dd897172cbd6
        property: pool-iscsi
    - secretKey: pool-nfs
      remoteRef:
        key: f097d7db-0b53-49ed-a979-dd897172cbd6
        property: pool-nfs
