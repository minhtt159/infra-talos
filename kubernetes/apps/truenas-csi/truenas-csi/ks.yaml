---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: truenas-csi
spec:
  # Suspended until Phase 0 of docs/runbooks/truenas-csi-migration.md is done
  # (API key scope, TLS choice). Delete this line to deploy.
  suspend: true
  dependsOn:
    - name: snapshot-controller # VolumeSnapshotClass CRD
      namespace: kube-system
  path: ./kubernetes/apps/truenas-csi/truenas-csi/app/
  targetNamespace: truenas-csi
  wait: false
